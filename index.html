  return `<div class="card" style="margin-top:16px">
    <div class="toolbar">
      <div>
        <h3>${tx('会计师部分')}</h3>
        <small style="color:var(--muted);font-weight:800">${tx('输入会计师给出的最终IVA状态和金额')} · ${key}</small>
      </div>
    </div>

    <div class="accountant-form">
      <div class="input-card"><label>${tx('会计师状态')}</label><select id="accStatus">
        <option value="credit" ${a.status==='credit'?'selected':''}>${creditLabel}</option>
        <option value="debit" ${a.status==='debit'?'selected':''}>${debitLabel}</option>
        <option value="zero" ${a.status==='zero'?'selected':''}>${zeroLabel}</option>
      </select></div>

      <div class="input-card"><label>${tx('会计师金额')}</label>
        <input id="accAmount" type="text" inputmode="decimal" pattern="[0-9.,，]*" value="${a.raw.amount??''}" placeholder="0,00">
      </div>

      <div class="input-card"><label>${tx('会计师期间开始日期')}</label>
        <input id="accStartDate" type="text" value="${startValue}" placeholder="DD/MM/YY" oninput="autoSlashDateInput(this)">
        <span class="v29-date-help">${tx('开始日期用于标记会计师覆盖范围')}</span>
      </div>

      <div class="input-card"><label>${tx('会计师数据截止日期')}</label>
        <input id="accDate" type="text" value="${dateValue}" placeholder="DD/MM/YY" oninput="autoSlashDateInput(this)">
        <span class="v29-date-help">${tx('截止日期决定系统从哪一天继续计算')}</span>
      </div>

      <div class="input-card"><label>${tx('来源')}</label><input value="${tx('会计师')}" readonly></div>

      <div class="input-card wide"><label>${tx('会计师备注')}</label>
        <textarea id="accNote" placeholder="${notePlaceholder}">${a.note||''}</textarea>
      </div>

      <div class="input-card wide accountant-form-actions">
        <button class="small-btn" onclick="saveAccountantForm('${key}')">
          <span class="material-symbols-rounded">save</span>${tx('保存会计师预估')}
        </button>
        ${a.has?`
          <button class="ghost-btn v23-settle-btn" onclick="markAccountantSettled('${key}')">
            <span class="material-symbols-rounded">task_alt</span>${tx('标记已结清')}
          </button>
          <button class="ghost-btn" onclick="clearAccountantEstimate('${key}')">
            <span class="material-symbols-rounded">delete_sweep</span>${tx('清空会计师预估')}
          </button>
        `:''}
      </div>
    </div>

    <div class="iva-config-note">
      ${tx('会计师确认期间')}: <b>${startValue} → ${dateValue}</b>。<br>
      ${tx('明确结清后才会锁定')}。${tx('被新预估替代不等于已结清')}。
    </div>

    ${v23ActiveStageHTML(key)}
    ${v22HistoryHTML(key)}
    ${v23SettlementsHTML(key)}
  </div>`;
};

/* Preserve the covered-period start when the active record is explicitly settled. */
markAccountantSettled=function(key){
  const a=getAccountantEstimate(key);
  if(!a.has)return;

  const cutoff=v23ISODate(a.date||a.raw.cutoffDate);
  const start=v29AccountantStart(a,key);
  if(!cutoff){alert(tx('请先填写有效的会计师截止日期'));return;}
  if(start && start>cutoff){alert(tx('开始日期不能晚于截止日期'));return;}

  const previousLock=v23LatestSettlementCutoff(key);
  if(previousLock && cutoff<=previousLock){
    alert(`${tx('截止日期必须晚于已结清日期')}: ${toSlashDate(previousLock)}`);
    return;
  }

  const msg=currentLang==='it'
    ? `Confermare la chiusura del periodo ${toSlashDate(start)} → ${toSlashDate(cutoff)}?\n\n${tx('此操作会锁定该截止日期及以前的数据，之后补录的旧发票只作为历史记录，不再参与当前IVA计算。')}`
    : `确认 ${toSlashDate(start)} → ${toSlashDate(cutoff)} 这一期间已结清吗？\n\n${tx('此操作会锁定该截止日期及以前的数据，之后补录的旧发票只作为历史记录，不再参与当前IVA计算。')}`;
  if(!confirm(msg))return;

  const raw=v23AccountantRaw(key);
  const c=compareAccountant(calcSummary(),key);
  const settlements=(raw.settlements&&typeof raw.settlements==='object')?{...raw.settlements}:{};
  const sid=String(Date.now())+'_'+String(state.account||'ACCOUNT');
  settlements[sid]={
    startDate:start,
    periodStart:start,
    cutoffDate:cutoff,
    status:a.status,
    amount:String(a.amount),
    version:Math.max(1,parseInt(raw.version,10)||1),
    systemNetAtSettlement:String(num(c.sys)),
    pendingAtSettlement:String(Math.max(0,num(c.amountDue))),
    settledAt:new Date().toISOString(),
    settledBy:state.account||'',
    explicit:true
  };

  const history=v23ArchiveActive(raw,'settled',Math.max(0,num(c.amountDue)),null);
  const record={
    status:'',amount:'',startDate:'',periodStart:'',date:'',cutoffDate:'',note:'',
    cleared:true,active:false,version:Math.max(1,parseInt(raw.version,10)||1),
    history,settlements,sharedPair:v19IsLinkedAccount()?'EMP_SUNSHOP':'',
    updatedBy:state.account||'',updatedAt:new Date().toISOString()
  };
  return v23PersistAccountantRecord(key,record);
};

/* Show the confirmed period anywhere the accountant-vs-system comparison appears. */
const _v29AccountantCompareBase=accountantCompareHTML;
accountantCompareHTML=function(s,key=s.adjustmentKey||accountantKeyForPeriod(),editable=false){
  const out=_v29AccountantCompareBase(s,key,editable);
  const a=getAccountantEstimate(key);
  if(!a.has)return out;
  const start=v29AccountantStart(a,key);
  const end=v23ISODate(a.date||a.raw.cutoffDate)||todayISO();
  return out+`<div class="v29-period-chip"><span class="material-symbols-rounded" style="font-size:14px">date_range</span>${tx('会计师确认期间')}: ${toSlashDate(start)} → ${toSlashDate(end)}</div>`;
};

/* Authoritative balance remains accountant amount at cutoff + movement strictly after cutoff.
   Start date is descriptive/audit scope and never causes the pre-cutoff system amount to be counted again. */
const _v29AuthoritativeBannerBase=v28AuthoritativeBannerHTML;
v28AuthoritativeBannerHTML=function(s=calcSummary(),key=(s&&s.adjustmentKey)||accountantKeyForPeriod(state.period,todayISO())){
  const out=_v29AuthoritativeBannerBase(s,key);
  const x=v28AuthoritativePosition(s,key);
  if(!x.active)return out;
  const start=v29AccountantStart(x.a,key);
  return out.replace(
    '<div class="v28-authoritative-note">',
    `<div class="v29-period-chip"><span class="material-symbols-rounded" style="font-size:14px">date_range</span>${tx('会计师确认期间')}: ${toSlashDate(start)} → ${toSlashDate(x.cutoff)}</div><div class="v28-authoritative-note">`
  );
};

if(typeof appUnlocked!=='undefined'&&appUnlocked&&state.account){setTimeout(render,0)}
</script>

<script>

  '这笔营业额属于会计师截止日及以前，保存后只作为历史记录，不会再次影响当前IVA。确定保存吗？':'Questa chiusura rientra nella data limite del commercialista o in una data precedente. Verrà salvata solo nello storico e non modificherà di nuovo l’IVA corrente. Salvare?',

const V30_AUTH_KEY='__current_authority__';

function v30StrictISO(v){
  const raw=String(v??'').trim();
  if(!raw)return '';
  const d=normalizeDateValue(raw);
  return /^\d{4}-\d{2}-\d{2}$/.test(d||'')?d:'';
}

function v30EstimateFromRaw(raw,sourceKey=''){
  raw=raw||{};
  const active=v23RecordIsActive(raw);
  const amount=Math.max(0,num(raw.amount));
  const status=String(raw.status||'');
  const signed=status==='debit'?amount:status==='credit'?-amount:0;
  const cutoff=v30StrictISO(raw.cutoffDate||raw.date||'');
  return {
    has:active,status,amount,signed,date:cutoff,cutoff,
    startDate:v30StrictISO(raw.startDate||raw.periodStart||''),
    note:raw.note||'',raw,sourceKey:raw.sourceKey||sourceKey,
    version:Math.max(1,parseInt(raw.version,10)||1)
  };
}

function v30EstimateStore(){
  return v19IsLinkedAccount()
    ? (v20SharedState.accountantEstimates||{})
    : ((state.data&&state.data.accountantEstimates)||{});
}

/* One global authority record. Existing installations without V30 are safely migrated in-memory
   by choosing the active record with the LATEST cutoff date (then latest update timestamp). */
function v30GetAuthority(){
  const store=v30EstimateStore();
  const explicit=v30EstimateFromRaw(store[V30_AUTH_KEY]||{},V30_AUTH_KEY);
  if(explicit.has)return explicit;

  const candidates=Object.entries(store)
    .filter(([k])=>k!==V30_AUTH_KEY)
    .map(([k,r])=>v30EstimateFromRaw(r,k))
    .filter(x=>x.has&&x.cutoff)
    .sort((a,b)=>{
      const d=String(b.cutoff).localeCompare(String(a.cutoff));
      if(d)return d;
      return String(b.raw.updatedAt||'').localeCompare(String(a.raw.updatedAt||''));
    });
  return candidates[0]||v30EstimateFromRaw({},'');
}

function v30PersistAuthority(sourceKey,status,amount,start,cutoff,note){
  const old=v30EstimateStore()[V30_AUTH_KEY]||{};
  const nextVersion=v23NextVersion(old);
  const history=v23ArchiveActive(old,'superseded',0,nextVersion);
  const settlements=(old.settlements&&typeof old.settlements==='object')?{...old.settlements}:{};
  const cleanAmount=status==='zero'?0:Math.max(0,num(amount));
  const record={
    status:String(status||''),amount:String(cleanAmount),startDate:start,periodStart:start,
    date:cutoff,cutoffDate:cutoff,note:String(note||''),cleared:false,active:true,
    version:nextVersion,sourceKey:String(sourceKey||''),history,settlements,
    sharedPair:v19IsLinkedAccount()?'EMP_SUNSHOP':'',updatedBy:state.account||'',updatedAt:new Date().toISOString()
  };
  return v23PersistAccountantRecord(V30_AUTH_KEY,record);
}

/* Strong save guardrails. A newer accountant update may have the same cutoff (correction)
   or a later cutoff, but never an older cutoff. */
const _v30SaveAccountantBase=saveAccountantEstimate;
saveAccountantEstimate=async function(key,status,amount,date,note,startDate){
  status=['credit','debit','zero'].includes(status)?status:'credit';
  const cutoff=v30StrictISO(date);
  const start=v30StrictISO(startDate)||v29DefaultPeriodStart(key);
  const current=v30GetAuthority();
  const cleanAmount=status==='zero'?0:Math.max(0,num(amount));

  if(!cutoff||!start){alert(tx('请输入有效的会计师开始日期和截止日期'));return false;}
  if(start>cutoff){alert(tx('开始日期不能晚于截止日期'));return false;}
  if(cutoff>todayISO()){alert(tx('会计师截止日期不能晚于今天'));return false;}
  if(status!=='zero' && !(cleanAmount>0)){alert(tx('请输入有效的会计师金额'));return false;}
  if(current.has&&current.cutoff&&cutoff<current.cutoff){
    alert(`${tx('新截止日期不能早于当前会计师截止日期')}: ${toSlashDate(current.cutoff)}`);
    return false;
  }

  const result=await _v30SaveAccountantBase(key,status,String(cleanAmount),cutoff,note,start);
  if(result===false)return false;
  await v30PersistAuthority(key,status,cleanAmount,start,cutoff,note);
  return true;
};

/* Current effective IVA ALWAYS uses the latest accountant authority when one exists.
   Old system/accountant values remain audit-only. */
const _v30AuthoritativePositionBase=v28AuthoritativePosition;
v28AuthoritativePosition=function(s=calcSummary(),key=(s&&s.adjustmentKey)||accountantKeyForPeriod(state.period,todayISO())){
  const a=v30GetAuthority();
  if(!a.has)return _v30AuthoritativePositionBase(s,key);

  const linked=v19IsLinkedAccount();
  let rawSystemNet=systemSignedNet(s);
  if(linked){
    const pair=linkedPairSummaries();
    if(pair)rawSystemNet=linkedCompensationFromSigned(pair.emp.net,pair.sun.net).groupNet;
  }

  const cutoff=a.cutoff||todayISO();
  const calculationKey=a.sourceKey||key;
  let delta=0,details=null;
  if(linked){
    const pairData=v9LinkedDatas();
    if(pairData){
      const emp=v28DeltaForData(pairData.emp,calculationKey,cutoff,todayISO());
      const sun=v28DeltaForData(pairData.sun,calculationKey,cutoff,todayISO());
      delta=num(emp.net)+num(sun.net);
      details={emp,sun};
    }
  }else{
    details=v28DeltaForData(state.data||{},calculationKey,cutoff,todayISO());
    delta=num(details.net);
  }

  const baseline=num(a.signed);
  const effectiveNet=baseline+delta;
  const st=v28SignedStatus(effectiveNet);
  return {a,key:calculationKey,requestedKey:key,linked,active:true,cutoff,baseline,delta,effectiveNet,rawSystemNet,details,...st};
};

function v30AuthorityHistoryRows(){
  const raw=v30EstimateStore()[V30_AUTH_KEY]||{};
  const hist=(raw.history&&typeof raw.history==='object')?raw.history:{};
  return Object.entries(hist).map(([id,r])=>({id,...(r||{})})).sort((a,b)=>{
    const d=String(b.cutoffDate||b.date||'').localeCompare(String(a.cutoffDate||a.date||''));
    if(d)return d;
    return String(b.closedAt||b.updatedAt||'').localeCompare(String(a.closedAt||a.updatedAt||''));
  });
}

function v30AuthorityPanelHTML(){
  const a=v30GetAuthority();
  if(!a.has)return `<div class="v30-safe-card"><div class="v30-safe-head"><div class="v30-safe-title"><span class="material-symbols-rounded">shield</span>${tx('防出错模式')}</div><span class="v30-safe-badge">${tx('没有会计师记录时才按系统计算')}</span></div><div class="v30-safe-note">${tx('最新会计师记录唯一生效')}。${tx('旧会计师记录仅保留历史')}。</div></div>`;
  const hist=v30AuthorityHistoryRows();
  const historyHTML=hist.length?`<details class="v30-history"><summary>${tx('当前会计师历史')} (${hist.length})</summary>${hist.slice(0,12).map(r=>`<div class="v30-history-row"><b>V${r.version||'—'}</b><span>${accountantStatusLabel(r.status||'')} · ${money(Math.max(0,num(r.amount)))}</span><span>${toSlashDate(v30StrictISO(r.startDate||r.periodStart||''))||'—'} → ${toSlashDate(v30StrictISO(r.cutoffDate||r.date||''))||'—'}</span></div>`).join('')}</details>`:'';
  return `<div class="v30-safe-card">
    <div class="v30-safe-head"><div class="v30-safe-title"><span class="material-symbols-rounded">verified_user</span>${tx('当前权威记录')}</div><span class="v30-safe-badge">${tx('全系统生效')}</span></div>
    <div class="v30-safe-grid">
      <div class="v30-safe-box"><small>${tx('版本')}</small><b>V${a.version}</b></div>
      <div class="v30-safe-box"><small>${tx('会计师状态')}</small><b>${accountantStatusLabel(a.status)} · ${money(a.amount)}</b></div>
      <div class="v30-safe-box"><small>${tx('会计师确认期间')}</small><b>${toSlashDate(a.startDate||v29DefaultPeriodStart(a.sourceKey))} → ${toSlashDate(a.cutoff)}</b></div>
      <div class="v30-safe-box"><small>${tx('来源期间')}</small><b>${a.sourceKey||'—'}</b></div>
    </div>
    <div class="v30-safe-note">${tx('最新会计师记录唯一生效')}；${tx('旧会计师记录仅保留历史')}。${tx('截止日后的数据会自动更新当前IVA')}。</div>
    ${historyHTML}
  </div>`;
}

/* Put the global safety card before the accountant input form. */
const _v30AccountantFormBase=accountantFormHTML;
accountantFormHTML=function(s,key=s.adjustmentKey||accountantKeyForPeriod()){
  return v30AuthorityPanelHTML()+_v30AccountantFormBase(s,key);
};

function v30CoveredByAuthority(date){
  const a=v30GetAuthority();
  const d=v30StrictISO(date);
  return !!(a.has&&a.cutoff&&d&&d<=a.cutoff);
}
function v30CoveredBadge(r){
  const d=v9RawInvoiceDate(r);
  return v30CoveredByAuthority(d)?`<span class="v30-covered-badge" title="${tx('该日期已包含在会计师基准中')}"><span class="material-symbols-rounded">history</span>${tx('会计师已覆盖')}</span>`:'';
}

/* Visually mark invoices that are intentionally audit-only for the live IVA balance. */
miniTable=function(rows){
  rows=(rows||[]).map(normalizeFatturaAmounts);
  return `<div class="table-wrap"><table class="table"><thead><tr>${['日期','供应商','开票日期','收到日期','未税金额','税额','总金额','状态'].map(x=>`<th>${tx(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><td>${r.data||''}</td><td>${r.fornitore||''}</td><td>${toSlashDate(r.emissione||'')}${v30CoveredBadge(r)}</td><td>${toSlashDate(r.ricezione||'')}</td><td>${money(r.imponibile)}</td><td>${money(r.imposta)}</td><td>${money(r.totale)}</td><td>${tx(r.stato||'')}</td></tr>`).join('')||`<tr><td colspan="8">${tx('暂无数据')}</td></tr>`}</tbody></table></div>`;
};

fullTable=function(rows){
  return `<div class="table-wrap"><table class="table"><thead><tr>${['日期','供应商','发票号','开票日期','收到日期','类别','付款方式','IVA税率%','未税金额','税额','总金额','状态','备注',''].map(x=>`<th>${tx(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><td>${rowInput(r.id,'data',r.data)}</td><td>${rowInput(r.id,'fornitore',r.fornitore)}</td><td>${rowInput(r.id,'numero',r.numero)}</td><td>${rowInput(r.id,'emissione',r.emissione)}${v30CoveredBadge(r)}</td><td>${rowInput(r.id,'ricezione',r.ricezione)}</td><td>${rowInput(r.id,'categoria',r.categoria)}</td><td>${rowInput(r.id,'pagamento',r.pagamento)}</td><td>${rowInput(r.id,'ivaPercent',r.ivaPercent,'number')}</td><td>${rowInput(r.id,'imponibile',r.imponibile,'number')}</td><td>${rowInput(r.id,'imposta',r.imposta,'number')}</td><td><b>${money(r.totale)}</b></td><td><select onchange="updateFattura('${r.id}','stato',this.value)">${['已登记','待检查','已付款'].map(s=>`<option value="${s}" ${r.stato===s?'selected':''}>${tx(s)}</option>`).join('')}</select></td><td><textarea oninput="updateFattura('${r.id}','note',this.value)">${r.note||''}</textarea></td><td><button class="ghost-btn" onclick="deleteFattura('${r.id}')"><span class="material-symbols-rounded">delete</span></button></td></tr>`).join('')}</tbody></table></div>`;
};

/* Live warning inside the invoice modal. */
const _v30OpenFatturaBase=openFatturaModal;
openFatturaModal=function(){
  _v30OpenFatturaBase();
  const grid=document.querySelector('#fatturaModal .modal-grid');
  if(!grid)return;
  const guard=document.createElement('div');
  guard.id='v30InvoiceGuard';guard.className='v30-invoice-guard safe';
  grid.appendChild(guard);
  const refresh=()=>{
    const raw=String($('mEmissione')?.value||$('mData')?.value||'').trim();
    const d=v30StrictISO(raw);
    if(v30CoveredByAuthority(d)){
      guard.className='v30-invoice-guard covered';
      guard.innerHTML=`<b>${tx('会计师已覆盖')}</b> · ${toSlashDate(d)} · ${tx('保存为历史记录，不影响当前IVA')}`;
    }else{
      guard.className='v30-invoice-guard safe';
      guard.innerHTML=`<b>${tx('截止日后的数据会自动更新当前IVA')}</b>`;
    }
  };
  ['mEmissione','mData'].forEach(id=>$(id)?.addEventListener('input',refresh));
  refresh();
};

const _v30SaveFatturaBase=saveFatturaModal;
saveFatturaModal=function(){
  const raw=String($('mEmissione')?.value||'').trim();
  const fallback=String($('mData')?.value||'').trim();
  const d=v30StrictISO(raw||fallback);
  if(!d){alert(tx('发票开票日期不能为空'));return;}
  if(v30CoveredByAuthority(d)){
    const ok=confirm(tx('这张发票属于会计师截止日及以前，保存后只作为历史记录，不会再次影响当前IVA。确定保存吗？'));
    if(!ok)return;
  }
  return _v30SaveFatturaBase();
};

/* Same protection for retroactive daily sales/IVA entries. */
const _v30AddChiusuraBase=addChiusuraManual;
addChiusuraManual=function(){
  const d=v30StrictISO($('chiusuraDateInput')?.value||state.chiusuraDate||todayISO());
  if(v30CoveredByAuthority(d)){
    const ok=confirm(tx('这笔营业额属于会计师截止日及以前，保存后只作为历史记录，不会再次影响当前IVA。确定保存吗？'));
    if(!ok)return;
  }
  return _v30AddChiusuraBase();
};

/* Clearing the currently authoritative source also retires the global authority, preserving history. */
const _v30ClearAccountantBase=clearAccountantEstimate;
clearAccountantEstimate=async function(key){
  const before=v30GetAuthority();
  const isCurrent=before.has && before.sourceKey===key;
  const result=await _v30ClearAccountantBase(key);
  if(isCurrent){
    const old=v30EstimateStore()[V30_AUTH_KEY]||{};
    if(v23RecordIsActive(old)){
      const history=v23ArchiveActive(old,'cleared',0,null);
      const record={status:'',amount:'',startDate:'',periodStart:'',date:'',cutoffDate:'',note:'',cleared:true,active:false,version:Math.max(1,parseInt(old.version,10)||1),sourceKey:key,history,settlements:(old.settlements&&typeof old.settlements==='object')?{...old.settlements}:{},sharedPair:v19IsLinkedAccount()?'EMP_SUNSHOP':'',updatedBy:state.account||'',updatedAt:new Date().toISOString()};
      await v23PersistAccountantRecord(V30_AUTH_KEY,record);
    }
  }

};

if(typeof appUnlocked!=='undefined'&&appUnlocked&&state.account){setTimeout(render,0)}

<!-- V31: distinguish EDIT CURRENT accountant record vs ADD NEW accountant record -->
<style>
.v31-mode-note{margin-top:8px;padding:9px 10px;border:1px dashed var(--line);border-radius:12px;background:var(--bg);font-size:10px;font-weight:800;line-height:1.45;color:var(--muted)}

<script>
Object.assign(it,{
  '保存当前记录修改':'Salva modifiche alla registrazione corrente',
  '新增会计师记录':'Nuova registrazione commercialista',
  '保存为新会计师记录':'Salva come nuova registrazione',
  '取消新增':'Annulla nuova registrazione',
  '当前为编辑模式':'Modalità modifica corrente',
  '当前为新增模式':'Modalità nuova registrazione',
  '编辑当前记录会整体重新计算，但不会生成新版本':'La modifica della registrazione corrente ricalcola tutto senza creare una nuova versione',
  '只有新增记录才会替换旧会计师基准':'Solo una nuova registrazione sostituisce la base precedente del commercialista',
  '新会计师记录的截止日期必须晚于当前记录':'La data limite della nuova registrazione deve essere successiva a quella corrente',
  '没有会计师记录，当前按系统预估计算':'Nessuna registrazione del commercialista: viene usata la stima del sistema',
  '第一条会计师记录':'Prima registrazione commercialista'
});

state.accountantEntryMode=state.accountantEntryMode||'edit';

function v31RawStoreRecord(k){
  return (v30EstimateStore()||{})[k]||{};
}

function v31BuildRecord(oldRaw,status,amount,start,cutoff,note,sourceKey){
  oldRaw=oldRaw||{};
  const cleanAmount=status==='zero'?0:Math.max(0,num(amount));
  return {
    ...oldRaw,
    status:String(status||''),
    amount:String(cleanAmount),
    startDate:start,
    periodStart:start,
    date:cutoff,
    cutoffDate:cutoff,
    note:String(note||''),
    cleared:false,
    active:true,
    version:Math.max(1,parseInt(oldRaw.version,10)||1),
    sourceKey:String(sourceKey||oldRaw.sourceKey||''),
    sharedPair:v19IsLinkedAccount()?'EMP_SUNSHOP':'',
    updatedBy:state.account||'',
    updatedAt:new Date().toISOString()
  };
}

function v31Validate(status,amount,start,cutoff,{isNew=false,current=null,sourceKey=''}={}){
  status=['credit','debit','zero'].includes(status)?status:'credit';
  const cleanAmount=status==='zero'?0:Math.max(0,num(amount));
  if(!start||!cutoff){alert(tx('请输入有效的会计师开始日期和截止日期'));return false;}
  if(start>cutoff){alert(tx('开始日期不能晚于截止日期'));return false;}
  if(cutoff>todayISO()){alert(tx('会计师截止日期不能晚于今天'));return false;}
  if(status!=='zero' && !(cleanAmount>0)){alert(tx('请输入有效的会计师金额'));return false;}
  const latestLock=v23LatestSettlementCutoff(sourceKey||((current&&current.sourceKey)||''));
  if(latestLock && cutoff<=latestLock){
    alert(`${tx('截止日期必须晚于已结清日期')}: ${toSlashDate(latestLock)}`);
    return false;
  }
  if(isNew && current&&current.has&&current.cutoff&&cutoff<=current.cutoff){
    alert(`${tx('新会计师记录的截止日期必须晚于当前记录')}: ${toSlashDate(current.cutoff)}`);
    return false;
  }
  return true;
}

async function v31EditCurrentAccountant(status,amount,start,cutoff,note){
  const current=v30GetAuthority();
  if(!current.has){
    return v31CreateNewAccountant(status,amount,start,cutoff,note,true);
  }
  const sourceKey=current.sourceKey&&current.sourceKey!==V30_AUTH_KEY?current.sourceKey:accountantKeyForPeriod(state.period,todayISO());
  if(!v31Validate(status,amount,start,cutoff,{isNew:false,current,sourceKey}))return false;

  /* Edit SAME record in place: preserve version/history; update the source record and the global authority. */
  const sourceOld=v31RawStoreRecord(sourceKey);
  const authOld=v31RawStoreRecord(V30_AUTH_KEY);
  const sourceRecord=v31BuildRecord(sourceOld,status,amount,start,cutoff,note,sourceKey);
  const authBase=v23RecordIsActive(authOld)?authOld:{...sourceRecord,history:(authOld.history&&typeof authOld.history==='object')?authOld.history:{}};
  const authRecord=v31BuildRecord(authBase,status,amount,start,cutoff,note,sourceKey);

  await v23PersistAccountantRecord(sourceKey,sourceRecord);
  await v23PersistAccountantRecord(V30_AUTH_KEY,authRecord);
  state.accountantEntryMode='edit';
  setTimeout(render,50);
  return true;
}

/* Capture V30 "new version" saver: this is used ONLY when user explicitly adds a new accountant record. */
const _v31CreateNewBase=saveAccountantEstimate;
async function v31CreateNewAccountant(status,amount,start,cutoff,note,first=false){
  const current=v30GetAuthority();
  const key=accountantKeyForPeriod(state.period,todayISO());
  if(!v31Validate(status,amount,start,cutoff,{isNew:!first&&current.has,current,sourceKey:key}))return false;
  const result=await _v31CreateNewBase(key,status,amount,cutoff,note,start);
  if(result===false)return false;
  state.accountantEntryMode='edit';
  setTimeout(render,50);
  return true;
}

function v31StartNewAccountant(){
  state.accountantEntryMode='new';
  render();
}
function v31CancelNewAccountant(){
  state.accountantEntryMode='edit';
  render();
}

/* SAVE in normal mode edits the same record. It does NOT archive or increment the version. */
saveAccountantForm=async function(key){
  const status=$('accStatus')?.value||'credit';
  const amount=$('accAmount')?.value||'0';
  const start=v30StrictISO($('accStartDate')?.value||'');
  const cutoff=v30StrictISO($('accDate')?.value||'');
  const note=$('accNote')?.value||'';
  if(state.accountantEntryMode==='new')return v31CreateNewAccountant(status,amount,start,cutoff,note,false);
  return v31EditCurrentAccountant(status,amount,start,cutoff,note);
};

/* Accountant form always shows the CURRENT authority in edit mode.
   In new mode fields are intentionally prepared for a later cutoff, making replacement explicit. */
accountantFormHTML=function(s,key=s.adjustmentKey||accountantKeyForPeriod()){
  const current=v30GetAuthority();
  const isNew=state.accountantEntryMode==='new';
  const has=current.has;
  const sourceKey=has?(current.sourceKey||key):key;

  let status=has?current.status:'credit';
  let amount=has?String(current.raw.amount??current.amount??''):'';
  let start=has?(current.startDate||v29DefaultPeriodStart(sourceKey)):v29DefaultPeriodStart(key);
  let cutoff=has?(current.cutoff||todayISO()):todayISO();
  let note=has?(current.note||''):'';

  if(isNew){
    status='credit';amount='';note='';
    start=has&&current.cutoff?v29AddDays(current.cutoff,1):v29DefaultPeriodStart(key);
    cutoff=todayISO();
  }

  const startValue=toSlashDate(start);
  const dateValue=toSlashDate(cutoff);
  const creditLabel=currentLang==='it'?'A credito':'可抵扣IVA';
  const debitLabel=currentLang==='it'?'A debito':'应缴IVA';
  const zeroLabel=currentLang==='it'?'In pareggio':'IVA已平';
  const notePlaceholder=currentLang==='it'?'Es. A credito €6.400; periodo verificato':'例如：可抵扣IVA €6,400；会计师已核对';
  const saveLabel=isNew?tx('保存为新会计师记录'):(has?tx('保存当前记录修改'):tx('第一条会计师记录'));

  return `${v30AuthorityPanelHTML()}<div class="card" style="margin-top:16px">
    <div class="toolbar"><div><h3>${tx('会计师部分')}</h3><small style="color:var(--muted);font-weight:800">${has&&!isNew?tx('当前为编辑模式'):isNew?tx('当前为新增模式'):tx('没有会计师记录，当前按系统预估计算')}</small></div></div>

    <div class="accountant-form">
      <div class="input-card"><label>${tx('会计师状态')}</label><select id="accStatus">
        <option value="credit" ${status==='credit'?'selected':''}>${creditLabel}</option>
        <option value="debit" ${status==='debit'?'selected':''}>${debitLabel}</option>
        <option value="zero" ${status==='zero'?'selected':''}>${zeroLabel}</option>
      </select></div>
      <div class="input-card"><label>${tx('会计师金额')}</label><input id="accAmount" type="text" inputmode="decimal" pattern="[0-9.,，]*" value="${amount}" placeholder="0,00"></div>
      <div class="input-card"><label>${tx('会计师期间开始日期')}</label><input id="accStartDate" type="text" value="${startValue}" placeholder="DD/MM/YY" oninput="autoSlashDateInput(this)"><span class="v29-date-help">${tx('开始日期用于标记会计师覆盖范围')}</span></div>
      <div class="input-card"><label>${tx('会计师数据截止日期')}</label><input id="accDate" type="text" value="${dateValue}" placeholder="DD/MM/YY" oninput="autoSlashDateInput(this)"><span class="v29-date-help">${tx('截止日期决定系统从哪一天继续计算')}</span></div>
      <div class="input-card"><label>${tx('来源')}</label><input value="${tx('会计师')}" readonly></div>
      <div class="input-card wide"><label>${tx('会计师备注')}</label><textarea id="accNote" placeholder="${notePlaceholder}">${note}</textarea></div>
      <div class="input-card wide accountant-form-actions">
        <button class="small-btn" onclick="saveAccountantForm('${key}')"><span class="material-symbols-rounded">${isNew?'add_circle':'save'}</span>${saveLabel}</button>
        ${has&&!isNew?`<button class="ghost-btn v31-new-btn" onclick="v31StartNewAccountant()"><span class="material-symbols-rounded">add</span>${tx('新增会计师记录')}</button>`:''}
        ${isNew?`<button class="ghost-btn" onclick="v31CancelNewAccountant()"><span class="material-symbols-rounded">close</span>${tx('取消新增')}</button>`:''}
        ${has&&!isNew?`<button class="ghost-btn v23-settle-btn" onclick="markAccountantSettled('${sourceKey}')"><span class="material-symbols-rounded">task_alt</span>${tx('标记已结清')}</button><button class="ghost-btn" onclick="clearAccountantEstimate('${sourceKey}')"><span class="material-symbols-rounded">delete_sweep</span>${tx('清空会计师预估')}</button>`:''}
      </div>
    </div>

    <div class="v31-mode-note ${isNew?'new':'edit'}">${isNew?tx('只有新增记录才会替换旧会计师基准'):tx('编辑当前记录会整体重新计算，但不会生成新版本')}。</div>
  </div>`;
};

/* Explicitly enforce system-only fallback when there is no accountant authority at all.
   For EMP/SUNSHOP this preserves the existing linked system estimate. */
const _v31AuthPositionBase=v28AuthoritativePosition;
v28AuthoritativePosition=function(s=calcSummary(),key=(s&&s.adjustmentKey)||accountantKeyForPeriod(state.period,todayISO())){
  const a=v30GetAuthority();
  if(!a.has){
    const linked=v19IsLinkedAccount();
    let raw=systemSignedNet(s);
    if(linked){
      const pair=linkedPairSummaries();
      if(pair)raw=linkedCompensationFromSigned(pair.emp.net,pair.sun.net).groupNet;
    }
    const st=v28SignedStatus(raw);
    return {a,key,requestedKey:key,linked,active:false,cutoff:'',baseline:raw,delta:0,effectiveNet:raw,rawSystemNet:raw,details:null,...st};
  }
  return _v31AuthPositionBase(s,key);
};

if(typeof appUnlocked!=='undefined'&&appUnlocked&&state.account){setTimeout(render,0)}

<script>
Object.assign(it,{
  '已抵扣金额':'Importo già compensato',
  '本店专属IVA':'IVA dedicata al negozio',
  '近期发票明细':'Fatture recenti',
  '最近发票':'Fatture recenti',
  '最近6条，按开票日期倒序':'Ultime 6, ordinate per data emissione desc',
  '本店当前估算':'Stima attuale del negozio',
  '联动结果':'Risultato collegato',
  '当前余额':'Saldo corrente'
});

function v32NetStatus(net){
  net=num(net);
  if(net>0)return {label:tx('应缴IVA'), cls:'debit', amount:net};
  if(net<0)return {label:tx('可抵扣IVA'), cls:'credit', amount:Math.abs(net)};
  return {label:currentLang==='it'?'IVA in pareggio':'IVA已平', cls:'flat', amount:0};
}

function v32StatusPillClass(stato){
  const s=String(stato||'');
  if(s==='已付款')return 'paid';
  if(s==='已登记')return 'registered';
  return 'check';
}

function v32DeductedAmount(auth){
  if(!auth||!auth.active)return 0;
  const base=Math.abs(num(auth.baseline));
  if(!base)return 0;
  const delta=num(auth.delta);
  if(num(auth.baseline)<0)return Math.min(base, Math.max(0, delta));
  if(num(auth.baseline)>0)return Math.min(base, Math.max(0, -delta));
  return 0;
}

function v32DonutClassByKind(kind){
  return kind==='debit'?'debit':kind==='credit'?'credit':'flat';
}

function v32RecentInvoiceRows(s=calcSummary(), limit=6){
  const rows=Array.isArray(s?.rows)?[...s.rows]:[];
  const keyOf=r=>String(v30StrictISO((r&& (r.emissione||r.data||r.ricezione)) || '')||'');
  rows.sort((a,b)=>{
    const ka=keyOf(a), kb=keyOf(b);
    if(kb!==ka)return kb.localeCompare(ka);
    return String(b?.id||'').localeCompare(String(a?.id||''));
  });
  return rows.slice(0,limit);
}

function v32OverviewPieHTML(x){
  const auth=x.authoritative||v28AuthoritativePosition(x.s,x.key);
  const ownAbs=Math.abs(num(x.ownNet));
  const linkedBaseAbs=Math.abs(num(x.rawLinkedSystemNet!=null?x.rawLinkedSystemNet:x.linkedSystemNet));
  const deductedAbs=Math.abs(v32DeductedAmount(auth));
  const currentAbs=Math.abs(num(x.remainAmount));
  const total=ownAbs+linkedBaseAbs+deductedAbs+currentAbs;
  let bg='conic-gradient(#e5e7eb 0 100%)';

function v34DetailModalGrid(items){
  return `<div class="v34-modal-grid">${items.map(it=>`<div class="v34-modal-box"><small>${it.label}</small><b>${it.value}</b></div>`).join('')}</div>`;
}

function v34TrendRows(points){
  return points.slice(-10).reverse().map(p=>`<div class="v34-modal-list-row"><small>${toSlashDate(p.date)||p.date||'—'}</small><b>${money(p.value)}</b></div>`).join('');
}

function v34OverviewDetailData(type){
  const x=v25OwnAndLinkedMetrics();
  const auth=x.authoritative||v28AuthoritativePosition(x.s,x.key);
  const accountantShort=auth?.a?.has
    ? `${accountantStatusLabel(auth.a.status)} · ${money(auth.a.amount)}${auth.cutoff?` · ${toSlashDate(auth.cutoff)}`:''}`
    : tx('未填写');

  if(type==='linked'){
    return {
      title:tx('联动后数据详情'),
      sub:'EMP + SUNSHOP',
      body:
        v34DetailModalGrid([
          {label:tx('营业额'), value:money(x.linkedMetrics?.revenue||0)},
          {label:tx('销项IVA'), value:money(x.linkedMetrics?.salesIva||0)},
          {label:tx('可抵扣进项IVA'), value:money(x.linkedMetrics?.purchaseIva||0)},
          {label:tx('发票金额'), value:money(x.linkedMetrics?.invoiceTotal||0)},
          {label:tx('联动后IVA'), value:signedIvaLabel(x.linkedSystemNet)},
          {label:tx('当前状态'), value:x.statusInfo?.label||'—'},
          {label:tx('上季度结转'), value:money(x.prevCarry||0)},
          {label:tx('当前会计师'), value:accountantShort}
        ])+
        `<div class="v34-modal-note">${tx('完整金额')} · EMP + SUNSHOP ${tx('更多内容')}。${currentLang==='it'?'Qui vedi i valori completi dopo la compensazione tra i due account.':'这里显示 EMP 和 SUNSHOP 联动抵扣后的完整金额与状态。'}</div>`
    };
  }

  if(type==='trend_store' || type==='trend_linked'){
    const linked = type==='trend_linked';
    const points=v26TrendSeries(linked);
    const values=points.map(p=>num(p.value));
    const latest=values.length?values[values.length-1]:0;
    const peak=values.length?Math.max(...values):0;
    const min=values.length?Math.min(...values):0;
    const avg=values.length?(values.reduce((a,b)=>a+b,0)/values.length):0;
    return {
      title:tx('走势详情'),
      sub:linked?tx('联动后走势'):tx('本店走势'),
      body:
        v34DetailModalGrid([
          {label:tx('本阶段'), value:`${points.length} d`},
          {label:tx('最新金额'), value:money(latest)},
          {label:tx('峰值'), value:money(peak)},
          {label:tx('最低值'), value:money(min)},
          {label:tx('平均值'), value:money(avg)},
          {label:tx('来源'), value:linked?'EMP + SUNSHOP':state.account}
        ])+
        `<div class="v34-modal-note">${tx('最近10个点')}</div>`+
        `<div class="v34-modal-list">${v34TrendRows(points)||`<div class="v34-modal-list-row"><small>—</small><b>${tx('暂无数据')}</b></div>`}</div>`
    };
  }

  return {
    title:tx('本店数据详情'),
    sub:state.account,
    body:
      v34DetailModalGrid([
        {label:tx('营业额'), value:money(x.ownMetrics?.revenue||0)},
        {label:tx('销项IVA'), value:money(x.ownMetrics?.salesIva||0)},
        {label:tx('可抵扣进项IVA'), value:money(x.ownMetrics?.purchaseIva||0)},
        {label:tx('发票金额'), value:money(x.ownMetrics?.invoiceTotal||0)},
        {label:tx('本店IVA'), value:signedIvaLabel(x.ownNet)},
        {label:tx('当前净IVA'), value:signedIvaLabel(x.ownNet)},
        {label:tx('当前状态'), value:v32NetStatus(x.ownNet).label},
        {label:tx('当前会计师'), value:accountantShort}
      ])+
      `<div class="v34-modal-note">${tx('完整金额')} · ${tx('更多内容')}。${currentLang==='it'?'Qui vedi tutti i valori completi del negozio senza troncamenti.':'这里可以查看本店所有完整金额，不会被省略号截断。'}</div>`
  };
}

function openOverviewDetailModal(type){

function v35StoreLinkInfo(x){
  const out={
    linked:false,
    before:num(x.ownNet),
    after:num(x.ownNet),
    incoming:0,
    outgoing:0,
    used:0,
    otherNet:0,
    otherAccount:'',
    from:'',
    to:''
  };
  if(!x.linked || (state.account!=='EMP'&&state.account!=='SUNSHOP'))return out;
  const pair=linkedPairSummaries();
  if(!pair)return out;
  const c=linkedCompensationFromSigned(pair.emp.net,pair.sun.net);
  out.linked=true;
  out.from=c.from||'';
  out.to=c.to||'';
  if(state.account==='EMP'){
    out.before=num(c.empNet);
    out.after=num(c.empAfter);
    out.incoming=num(c.sunToEmp); // SUNSHOP credit offsets EMP debit
    out.outgoing=num(c.empToSun); // EMP credit offsets SUNSHOP debit
    out.otherNet=num(c.sunNet);
    out.otherAccount='SUNSHOP';
  }else{
    out.before=num(c.sunNet);
    out.after=num(c.sunAfter);
    out.incoming=num(c.empToSun); // EMP credit offsets SUNSHOP debit
    out.outgoing=num(c.sunToEmp); // SUNSHOP credit offsets EMP debit
    out.otherNet=num(c.empNet);
    out.otherAccount='EMP';
  }
  out.used=Math.max(out.incoming,out.outgoing);
  return out;
}

/* Store-only IVA: cross-account offset is shown explicitly and the center shows the store balance AFTER the offset. */
const _v35StorePieBase=v32StorePieHTML;
v32StorePieHTML=function(x){
  const link=v35StoreLinkInfo(x);
  const before=v32NetStatus(link.before);
  const after=v32NetStatus(link.after);
  const salesAbs=Math.abs(num(x.ownMetrics?.salesIva));
  const purchaseAbs=Math.abs(num(x.ownMetrics?.purchaseIva));
  const linkedUsed=Math.abs(num(link.used));
  const directDeducted=x.linked?0:Math.abs(v32DeductedAmount(x.authoritative||v28AuthoritativePosition(x.s,x.key)));
  const deductedAbs=linkedUsed+directDeducted;
  const afterAbs=Math.abs(num(after.amount));
  const total=salesAbs+purchaseAbs+deductedAbs+afterAbs;

  let bg='conic-gradient(#e5e7eb 0 100%)';
  if(total>0){
    const p1=salesAbs/total*100;
    const p2=purchaseAbs/total*100;
    const p3=deductedAbs/total*100;
    const end2=p1+p2;
    const end3=end2+p3;
    const afterColor=after.cls==='debit'?'#ef4444':after.cls==='credit'?'#16a34a':'#94a3b8';
    bg=`conic-gradient(#60a5fa 0 ${p1}%, #22c55e ${p1}% ${end2}%, #8b5cf6 ${end2}% ${end3}%, ${afterColor} ${end3}% 100%)`;
  }

  const center=`${after.label}\n${money(after.amount)}`;
  let linkRow='';
  let linkNote='';

    linkRow=`<div class="v32-legend-row v35-link-row incoming">
      <span><span class="material-symbols-rounded">add_circle</span>${tx('联动可抵扣IVA')}</span>
      <b>${money(link.incoming)}</b>
    </div>`;
    linkNote=currentLang==='it'
      ? `${link.otherAccount} aveva credito IVA: ne sono stati usati ${money(link.incoming)} per compensare il debito di ${state.account}.`
      : `${link.otherAccount} 有可抵扣 IVA，其中 ${money(link.incoming)} 已实际用于抵扣 ${state.account} 的应缴 IVA。`;
  }else if(link.outgoing>0){
    linkRow=`<div class="v32-legend-row v35-link-row outgoing">
      <span><span class="material-symbols-rounded">swap_horiz</span>${tx('本店用于联动抵扣')}</span>
      <b>${money(link.outgoing)}</b>
    </div>`;
    linkNote=currentLang==='it'
      ? `${money(link.outgoing)} del credito IVA di ${state.account} è stato usato per compensare il debito di ${link.otherAccount}.`
      : `${state.account} 的可抵扣 IVA 中有 ${money(link.outgoing)} 已实际用于抵扣 ${link.otherAccount} 的应缴 IVA。`;
  }else if(link.linked){
    linkNote=currentLang==='it'
      ? 'Non c’è una compensazione incrociata effettiva in questo momento.'
      : '当前两边没有发生实际的交叉抵扣。';
  }

  return `<div class="v32-pie-card">
    <div class="v32-pie-head">
      <div><h3>${tx('本店专属IVA')}</h3><small>${state.account}</small></div>
      <span class="v32-scope-chip">${tx('实际抵扣')}</span>
    </div>
    <div class="v32-pie-inner">
      <div class="v32-donut ${v32DonutClassByKind(after.cls)}" style="background:${bg}" data-label="${center}"></div>
      <div>
        <div class="v32-legend">
          <div class="v32-legend-row">
            <span><span class="material-symbols-rounded" style="color:#60a5fa">payments</span>${tx('销项IVA')}</span>
            <b>${money(x.ownMetrics?.salesIva||0)}</b>
          </div>
          <div class="v32-legend-row">
            <span><span class="material-symbols-rounded" style="color:#22c55e">inventory_2</span>${tx('可抵扣进项IVA')}</span>
            <b>${money(x.ownMetrics?.purchaseIva||0)}</b>
          </div>
          <div class="v32-legend-row">
            <span><span class="material-symbols-rounded">storefront</span>${tx('本店抵扣前IVA')}</span>
            <b>${signedIvaLabel(link.before)}</b>
          </div>
          ${linkRow}
          <div class="v32-legend-row">
            <span><span class="material-symbols-rounded" style="color:#8b5cf6">trending_down</span>${tx('已抵扣金额')}</span>
            <b>${money(deductedAbs)}</b>
          </div>
          <div class="v32-legend-row">
            <span><span class="material-symbols-rounded ${after.cls==='debit'?'v32-status-debit':after.cls==='credit'?'v32-status-credit':'v32-status-flat'}">account_balance_wallet</span>${tx('联动后本店IVA')}</span>
            <b class="${after.cls==='debit'?'v32-status-debit':after.cls==='credit'?'v32-status-credit':'v32-status-flat'}">${signedIvaLabel(link.after)}</b>
          </div>
          <div class="v32-legend-row">
            <span><span class="material-symbols-rounded ${after.cls==='debit'?'v32-status-debit':after.cls==='credit'?'v32-status-credit':'v32-status-flat'}">info</span>${tx('IVA状态')}</span>
            <b class="${after.cls==='debit'?'v32-status-debit':after.cls==='credit'?'v32-status-credit':'v32-status-flat'}">${after.label}</b>

<script>
Object.assign(it,{
  '系统IVA':'IVA sistema',

  '会计师当前IVA':'IVA corrente commercialista',
  '会计师未录入':'Commercialista non inserito',

  '截止日后进项IVA':'IVA acquisti dopo la data limite',
  '截止日后发票金额':'Totale fatture dopo la data limite',
  '覆盖期间内发票不改变会计师余额':'Le fatture nel periodo coperto non modificano il saldo del commercialista',
  '系统始终按全部系统数据独立计算':'Il sistema calcola sempre separatamente usando tutti i dati del sistema',
  '会计师仅从截止日次日继续计算':'Il saldo del commercialista prosegue solo dal giorno successivo alla data limite',
  '开始日期':'Data inizio',
  '截止日期':'Data limite',
  '会计师基准金额':'Importo base commercialista',
  '系统本店IVA':'IVA sistema negozio',
  '系统联动后IVA':'IVA sistema dopo compensazione'
});

function v38SystemSnapshot(){
  const s=calcSummary();
  const linked=v19IsLinkedAccount();
  const ownNet=systemSignedNet(s);
  let finalNet=ownNet;
  let pair=null, comp=null;
  if(linked){
    pair=linkedPairSummaries();
    if(pair){
      comp=linkedCompensationFromSigned(pair.emp.net,pair.sun.net);
      finalNet=num(comp.groupNet);
    }
  }
  const status=v28SignedStatus(finalNet);
  return {s,linked,ownNet,finalNet,pair,comp,status};
}

function v38AccountantPostParts(auth){
  let salesIva=0,purchaseIva=0,invoiceTotal=0,revenue=0;
  if(!auth||!auth.active)return {salesIva,purchaseIva,invoiceTotal,revenue};
  const take=d=>{
    const p=d&&d.parts?d.parts:null;
    if(!p)return;
    salesIva+=num(p.salesIva);
    purchaseIva+=num(p.imposta!=null?p.imposta:p.fattureIva);
    invoiceTotal+=num(p.totale);
    revenue+=num(p.chiusura!=null?p.chiusura:p.rangeChiusura);
  };
  if(auth.linked&&auth.details){take(auth.details.emp);take(auth.details.sun)}
  else take(auth.details);
  return {salesIva,purchaseIva,invoiceTotal,revenue};
}

function v38AccountantSnapshot(){
  const s=calcSummary();
  const key=s.adjustmentKey||accountantKeyForPeriod(state.period,todayISO());
  const a=v30GetAuthority();
  if(!a.has)return {s,key,a,has:false,auth:null,post:v38AccountantPostParts(null)};
  const auth=v28AuthoritativePosition(s,key);
  return {s,key,a,has:true,auth,post:v38AccountantPostParts(auth)};
}

function v38SystemPieHTML(sys){
  const sales=Math.abs(num(sys.s.salesIva));
  const purchase=Math.abs(num(sys.s.fattureIva));
  const remain=Math.abs(num(sys.status.amount));
  const total=sales+purchase+remain;
  let bg='conic-gradient(#e5e7eb 0 100%)';
  if(total>0){
    const p1=sales/total*100;
    const p2=purchase/total*100;
    const end2=p1+p2;
    const statusColor=sys.status.kind==='debit'?'#ef4444':sys.status.kind==='credit'?'#16a34a':'#94a3b8';
    bg=`conic-gradient(#60a5fa 0 ${p1}%, #22c55e ${p1}% ${end2}%, ${statusColor} ${end2}% 100%)`;
  }
  const cls=sys.status.kind==='debit'?'debit':sys.status.kind==='credit'?'credit':'flat';
  return `<div class="v32-pie-card">
    <div class="v32-pie-head">
      <div><h3>${tx('系统IVA')}</h3><small>${state.account} · ${periodName()}</small></div>
      <span class="v32-scope-chip v38-system-chip">${tx('系统独立计算')}</span>
    </div>
    <div class="v32-pie-inner">
      <div class="v32-donut ${cls}" style="background:${bg}" data-label="${tx('系统当前IVA')}\n${money(sys.status.amount)}"></div>
      <div>
        <div class="v32-legend">
          <div class="v32-legend-row"><span><span class="material-symbols-rounded" style="color:#60a5fa">percent</span>${tx('销项IVA')}</span><b>${money(sys.s.salesIva)}</b></div>
          <div class="v32-legend-row"><span><span class="material-symbols-rounded" style="color:#22c55e">receipt_long</span>${tx('可抵扣进项IVA')}</span><b>${money(sys.s.fattureIva)}</b></div>
          <div class="v32-legend-row"><span><span class="material-symbols-rounded">description</span>${tx('发票金额')}</span><b>${money(sys.s.totale)}</b></div>
          <div class="v32-legend-row"><span><span class="material-symbols-rounded">storefront</span>${tx('系统本店IVA')}</span><b>${signedIvaLabel(sys.ownNet)}</b></div>
          ${sys.linked?`<div class="v32-legend-row"><span><span class="material-symbols-rounded" style="color:#2563eb">sync_alt</span>${tx('系统联动后IVA')}</span><b>${signedIvaLabel(sys.finalNet)}</b></div>`:''}
          <div class="v32-legend-row"><span><span class="material-symbols-rounded ${cls==='debit'?'v32-status-debit':cls==='credit'?'v32-status-credit':'v32-status-flat'}">info</span>${tx('IVA状态')}</span><b class="${cls==='debit'?'v32-status-debit':cls==='credit'?'v32-status-credit':'v32-status-flat'}">${sys.status.label}</b></div>
        </div>
        <div class="v38-rule-note">${tx('系统始终按全部系统数据独立计算')}。${currentLang==='it'?'Ogni nuova fattura aumenta i totali fatture e la sua IVA detraibile riduce l’IVA vendite del sistema.':'每次新增发票，系统发票金额照常增加，发票进项 IVA 照常抵扣系统销项 IVA。'}</div>
      </div>
    </div>
  </div>`;
}

function v38AccountantPieHTML(acc){
  if(!acc.has){
    return `<div class="v32-pie-card">
      <div class="v32-pie-head"><div><h3>${tx('会计师IVA')}</h3><small>${state.account}</small></div><span class="v32-scope-chip v38-accountant-chip">${tx('会计师独立计算')}</span></div>
      <div class="v32-pie-inner">
        <div class="v32-donut flat v38-empty-donut" data-label="${tx('会计师未录入')}"></div>
        <div>
          <div class="v32-legend">
            <div class="v32-legend-row"><span><span class="material-symbols-rounded" style="color:#7c3aed">verified_user</span>${tx('会计师基准金额')}</span><b>—</b></div>
            <div class="v32-legend-row"><span><span class="material-symbols-rounded">date_range</span>${tx('开始日期')}</span><b>—</b></div>
            <div class="v32-legend-row"><span><span class="material-symbols-rounded">event</span>${tx('截止日期')}</span><b>—</b></div>
          </div>
          <div class="v38-rule-note">${tx('会计师未录入')}。${currentLang==='it'?'Il calcolo del sistema continua comunque in modo indipendente.':'系统 IVA 仍然会独立正常计算，不受影响。'}</div>
        </div>
      </div>
    </div>`;
  }
  const auth=acc.auth;
  const post=acc.post;
  const status=v28SignedStatus(auth.effectiveNet);
  const cls=status.kind==='debit'?'debit':status.kind==='credit'?'credit':'flat';
  const baseAbs=Math.abs(num(auth.baseline));
  const sales=Math.abs(num(post.salesIva));
  const purchase=Math.abs(num(post.purchaseIva));
  const current=Math.abs(num(status.amount));
  const total=baseAbs+sales+purchase+current;
  let bg='conic-gradient(#e5e7eb 0 100%)';
  if(total>0){
    const p1=baseAbs/total*100,p2=sales/total*100,p3=purchase/total*100;
    const e2=p1+p2,e3=e2+p3;
    const statusColor=status.kind==='debit'?'#ef4444':status.kind==='credit'?'#16a34a':'#94a3b8';
    bg=`conic-gradient(#8b5cf6 0 ${p1}%, #60a5fa ${p1}% ${e2}%, #22c55e ${e2}% ${e3}%, ${statusColor} ${e3}% 100%)`;
  }
  const start=acc.a.startDate||v29DefaultPeriodStart(acc.a.sourceKey||acc.key);
  const cutoff=auth.cutoff||acc.a.cutoff||'';
  return `<div class="v32-pie-card">
    <div class="v32-pie-head">
      <div><h3>${tx('会计师IVA')}</h3><small>${state.account} · ${toSlashDate(start)||'—'} → ${toSlashDate(cutoff)||'—'}</small></div>
      <span class="v32-scope-chip v38-accountant-chip">${tx('会计师独立计算')}</span>
    </div>
    <div class="v32-pie-inner">
      <div class="v32-donut ${cls}" style="background:${bg}" data-label="${tx('会计师当前IVA')}\n${money(status.amount)}"></div>
      <div>
        <div class="v32-legend">
          <div class="v32-legend-row"><span><span class="material-symbols-rounded" style="color:#8b5cf6">verified_user</span>${tx('会计师基准金额')}</span><b>${signedIvaLabel(auth.baseline)}</b></div>
          <div class="v32-legend-row"><span><span class="material-symbols-rounded">date_range</span>${tx('开始日期')}</span><b>${toSlashDate(start)||'—'}</b></div>
          <div class="v32-legend-row"><span><span class="material-symbols-rounded">event</span>${tx('截止日期')}</span><b>${toSlashDate(cutoff)||'—'}</b></div>
          <div class="v32-legend-row"><span><span class="material-symbols-rounded" style="color:#60a5fa">percent</span>${tx('截止日后销项IVA')}</span><b>${money(post.salesIva)}</b></div>
          <div class="v32-legend-row"><span><span class="material-symbols-rounded" style="color:#22c55e">receipt_long</span>${tx('截止日后进项IVA')}</span><b>${money(post.purchaseIva)}</b></div>
          <div class="v32-legend-row"><span><span class="material-symbols-rounded ${cls==='debit'?'v32-status-debit':cls==='credit'?'v32-status-credit':'v32-status-flat'}">account_balance_wallet</span>${tx('会计师当前IVA')}</span><b class="${cls==='debit'?'v32-status-debit':cls==='credit'?'v32-status-credit':'v32-status-flat'}">${signedIvaLabel(auth.effectiveNet)}</b></div>
        </div>
        <div class="v38-rule-note">${tx('覆盖期间内发票不改变会计师余额')}；${tx('会计师仅从截止日次日继续计算')}。${currentLang==='it'?'Le fatture nel periodo coperto restano però nel calcolo del sistema.':'覆盖期间内后来录入的发票仍然会进入“系统 IVA”的独立计算。'}</div>
      </div>
    </div>
  </div>`;
}

const _v38DetailBase=v34OverviewDetailData;
v34OverviewDetailData=function(type){
  if(type==='system_iva'){
    const sys=v38SystemSnapshot();
    return {title:tx('系统IVA'),sub:`${state.account} · ${periodName()}`,body:v34DetailModalGrid([
      {label:tx('营业额'),value:money(sys.s.rangeChiusura)},

  '历史记录':'Storico',
  '新增后旧记录自动转历史':'Con una nuova registrazione, la precedente passa automaticamente allo storico'
});

/* Explicit rule:
   - New accountant entry = new active baseline.
   - Previous active accountant entry = archived/history only.
   - History never participates in accountant rolling balance.
   - Rolling balance continues ONLY from newest active baseline cutoff onward.
*/
const _v39CreateNewAccountantBase = v31CreateNewAccountant;
v31CreateNewAccountant = async function(status,amount,start,cutoff,note,first=false){
  const before=v30GetAuthority();
  const ok=await _v39CreateNewAccountantBase(status,amount,start,cutoff,note,first);
  if(ok===false)return false;

  /* Existing V30/V31 persistence already archives the previous authority.
     Re-assert current mode and force all calculation views to reload newest authority only. */
  state.accountantEntryMode='edit';
  if(typeof renderNav==='function')renderNav();
  setTimeout(()=>{ if(typeof render==='function')render(); },60);
  return true;
};

/* The accountant calculation must read only the currently active authority record.
   Archived/history versions are audit-only. */
const _v39AccountantSnapshotBase = v38AccountantSnapshot;
v38AccountantSnapshot = function(){
  const s=calcSummary();
  const key=s.adjustmentKey||accountantKeyForPeriod(state.period,todayISO());
  const a=v30GetAuthority();
  if(!a.has)return {s,key,a,has:false,auth:null,post:v38AccountantPostParts(null)};
  const auth=v28AuthoritativePosition(s,key);
  return {s,key,a,has:true,auth,post:v38AccountantPostParts(auth)};
};

/* Make lifecycle visually explicit on accountant page without changing the existing form mechanics. */
const _v39AuthorityPanelBase=v30AuthorityPanelHTML;
v30AuthorityPanelHTML=function(){
  const a=v30GetAuthority();
  if(!a.has){
    return _v39AuthorityPanelBase()+`<div class="v39-history-only-note"><span class="material-symbols-rounded" style="font-size:15px;vertical-align:-3px">info</span> ${tx('最新会计师记录生效')}。${tx('新增后旧记录自动转历史')}。</div>`;
  }
  const base=_v39AuthorityPanelBase();
  return base+`<div class="v39-history-only-note"><span class="v39-live-chip"><span class="material-symbols-rounded" style="font-size:13px">check_circle</span>${tx('当前生效记录')}</span> &nbsp; ${tx('最新会计师记录生效')}。<br><span class="v39-history-chip"><span class="material-symbols-rounded" style="font-size:13px">history</span>${tx('历史记录')}</span> &nbsp; ${tx('旧记录仅保留历史，不参与计算')}。</div>`;
};

if(typeof appUnlocked!=='undefined'&&appUnlocked&&state.account){setTimeout(render,0)}

function v40StoreLinkSnapshot(sys=v38SystemSnapshot()){
  const out={
    linked:false,
    ownBefore:num(sys.ownNet),
    ownAfter:num(sys.ownNet),
    otherBefore:0,
    otherAfter:0,
    incoming:0,
    outgoing:0,
    used:0,
    otherAccount:'',
    from:'',
    to:''
  };
  if(!sys.linked || !sys.comp || (state.account!=='EMP'&&state.account!=='SUNSHOP'))return out;
  const c=sys.comp;
  out.linked=true;
  out.from=c.from||'';
  out.to=c.to||'';
  if(state.account==='EMP'){
    out.ownBefore=num(c.empNet);
    out.ownAfter=num(c.empAfter);
    out.otherBefore=num(c.sunNet);
    out.otherAfter=num(c.sunAfter);
    out.incoming=num(c.sunToEmp);
    out.outgoing=num(c.empToSun);
    out.otherAccount='SUNSHOP';
  }else{
    out.ownBefore=num(c.sunNet);
    out.ownAfter=num(c.sunAfter);
    out.otherBefore=num(c.empNet);
    out.otherAfter=num(c.empAfter);
    out.incoming=num(c.empToSun);
    out.outgoing=num(c.sunToEmp);
    out.otherAccount='EMP';
  }
  out.used=Math.max(out.incoming,out.outgoing,0);
  return out;
}

function v40StoreLinkedPieHTML(sys=v38SystemSnapshot()){
  const link=v40StoreLinkSnapshot(sys);
  const beforeStatus=v28SignedStatus(link.ownBefore);
  const afterStatus=v28SignedStatus(link.ownAfter);
  const cls=afterStatus.kind==='debit'?'debit':afterStatus.kind==='credit'?'credit':'flat';
  const beforeAbs=Math.abs(num(link.ownBefore));
  const usedAbs=Math.abs(num(link.used));
  const afterAbs=Math.abs(num(link.ownAfter));
  const total=beforeAbs+usedAbs+afterAbs;
  let bg='conic-gradient(#e5e7eb 0 100%)';
  if(total>0){
    const p1=beforeAbs/total*100;
    const p2=usedAbs/total*100;
    const end2=p1+p2;
    const afterColor=afterStatus.kind==='debit'?'#ef4444':afterStatus.kind==='credit'?'#16a34a':'#94a3b8';
    bg=`conic-gradient(#60a5fa 0 ${p1}%, #8b5cf6 ${p1}% ${end2}%, ${afterColor} ${end2}% 100%)`;
  }

  let dynamicRow='';
  let note='';
  let flowText=tx('无实际联动抵扣');
  if(link.incoming>0){
    dynamicRow=`<div class="v32-legend-row v40-link-in"><span><span class="material-symbols-rounded">add_circle</span>${tx('另一家店帮本店抵扣')}</span><b>${money(link.incoming)}</b></div>`;
    flowText=`${link.otherAccount} → ${state.account}`;
    note=currentLang==='it'
      ? `${link.otherAccount} ha un credito IVA e ${money(link.incoming)} è stato usato effettivamente per ridurre il debito IVA di ${state.account}.`
      : `${link.otherAccount} 的可抵扣 IVA 中，有 ${money(link.incoming)} 实际用于抵扣 ${state.account} 的应缴 IVA。`;
  }else if(link.outgoing>0){
    dynamicRow=`<div class="v32-legend-row v40-link-out"><span><span class="material-symbols-rounded">swap_horiz</span>${tx('本店帮另一家店抵扣')}</span><b>${money(link.outgoing)}</b></div>`;
    flowText=`${state.account} → ${link.otherAccount}`;
    note=currentLang==='it'
      ? `${money(link.outgoing)} del credito IVA di ${state.account} è stato usato effettivamente per ridurre il debito IVA di ${link.otherAccount}.`
      : `${state.account} 的可抵扣 IVA 中，有 ${money(link.outgoing)} 实际拿去抵扣 ${link.otherAccount} 的应缴 IVA。`;
  }else if(link.linked){
    dynamicRow=`<div class="v32-legend-row v40-link-none"><span><span class="material-symbols-rounded">remove_circle</span>${tx('实际联动金额')}</span><b>${money(0)}</b></div>`;
    note=currentLang==='it'?'In questo momento non c’è una compensazione incrociata effettiva tra i due negozi.':'当前两个店之间没有发生实际的交叉抵扣。';
  }else{
    dynamicRow=`<div class="v32-legend-row v40-link-none"><span><span class="material-symbols-rounded">link_off</span>${tx('实际联动金额')}</span><b>${money(0)}</b></div>`;
    note=currentLang==='it'?'Questo account non usa la compensazione EMP ↔ SUNSHOP.':'当前账户没有 EMP ↔ SUNSHOP 联动抵扣。';
  }

  return `<div class="v32-pie-card v40-store-card">
    <div class="v32-pie-head">
      <div><h3>${tx('本店专属IVA')}</h3><small>${state.account} · ${periodName()}</small></div>
      <span class="v40-flow-pill"><span class="material-symbols-rounded" style="font-size:15px">sync_alt</span>${flowText}</span>
    </div>
    <div class="v32-pie-inner">
      <div class="v32-donut ${cls}" style="background:${bg}" data-label="${tx('联动后本店IVA')}\n${money(afterStatus.amount)}"></div>
      <div>
        <div class="v32-legend">
          <div class="v32-legend-row"><span><span class="material-symbols-rounded" style="color:#60a5fa">storefront</span>${tx('本店抵扣前IVA')}</span><b>${signedIvaLabel(link.ownBefore)}</b></div>
          ${link.linked?`<div class="v32-legend-row"><span><span class="material-symbols-rounded" style="color:#64748b">store</span>${link.otherAccount} · ${tx('另一家店抵扣前IVA')}</span><b>${signedIvaLabel(link.otherBefore)}</b></div>`:''}
          ${dynamicRow}
          <div class="v32-legend-row"><span><span class="material-symbols-rounded" style="color:#8b5cf6">compare_arrows</span>${tx('实际联动金额')}</span><b>${money(link.used)}</b></div>
          <div class="v32-legend-row"><span><span class="material-symbols-rounded ${cls==='debit'?'v32-status-debit':cls==='credit'?'v32-status-credit':'v32-status-flat'}">account_balance_wallet</span>${tx('联动后本店IVA')}</span><b class="${cls==='debit'?'v32-status-debit':cls==='credit'?'v32-status-credit':'v32-status-flat'}">${signedIvaLabel(link.ownAfter)}</b></div>
          <div class="v32-legend-row"><span><span class="material-symbols-rounded ${cls==='debit'?'v32-status-debit':cls==='credit'?'v32-status-credit':'v32-status-flat'}">info</span>${tx('本店联动后状态')}</span><b class="${cls==='debit'?'v32-status-debit':cls==='credit'?'v32-status-credit':'v32-status-flat'}">${afterStatus.label}</b></div>
        </div>
        <div class="v40-store-note">${note}<br>${tx('本店专属IVA按系统联动计算')}。</div>
      </div>
    </div>
  </div>`;
}

const _v40DetailBase=v34OverviewDetailData;
v34OverviewDetailData=function(type){
  if(type==='store_link_iva'){
    const sys=v38SystemSnapshot();
    const link=v40StoreLinkSnapshot(sys);
    const after=v28SignedStatus(link.ownAfter);
    const flow=link.used>0?`${link.from} → ${link.to}`:tx('无实际联动抵扣');
    return {title:tx('本店专属IVA'),sub:`${state.account} · ${periodName()}`,body:v34DetailModalGrid([
      {label:tx('本店抵扣前IVA'),value:signedIvaLabel(link.ownBefore)},
      ...(link.linked?[{label:`${link.otherAccount} · ${tx('另一家店抵扣前IVA')}`,value:signedIvaLabel(link.otherBefore)}]:[]),
      {label:tx('另一家店帮本店抵扣'),value:money(link.incoming)},
      {label:tx('本店帮另一家店抵扣'),value:money(link.outgoing)},
      {label:tx('实际联动金额'),value:money(link.used)},
      {label:tx('抵扣方向'),value:flow},
      {label:tx('联动后本店IVA'),value:signedIvaLabel(link.ownAfter)},
      {label:tx('本店联动后状态'),value:after.label}
    ])+`<div class="v34-modal-note">${tx('本店专属IVA按系统联动计算')}。</div>`};
  }
  return _v40DetailBase(type);
};

      <div style="position:relative">${v40StoreLinkedPieHTML(sys)}<button class="v34-detail-btn" style="position:absolute;right:18px;top:58px;z-index:2" onclick="openOverviewDetailModal('store_link_iva')"><span class="material-symbols-rounded" style="font-size:16px">open_in_new</span>${tx('查看详情')}</button></div>

<script>
Object.assign(it,{
  '一眼总览':'Panoramica rapida',
  '剩余状态':'Stato residuo',
  '联动前本店':'Negozio prima della compensazione',
  '联动后本店':'Negozio dopo la compensazione',
  '系统结果':'Risultato sistema',
  '系统更高':'Sistema più alto',
  '会计师更高':'Commercialista più alto'
});

function v45StatusClass(kind){ return kind==='debit'?'debit':kind==='credit'?'credit':'flat'; }

function v45DiffInfo(diff){
  diff=num(diff);
  if(Math.abs(diff)<0.005){
    return {value:money(0), sub:tx('已平'), cls:'flat'};
  }
  return {
    value:(diff>0?'+':'−') + money(Math.abs(diff)),
    sub: diff>0 ? tx('会计师更高') : tx('系统更高'),
    cls: diff>0 ? 'credit' : 'debit'
  };
}

function v45BaseMetricCard(iconClass, icon, label, value, sub=''){
  return `<div class="v45-mini-card">
    <div class="v45-mini-icon ${iconClass}"><span class="material-symbols-rounded">${icon}</span></div>
    <div style="min-width:0;flex:1">
      <div class="v45-mini-label">${label}</div>
      <div class="v45-mini-value">${value}</div>
      ${sub?`<div class="v45-mini-sub">${sub}</div>`:''}
    </div>
  </div>`;
}

function v45SmartStoreInfoHTML(sys=v38SystemSnapshot(), acc=v38AccountantSnapshot()){
  const s=sys.s;
  const link=v40StoreLinkSnapshot(sys);
  const remainingNet=sys.linked?num(link.ownAfter):num(sys.ownNet);
  const remain=v28SignedStatus(remainingNet);
  const remainCls=v45StatusClass(remain.kind);
  const accountantHas=!!acc.has;
  const accountantNet=accountantHas?num(acc.auth.effectiveNet):0;
  const accountantLabel=accountantHas?signedIvaLabel(accountantNet):tx('未填写');
  const diff=accountantHas ? accountantNet - num(sys.finalNet) : 0;
  const diffInfo=accountantHas ? v45DiffInfo(diff) : {value:tx('未填写'),sub:tx('无会计师记录'),cls:'flat'};

  let offsetLabel=tx('实际联动金额');
  let offsetValue=money(link.used||0);
  let offsetSub=tx('无实际联动抵扣');
  if(link.outgoing>0){
    offsetLabel=tx('被另一家店拿去抵扣金额');
    offsetValue=money(link.outgoing);
    offsetSub=`${state.account} → ${link.otherAccount}`;
  }else if(link.incoming>0){
    offsetLabel=tx('另一家店帮本店抵扣金额');
    offsetValue=money(link.incoming);
    offsetSub=`${link.otherAccount} → ${state.account}`;
  }

  return `<div class="v45-overview">
    <div class="v45-hero">
      <div class="v45-primary-card">
        <div class="v45-primary-head">
          <div class="v45-title-wrap">
            <div class="v45-icon ${remainCls}"><span class="material-symbols-rounded">${remain.kind==='debit'?'payments':remain.kind==='credit'?'savings':'task_alt'}</span></div>
            <div>
              <div class="v45-kicker">${tx('一眼总览')}</div>
              <div class="v45-primary-title">${tx('实际剩余金额')}</div>
            </div>
          </div>
          <span class="v45-status-badge ${remainCls}"><span class="material-symbols-rounded" style="font-size:16px">${remain.kind==='debit'?'warning':remain.kind==='credit'?'verified':'check_circle'}</span>${remain.label}</span>
        </div>
        <div class="v45-primary-value ${remainCls}">${signedIvaLabel(remainingNet)}</div>
        <div class="v45-primary-meta">
          <div class="v45-meta-box"><small>${tx('联动前本店')}</small><b>${signedIvaLabel(link.ownBefore)}</b></div>
          <div class="v45-meta-box"><small>${tx('实际联动金额')}</small><b>${money(link.used||0)}</b></div>
          <div class="v45-meta-box"><small>${tx('联动后本店')}</small><b>${signedIvaLabel(link.ownAfter)}</b></div>
        </div>
      </div>
      <div class="v45-side-stack">
        <div class="v45-side-card">
          <div class="v45-icon offset"><span class="material-symbols-rounded">sync_alt</span></div>
          <div class="v45-side-content">
            <div class="v45-side-label">${offsetLabel}</div>
            <div class="v45-side-value">${offsetValue}</div>
            <div class="v45-side-sub">${offsetSub}</div>
          </div>
        </div>
        <div class="v45-side-card">
          <div class="v45-icon acct"><span class="material-symbols-rounded">verified_user</span></div>
          <div class="v45-side-content">
            <div class="v45-side-label">${tx('会计师预估')}</div>
            <div class="v45-side-value ${accountantHas?v45StatusClass(v28SignedStatus(accountantNet).kind):'flat'}">${accountantLabel}</div>
            <div class="v45-side-sub">${tx('会计师当前预估余额')}</div>
          </div>
        </div>
        <div class="v45-side-card">
          <div class="v45-icon diff"><span class="material-symbols-rounded">compare_arrows</span></div>
          <div class="v45-side-content">
            <div class="v45-side-label">${tx('会计师和系统差额')}</div>
            <div class="v45-side-value ${diffInfo.cls}">${diffInfo.value}</div>
            <div class="v45-side-sub">${tx('会计师减系统')} · ${diffInfo.sub}</div>
          </div>
        </div>
      </div>
    </div>
    <div class="v45-base-grid">
      ${v45BaseMetricCard('blue','point_of_sale',tx('营业额'),money(s.rangeChiusura),periodName())}
      ${v45BaseMetricCard('purple','percent',tx('销项IVA'),money(s.salesIva))}
      ${v45BaseMetricCard('green','receipt_long',tx('可抵扣进项IVA'),money(s.fattureIva))}
      ${v45BaseMetricCard('teal','folder_open',tx('发票金额'),money(s.totale))}
    </div>
  </div>`;
}

const _v45DashboardBase = dashboardHTML;
dashboardHTML = function(){
  const sys=v38SystemSnapshot();
  const acc=v38AccountantSnapshot();
  const s=sys.s;
  const ownMetrics={revenue:num(s.rangeChiusura),salesIva:num(s.salesIva),purchaseIva:num(s.fattureIva),invoiceTotal:num(s.totale)};

  return `<div class="v24-dashboard v32-dashboard-wrap">
    ${tabs()}

    <section class="v40-section v42-summary-wrap">
      <div class="v40-section-title"><span class="material-symbols-rounded">dashboard</span><b>${tx('本店信息')}</b></div>
      ${v45SmartStoreInfoHTML(sys,acc)}
    </section>

    <section class="v40-section">
      <div class="v40-section-title"><span class="material-symbols-rounded">sync_alt</span><b>${tx('系统联动派')}</b></div>
      <div class="v42-section-note">${currentLang==='it'?'Mostra in modo chiaro se il risultato del sistema è IVA a credito, IVA a debito o in pareggio.':'清楚显示系统联动后到底是可抵扣 IVA、应缴 IVA，还是已平。'}</div>
      <div style="position:relative">${v38SystemPieHTML(sys)}<button class="v34-detail-btn" style="position:absolute;right:18px;top:58px;z-index:2" onclick="openOverviewDetailModal('system_iva')"><span class="material-symbols-rounded" style="font-size:16px">open_in_new</span>${tx('查看详情')}</button></div>
    </section>

    <section class="v40-section">
      <div class="v40-section-title"><span class="material-symbols-rounded">verified_user</span><b>${tx('会计师IVA')}</b></div>
      <div style="position:relative">${v38AccountantPieHTML(acc)}<button class="v34-detail-btn" style="position:absolute;right:18px;top:58px;z-index:2" onclick="openOverviewDetailModal('accountant_iva')"><span class="material-symbols-rounded" style="font-size:16px">open_in_new</span>${tx('查看详情')}</button></div>
    </section>

    <section class="v40-section">
      <div class="v40-section-title"><span class="material-symbols-rounded">storefront</span><b>${tx('本店联动明细')}</b></div>
      <div style="position:relative">${v40StoreLinkedPieHTML(sys)}<button class="v34-detail-btn" style="position:absolute;right:18px;top:58px;z-index:2" onclick="openOverviewDetailModal('store_link_iva')"><span class="material-symbols-rounded" style="font-size:16px">open_in_new</span>${tx('查看详情')}</button></div>
    </section>

    <section class="v40-section">
      <div class="v40-section-title"><span class="material-symbols-rounded">monitoring</span><b>${tx('经营概览')}</b></div>
      <div class="v40-operating-grid">
        ${v25MetricsBlock(tx('本店数据'),'storefront',ownMetrics)}
        ${v26TrendCardHTML(false)}
      </div>
    </section>

    <section class="v40-section">
      <div class="v40-section-title"><span class="material-symbols-rounded">receipt_long</span><b>${tx('发票动态')}</b></div>
      ${v32RecentInvoicesHTML(s)}
    </section>
  </div>`;
};

if(typeof appUnlocked!=='undefined'&&appUnlocked&&state.account){setTimeout(render,0)}
</script>

/* Sales IVA is counted from the accountant record start date through today.
   Covered-period old purchase invoices remain locked; only purchase invoices after cutoff
   continue changing the accountant balance. */
function v49SalesRange(data,startInclusive,endInclusive=todayISO()){
  data=data||{};
  let salesIva=0,revenue=0;
  Object.values(data.chiusure||{}).forEach(x=>{
    if(!x)return;
    const d=v23ISODate(x.data);
    if(!d)return;
    if(startInclusive && d<startInclusive)return;
    if(endInclusive && d>endInclusive)return;
    salesIva+=num(x.ivaVendite);
    revenue+=num(x.totale);
  });
  return {salesIva,revenue};
}

function v49PurchaseAfterCutoff(data,cutoff,endInclusive=todayISO()){
  const p=v23RangeParts(data||{},cutoff,endInclusive);
  return {
    purchaseIva:num(p.imposta),
    invoiceTotal:num(p.totale),
    invoiceCount:num(p.count),
    rows:p.rows||[]
  };
}

  const a=v30GetAuthority();
  if(!a.has)return _v49AuthBase(s,key);

  const linked=v19IsLinkedAccount();
  const cutoff=v23ISODate(a.cutoff||a.date||(a.raw&&a.raw.cutoffDate))||todayISO();
  const start=v23ISODate(a.startDate||(a.raw&&a.raw.startDate))||v29DefaultPeriodStart(a.sourceKey||key);
  const baseline=num(a.signed);

  let rawSystemNet=systemSignedNet(s);
  if(linked){
    const pair=linkedPairSummaries();
    if(pair)rawSystemNet=linkedCompensationFromSigned(pair.emp.net,pair.sun.net).groupNet;
  }

  let salesIva=0,revenue=0,purchaseIva=0,invoiceTotal=0;
  let details=null;

  if(linked){
    const pairData=v9LinkedDatas();
    if(pairData){
      const es=v49SalesRange(pairData.emp,start,todayISO());
      const ss=v49SalesRange(pairData.sun,start,todayISO());
      const ep=v49PurchaseAfterCutoff(pairData.emp,cutoff,todayISO());
      const sp=v49PurchaseAfterCutoff(pairData.sun,cutoff,todayISO());

      salesIva=num(es.salesIva)+num(ss.salesIva);
      revenue=num(es.revenue)+num(ss.revenue);
      purchaseIva=num(ep.purchaseIva)+num(sp.purchaseIva);
      invoiceTotal=num(ep.invoiceTotal)+num(sp.invoiceTotal);

      details={
        emp:{parts:{salesIva:num(es.salesIva),imposta:num(ep.purchaseIva),fattureIva:num(ep.purchaseIva),totale:num(ep.invoiceTotal),chiusura:num(es.revenue),rangeChiusura:num(es.revenue)}},
        sun:{parts:{salesIva:num(ss.salesIva),imposta:num(sp.purchaseIva),fattureIva:num(sp.purchaseIva),totale:num(sp.invoiceTotal),chiusura:num(ss.revenue),rangeChiusura:num(ss.revenue)}}
      };
    }
  }else{
    const sr=v49SalesRange(state.data||{},start,todayISO());
    const pr=v49PurchaseAfterCutoff(state.data||{},cutoff,todayISO());
    salesIva=num(sr.salesIva);
    revenue=num(sr.revenue);
    purchaseIva=num(pr.purchaseIva);
    invoiceTotal=num(pr.invoiceTotal);
    details={
      parts:{
        salesIva,
        imposta:purchaseIva,
        fattureIva:purchaseIva,
        totale:invoiceTotal,
        chiusura:revenue,
        rangeChiusura:revenue
      }
    };
  }

  /* Signed convention:
     debit = positive, credit = negative.
     Sales IVA pushes toward debit; deductible purchase IVA pushes toward credit. */
  const delta=salesIva-purchaseIva;
  const effectiveNet=baseline+delta;
  const st=v28SignedStatus(effectiveNet);

  return {
    a,key,requestedKey:key,linked,active:true,
    cutoff,start,baseline,delta,effectiveNet,rawSystemNet,details,
    salesIva,purchaseIva,revenue,invoiceTotal,
    ...st
  };
};

  const a=v30GetAuthority();

  }

  let salesIva=0,purchaseIva=0,invoiceTotal=0,revenue=0;

    return {
      delta:num(d&&d.delta),
      salesIva:num(p.salesIva),
      purchaseIva:num(p.imposta!=null?p.imposta:p.fattureIva),
      invoiceTotal:num(p.totale),
      revenue:num(p.chiusura!=null?p.chiusura:p.rangeChiusura),
      raw:d
    };
  };

  let delta=0;

  if(linked){
    const pairData=v9LinkedDatas();
    if(pairData){
      const emp=collectAfterCutoff(pairData.emp);
      const sun=collectAfterCutoff(pairData.sun);

      salesIva=emp.salesIva+sun.salesIva;

      invoiceTotal=emp.invoiceTotal+sun.invoiceTotal;
      revenue=emp.revenue+sun.revenue;

      details={
        emp:{parts:{
          salesIva:emp.salesIva,
          imposta:emp.purchaseIva,
          fattureIva:emp.purchaseIva,
          totale:emp.invoiceTotal,
          chiusura:emp.revenue,
          rangeChiusura:emp.revenue
        }},
        sun:{parts:{
          salesIva:sun.salesIva,
          imposta:sun.purchaseIva,
          fattureIva:sun.purchaseIva,
          totale:sun.invoiceTotal,
          chiusura:sun.revenue,
          rangeChiusura:sun.revenue
        }}
      };
    }
  }else{
    const one=collectAfterCutoff(state.data||{});
    salesIva=one.salesIva;
    purchaseIva=one.purchaseIva;
    invoiceTotal=one.invoiceTotal;
    revenue=one.revenue;
    delta=one.delta;
    details={parts:{
      salesIva,
      imposta:purchaseIva,
      fattureIva:purchaseIva,
      totale:invoiceTotal,
      chiusura:revenue,
      rangeChiusura:revenue
    }};
  }

  const effectiveNet=baseline+delta;
  const st=v28SignedStatus(effectiveNet);

  return {
    a,key,requestedKey:key,linked,active:true,
    cutoff,start,baseline,delta,effectiveNet,rawSystemNet,details,
    salesIva,purchaseIva,revenue,invoiceTotal,
    ...st
  };
};
