<script>
Object.assign(it,{
  '最终IVA':'IVA finale',
  '管理口径':'Criterio gestionale',
  '以会计师为主':'Priorità al commercialista',
  '未填写会计师时使用系统预估':'Se non è inserita la stima del commercialista, viene usata la stima del sistema',
  'EMP和SUNSHOP共用会计师预估':'EMP e SUNSHOP condividono la stessa stima del commercialista',
  '只计算一次，不会在EMP和SUNSHOP重复计算':'Viene conteggiata una sola volta e non viene duplicata tra EMP e SUNSHOP',
  '共享会计师记录':'Stima commercialista condivisa',
  '最新记录生效':'Vale il record più recente',
  '会计师来源账户':'Account che ha aggiornato la stima',
  '系统联动预估':'Stima collegata del sistema',
  '最终来源':'Fonte finale',
  '会计师已填写':'Commercialista inserito',
  '会计师未填写':'Commercialista non inserito',
  'EMP+SUNSHOP共享金额':'Importo condiviso EMP+SUNSHOP',
  '会计师金额作为EMP和SUNSHOP共同的一笔IVA余额使用':'L’importo del commercialista è trattato come un unico saldo IVA condiviso tra EMP e SUNSHOP'
});

function v19IsLinkedAccount(){
  return state.account==='EMP'||state.account==='SUNSHOP';
}

function v19ParseUpdateTime(r){
  if(!r)return 0;
  const t=Date.parse(r.updatedAt||'');
  if(Number.isFinite(t))return t;
  const d=String(r.date||'').trim();
  if(d){
    const nd=normalizeDateValue(d);
    const td=Date.parse(nd);
    if(Number.isFinite(td))return td;
  }
  return 0;
}

function v19AccountantCandidate(data,key,owner){
  const r=((data||{}).accountantEstimates||{})[key];
  if(!r)return null;
  const meaningful=
    !!r.cleared ||
    String(r.status||'').trim()!=='' ||
    String(r.amount||'').trim()!=='' ||
    String(r.note||'').trim()!=='';
  if(!meaningful)return null;
  return {raw:r,owner,time:v19ParseUpdateTime(r)};
}

/*
  EMP + SUNSHOP accountant data is logically ONE shared record.
  We do not add the two account copies together.
  Instead, whichever side was updated most recently wins.
  This also means editing from SUNSHOP is immediately reflected in EMP
  through the existing linked-account realtime listener, and vice versa.
*/
function v19SharedAccountantRaw(key){
  const own=v19AccountantCandidate(state.data,key,state.account);

  if(!v19IsLinkedAccount()){
    return own||{raw:{},owner:state.account,time:0};
  }

  const otherName=linkedOtherAccount();
  const other=v19AccountantCandidate(
    linkedIvaState&&linkedIvaState.data ? linkedIvaState.data : {},
    key,
    otherName
  );

  if(!own&&!other)return {raw:{},owner:'',time:0};
  if(own&&!other)return own;
  if(other&&!own)return other;

  if(other.time>own.time)return other;
  return own;
}

/* Shared for EMP/SUNSHOP; independent for CASAISSIMA. */
getAccountantEstimate=function(key=accountantKeyForPeriod()){
  const picked=v19SharedAccountantRaw(key);
  const r=picked.raw||{};
  const cleared=!!r.cleared;
  const has=!cleared && (
    String(r.status||'').trim()!=='' ||
    String(r.amount||'').trim()!==''
  );
  const amount=Math.max(0,num(r.amount));
  let signed=0;
  if(r.status==='debit')signed=amount;
  else if(r.status==='credit')signed=-amount;

  return {
    key,has,cleared,
    status:has?(r.status||''):'',
    amount:has?amount:0,
    signed:has?signed:0,
    date:r.date||'',
    note:r.note||'',
    sourceAccount:picked.owner||'',
    raw:r
  };
};

/*
  Safe sync strategy:
  - Save on the account currently being edited.
  - EMP/SUNSHOP always read BOTH sides and use the newest record only.
  Therefore no cross-account write permission is required and the value
  still becomes shared in real time.
*/
saveAccountantEstimate=function(key,status,amount,date,note){
  const record={
    status:String(status||''),
    amount:String(amount??''),
    date:String(date||''),
    note:String(note||''),
    cleared:false,
    sharedPair:v19IsLinkedAccount()?'EMP_SUNSHOP':'',
    updatedBy:state.account||'',
    updatedAt:new Date().toISOString()
  };

  state.data.accountantEstimates=state.data.accountantEstimates||{};
  state.data.accountantEstimates[key]=record;

  return save('accountantEstimates/'+key,record).then(()=>{
    renderNav();
    render();
  });
};

/* A tombstone is used for EMP/SUNSHOP so an older copy on the partner
   account cannot reappear after clearing. The newest record still wins. */
clearAccountantEstimate=function(key){
  if(!confirm(currentLang==='it'
    ? 'Azzerare la stima condivisa del commercialista per questo periodo?'
    : '确定清空当前期间的共享会计师预估吗？'))return;

  if(v19IsLinkedAccount()){
    const record={
      status:'',
      amount:'',
      date:todayISO(),
      note:'',
      cleared:true,
      sharedPair:'EMP_SUNSHOP',
      updatedBy:state.account||'',
      updatedAt:new Date().toISOString()
    };
    state.data.accountantEstimates=state.data.accountantEstimates||{};
    state.data.accountantEstimates[key]=record;
    return save('accountantEstimates/'+key,record).then(()=>{
      renderNav();
      render();
    });
  }

  if(state.data.accountantEstimates)delete state.data.accountantEstimates[key];
  return db.ref('vatManagement/'+state.account+'/accountantEstimates/'+key).remove().then(()=>{
    renderNav();
    render();
  });
};

/* System estimate used for comparison:
   EMP/SUNSHOP -> combined linked position AFTER automatic mutual offset.
   Other accounts -> the account's own system position.
*/
function v19GroupSystemNet(s){
  if(v19IsLinkedAccount()){
    const pair=linkedPairSummaries();
    if(pair){
      const c=linkedCompensationFromSigned(pair.emp.net,pair.sun.net);
      return c.groupNet;
    }
  }
  return systemSignedNet(s);
}

/* Accountant comparison now happens ONCE against the EMP+SUNSHOP group,
   never once for EMP and again for SUNSHOP. */
compareAccountant=function(s,key=s.adjustmentKey||accountantKeyForPeriod()){
  const a=getAccountantEstimate(key);
  const sys=v19GroupSystemNet(s);

  const systemDebit=Math.max(0,num(sys));
  const systemCredit=Math.max(0,-num(sys));

  if(!a.has){
    return {
      a,sys,systemDebit,systemCredit,
      sysAmount:Math.abs(num(sys)),
      comparedSystemAmount:0,
      diff:null,absDiff:null,amountGap:null,amountDue:null,oursHigher:null,
      kind:'none',label:tx('尚未输入会计师预估'),direction:'',
      sameSign:true,pendingType:'none'
    };
  }

  const accountantAmount=Math.max(0,num(a.amount));
  const comparedSystemAmount=
    a.status==='credit' ? systemCredit :
    a.status==='debit' ? systemDebit :
    Math.abs(num(sys));

  const amountGap=accountantAmount-comparedSystemAmount;
  const absDiff=Math.abs(amountGap);
  const oursHigher=Math.max(0,comparedSystemAmount-accountantAmount);
  const sameSign=(Math.sign(sys)===Math.sign(a.signed)) ||
                 (Math.abs(sys)<0.005&&Math.abs(a.signed)<0.005);

  let amountDue=0;
  let kind='diff';
  let label=tx('有差额');
  let direction='';
  let pendingType='none';

  if(a.status==='debit'){
    amountDue=accountantAmount;
    pendingType='debt';
    kind=amountDue>0?'debt':'ok';
    label=amountDue>0?tx('按会计师欠款'):tx('一致');
    direction=amountDue>0
      ? `${tx('欠款')}: ${money(amountDue)}`
      : tx('无需补差');

  }else if(a.status==='credit'){
    pendingType='credit';

    if(systemCredit>accountantAmount){
      amountDue=accountantAmount;
      kind='system';
      label=tx('系统可抵扣更高，采用会计师金额');
      direction=`${tx('待抵税')}: ${money(amountDue)}`;
    }else{
      amountDue=Math.max(0,accountantAmount-systemCredit);
      if(amountDue<0.01){
        kind='ok';
        label=tx('一致');
        direction=tx('无需补差');
      }else{
        kind='debt';
        label=tx('系统可抵扣更低，计算剩余待抵税');
        direction=`${tx('待抵税')}: ${money(amountDue)}`;
      }
    }
  }else{
    amountDue=0;
    pendingType='zero';
    kind=absDiff<0.01?'ok':'diff';
    label=absDiff<0.01?tx('一致'):tx('有差额');
    direction=tx('无需补差');
  }

  if(!sameSign && Math.abs(sys)>=0.01 && Math.abs(a.signed)>=0.01){
    direction += `${direction?' · ':''}${tx('状态方向不同，请同时核对A CREDITO/A DEBITO')}`;
  }

  return {
    a,sys,systemDebit,systemCredit,
    sysAmount:Math.abs(num(sys)),
    comparedSystemAmount,
    diff:amountGap,absDiff,amountGap,amountDue,oursHigher,
    kind,label,direction,sameSign,pendingType
  };
};

/* Main-page rule:
   - accountant filled -> accountant is the final management figure
   - no accountant -> use the system estimate
   EMP/SUNSHOP system fallback is the combined linked result.
*/
function v19ManagementResult(s,key=s.adjustmentKey||accountantKeyForPeriod()){
  const a=getAccountantEstimate(key);
  const system=v19GroupSystemNet(s);
  return {
    key,
    hasAccountant:a.has,
    accountant:a,
    system,
    signed:a.has?a.signed:system,
    source:a.has?'accountant':'system'
  };
}

  }else{

  }

  return `<div class="card management-final-panel">

        <small>${r.source==='accountant'?tx('以会计师为主'):tx('未填写会计师时使用系统预估')}<br>${accountNote}</small>
      </div>
      <span class="management-source-pill ${sourceClass}">
        <span class="material-symbols-rounded" style="font-size:15px">${r.source==='accountant'?'account_balance':'calculate'}</span>
        ${tx('最终来源')}: ${sourceLabel}
      </span>
    </div>

    <div class="management-final-grid">
      <div class="management-final-box primary">
        <small>${tx('最终IVA')}</small>
        <b>${signedIvaLabel(r.signed)}</b>

      </div>

      <div class="management-final-box">

        <b>${signedIvaLabel(r.system)}</b>
        <span>${linked?'EMP + SUNSHOP':state.account}</span>
      </div>

      <div class="management-final-box">

        <b>${r.accountant.has?`${accountantStatusLabel(r.accountant.status)} · ${money(r.accountant.amount)}`:tx('未填写')}</b>
        <span>${r.accountant.has
          ? `${tx('会计师来源账户')}: ${r.accountant.sourceAccount||state.account}`

      </div>
    </div>

    ${linked&&r.accountant.has?`<div class="shared-accountant-note">
      <b>${tx('共享会计师记录')}：</b>

      ${r.accountant.raw.updatedAt?` ${tx('最后更新')}: ${new Date(r.accountant.raw.updatedAt).toLocaleString('it-IT')}`:''}
    </div>`:''}
  </div>`;
}

/* The existing two-account accountant pair is replaced by ONE shared record. */
linkedAccountantPair=function(){
  if(!v19IsLinkedAccount())return null;
  const key=accountantKeyForPeriod(state.period,todayISO());
  const shared=getAccountantEstimate(key);
  return {
    key,
    shared,
    both:shared.has,
    comp:shared.has
      ? {groupNet:shared.signed,amount:0,from:'',to:'',empAfter:0,sunAfter:0}
      : null
  };
};

<!-- V20: Firebase shared bridge for EMP + SUNSHOP
     Fixes permission_denied caused by reading the other private account directly.
     Raw invoices remain private. Only minimal IVA summary data is mirrored to vatShared/EMP_SUNSHOP.
-->
<script>
Object.assign(it,{
  '等待关联账户首次同步':'In attesa della prima sincronizzazione dell’account collegato',
  '共享通道权限不足':'Permesso insufficiente per il canale condiviso',
  '请更新Firebase Rules以允许EMP和SUNSHOP访问共享通道':'Aggiornare le Firebase Rules per consentire a EMP e SUNSHOP di accedere al canale condiviso',
  '共享通道':'Canale condiviso',
  '已通过共享通道同步':'Sincronizzato tramite canale condiviso'
});

const V20_SHARED_ROOT='vatShared/EMP_SUNSHOP';
let v20SharedRef=null;
let v20SharedState={
  loaded:false,
  error:'',
  accounts:{},
  accountantEstimates:{}
};
let v20LastPublishedJSON='';

/* Only the figures needed for linked IVA calculations are mirrored.
   Supplier names, invoice numbers, notes, payment methods, etc. remain private. */
function v20SanitizeForShared(data){
  data=data||{};
  const chiusure={};
  Object.entries(data.chiusure||{}).forEach(([k,x])=>{
    if(!x)return;
    chiusure[k]={
      data:x.data||k,
      totale:num(x.totale),
      ivaVendite:num(x.ivaVendite)
    };
  });

  const fatture={};
  Object.entries(data.fatture||{}).forEach(([id,x])=>{
    if(!x)return;
    fatture[id]={
      data:x.data||'',
      emissione:x.emissione||'',
      imponibile:num(x.imponibile),
      imposta:num(x.imposta)
    };
  });

  const ivaAdjustments={};
  Object.entries(data.ivaAdjustments||{}).forEach(([k,x])=>{
    x=x||{};
    ivaAdjustments[k]={
      creditoPrecedente:x.creditoPrecedente??'',
      rettifiche:x.rettifiche??''
    };
  });

  return {
    chiusure,
    fatture,
    ivaAdjustments,
    updatedAt:new Date().toISOString()
  };
}

function v20PublishOwnSharedSnapshot(){
  if(!appUnlocked || !v19IsLinkedAccount() || !state.account)return;
  if(!state.data)return;

  const payload=v20SanitizeForShared(state.data);
  const stable=JSON.stringify({
    chiusure:payload.chiusure,
    fatture:payload.fatture,
    ivaAdjustments:payload.ivaAdjustments
  });
  if(stable===v20LastPublishedJSON)return;
  v20LastPublishedJSON=stable;

  db.ref(`${V20_SHARED_ROOT}/accounts/${state.account}`)
    .set(payload)
    .catch(err=>{
      console.error('Shared bridge publish failed:',err);
      v20SharedState.error=(err&&err.code)||'permission_denied';
    });
}

function v20MaybeMigrateOwnAccountant(){
  if(!v19IsLinkedAccount() || !v20SharedState.loaded || v20SharedState.error)return;
  const own=(state.data&&state.data.accountantEstimates)||{};
  const shared=v20SharedState.accountantEstimates||{};

  Object.entries(own).forEach(([key,r])=>{
    if(shared[key])return;
    if(!r)return;
    const meaningful=!!r.cleared ||
      String(r.status||'').trim()!=='' ||
      String(r.amount||'').trim()!=='' ||
      String(r.note||'').trim()!=='';
    if(!meaningful)return;

    const migrated={
      ...r,
      sharedPair:'EMP_SUNSHOP',
      migratedFrom:state.account,
      updatedBy:r.updatedBy||state.account,
      updatedAt:r.updatedAt||new Date().toISOString()
    };
    db.ref(`${V20_SHARED_ROOT}/accountantEstimates/${key}`)
      .set(migrated)
      .catch(err=>console.error('Accountant migration failed:',err));
  });
}

function stopLinkedIvaListener(){
  if(linkedIvaDbRef){linkedIvaDbRef.off();linkedIvaDbRef=null}
  if(v20SharedRef){v20SharedRef.off();v20SharedRef=null}
  linkedIvaState={account:null,data:null,loading:false,error:''};
  v20SharedState={loaded:false,error:'',accounts:{},accountantEstimates:{}};
}

function startLinkedIvaListener(){
  if(linkedIvaDbRef){linkedIvaDbRef.off();linkedIvaDbRef=null}
  if(v20SharedRef){v20SharedRef.off();v20SharedRef=null}

  const other=linkedOtherAccount();
  linkedIvaState={account:other,data:null,loading:!!other,error:''};
  v20SharedState={loaded:false,error:'',accounts:{},accountantEstimates:{}};

  if(!other)return;

  v20SharedRef=db.ref(V20_SHARED_ROOT);
  v20SharedRef.on('value',snap=>{
    if(linkedOtherAccount()!==other)return;

    const shared=snap.val()||{};
    v20SharedState={
      loaded:true,
      error:'',
      accounts:shared.accounts||{},
      accountantEstimates:shared.accountantEstimates||{}
    };

    const otherData=(v20SharedState.accounts||{})[other]||null;
    linkedIvaState={
      account:other,
      data:otherData,
      loading:false,
      error:otherData?'':'waiting_first_sync'
    };

    v20PublishOwnSharedSnapshot();
    v20MaybeMigrateOwnAccountant();
    if(appUnlocked)render();
  },err=>{
    console.error('Shared EMP/SUNSHOP bridge read failed:',err);
    v20SharedState={
      loaded:false,
      error:(err&&err.code)||'permission_denied',
      accounts:{},
      accountantEstimates:{}
    };
    linkedIvaState={
      account:other,
      data:null,
      loading:false,
      error:'shared_permission_denied'
    };
    if(appUnlocked)render();
  });

  /* Publish this account immediately. */
  setTimeout(v20PublishOwnSharedSnapshot,0);
}

/* Shared accountant record is now truly one record in one Firebase path. */
getAccountantEstimate=function(key=accountantKeyForPeriod()){
  let r={};
  let sourceAccount='';

  if(v19IsLinkedAccount()){
    r=((v20SharedState.accountantEstimates||{})[key])||{};
    sourceAccount=r.updatedBy||r.migratedFrom||'EMP / SUNSHOP';
  }else{
    r=((state.data.accountantEstimates||{})[key])||{};
    sourceAccount=state.account||'';
  }

  const cleared=!!r.cleared;
  const has=!cleared && (
    String(r.status||'').trim()!=='' ||
    String(r.amount||'').trim()!==''
  );

  const amount=Math.max(0,num(r.amount));
  let signed=0;
  if(r.status==='debit')signed=amount;
  else if(r.status==='credit')signed=-amount;

  return {
    key,has,cleared,
    status:has?(r.status||''):'',
    amount:has?amount:0,
    signed:has?signed:0,
    date:r.date||'',
    note:r.note||'',
    sourceAccount,
    raw:r
  };
};

saveAccountantEstimate=function(key,status,amount,date,note){
  const record={
    status:String(status||''),
    amount:String(amount??''),
    date:String(date||''),
    note:String(note||''),
    cleared:false,
    sharedPair:v19IsLinkedAccount()?'EMP_SUNSHOP':'',
    updatedBy:state.account||'',
    updatedAt:new Date().toISOString()
  };

  if(v19IsLinkedAccount()){
    return db.ref(`${V20_SHARED_ROOT}/accountantEstimates/${key}`)
      .set(record)
      .then(()=>{
        v20SharedState.accountantEstimates=v20SharedState.accountantEstimates||{};
        v20SharedState.accountantEstimates[key]=record;
        renderNav();
        render();
      })
      .catch(err=>{
        console.error('Shared accountant save failed:',err);
        alert(currentLang==='it'
          ? 'Impossibile salvare la stima condivisa. Verificare le Firebase Rules.'
          : '共享会计师预估保存失败，请检查 Firebase Rules。');
      });
  }

  state.data.accountantEstimates=state.data.accountantEstimates||{};
  state.data.accountantEstimates[key]=record;
  return save('accountantEstimates/'+key,record).then(()=>{
    renderNav();
    render();
  });
};

clearAccountantEstimate=function(key){
  if(!confirm(currentLang==='it'
    ? 'Azzerare la stima del commercialista per questo periodo?'
    : '确定清空当前期间的会计师预估吗？'))return;

  if(v19IsLinkedAccount()){
    const record={
      status:'',
      amount:'',
      date:todayISO(),
      note:'',
      cleared:true,
      sharedPair:'EMP_SUNSHOP',
      updatedBy:state.account||'',
      updatedAt:new Date().toISOString()
    };
    return db.ref(`${V20_SHARED_ROOT}/accountantEstimates/${key}`)
      .set(record)
      .then(()=>{
        v20SharedState.accountantEstimates=v20SharedState.accountantEstimates||{};
        v20SharedState.accountantEstimates[key]=record;
        renderNav();
        render();
      })
      .catch(err=>{
        console.error('Shared accountant clear failed:',err);
        alert(currentLang==='it'
          ? 'Impossibile aggiornare il dato condiviso. Verificare le Firebase Rules.'
          : '共享数据更新失败，请检查 Firebase Rules。');
      });
  }

  if(state.data.accountantEstimates)delete state.data.accountantEstimates[key];
  return db.ref('vatManagement/'+state.account+'/accountantEstimates/'+key)
    .remove()
    .then(()=>{renderNav();render()});
};

<!-- V21: Final accountant A credito comparison rule -->
<script>
Object.assign(it,{
  '系统为应缴IVA时直接采用会计师可抵扣IVA':'Se il sistema è A debito, usa direttamente l’A credito del commercialista',
  '会计师可抵扣IVA低于系统时直接采用会计师金额':'Se l’A credito del commercialista è inferiore a quello del sistema, usa direttamente l’importo del commercialista',
  '双方均为可抵扣IVA且会计师更高时才计算差额':'La differenza si calcola solo quando entrambi sono A credito e il commercialista è più alto'
});

/*
  FINAL RULE requested by user:

  Accountant = A debito:
    debt = accountant amount directly.

  Accountant = A credito:
    1) System = A debito or zero:
       pending tax credit = accountant A credito directly.
    2) System = A credito AND accountant credit > system credit:
       pending tax credit = accountant credit - system credit.
    3) System = A credito AND accountant credit < system credit:
       pending tax credit = accountant credit directly.
    4) System = A credito AND equal:
       pending tax credit = 0.

  The main "final IVA" remains accountant-led whenever accountant data exists.
*/
compareAccountant=function(s,key=s.adjustmentKey||accountantKeyForPeriod()){
  const a=getAccountantEstimate(key);
  const sys=v19GroupSystemNet(s);

  const systemDebit=Math.max(0,num(sys));
  const systemCredit=Math.max(0,-num(sys));

  if(!a.has){
    return {
      a,sys,systemDebit,systemCredit,
      sysAmount:Math.abs(num(sys)),
      comparedSystemAmount:0,
      diff:null,absDiff:null,amountGap:null,amountDue:null,oursHigher:null,
      kind:'none',label:tx('尚未输入会计师预估'),direction:'',
      sameSign:true,pendingType:'none'
    };
  }

  const accountantAmount=Math.max(0,num(a.amount));
  const comparedSystemAmount=
    a.status==='credit' ? systemCredit :
    a.status==='debit' ? systemDebit :
    Math.abs(num(sys));

  const amountGap=accountantAmount-comparedSystemAmount;
  const absDiff=Math.abs(amountGap);
  const oursHigher=Math.max(0,comparedSystemAmount-accountantAmount);
  const sameSign=(Math.sign(sys)===Math.sign(a.signed)) ||
                 (Math.abs(sys)<0.005&&Math.abs(a.signed)<0.005);

  let amountDue=0;
  let kind='diff';
  let label=tx('有差额');
  let direction='';
  let pendingType='none';

  if(a.status==='debit'){
    amountDue=accountantAmount;
    pendingType='debt';
    kind=amountDue>0?'debt':'ok';
    label=amountDue>0?tx('按会计师欠款'):tx('一致');
    direction=amountDue>0
      ? `${tx('欠款')}: ${money(amountDue)}`
      : tx('无需补差');

  }else if(a.status==='credit'){
    pendingType='credit';

    // System is A debito (or exactly zero): accountant A credito is used directly.
    if(systemDebit>0 || (systemDebit===0 && systemCredit===0)){
      amountDue=accountantAmount;
      kind='system';
      label=tx('系统为应缴IVA时直接采用会计师可抵扣IVA');
      direction=`${tx('待抵税')}: ${money(amountDue)}`;

    // Both are A credito and accountant is higher: only here do we subtract.
    }else if(systemCredit>0 && accountantAmount>systemCredit){
      amountDue=accountantAmount-systemCredit;
      kind='debt';
      label=tx('双方均为可抵扣IVA且会计师更高时才计算差额');
      direction=`${tx('待抵税')}: ${money(accountantAmount)} − ${money(systemCredit)} = ${money(amountDue)}`;

    // Both are A credito and accountant is lower: use accountant amount directly.
    }else if(systemCredit>0 && accountantAmount<systemCredit){
      amountDue=accountantAmount;
      kind='system';
      label=tx('会计师可抵扣IVA低于系统时直接采用会计师金额');
      direction=`${tx('待抵税')}: ${money(amountDue)}`;

    // Equal A credito amounts.
    }else{
      amountDue=0;
      kind='ok';
      label=tx('一致');
      direction=tx('无需补差');
    }

  }else{
    amountDue=0;
    pendingType='zero';
    kind=absDiff<0.01?'ok':'diff';
    label=absDiff<0.01?tx('一致'):tx('有差额');
    direction=tx('无需补差');
  }

  if(!sameSign && Math.abs(sys)>=0.01 && Math.abs(a.signed)>=0.01){
    direction += `${direction?' · ':''}${tx('状态方向不同，请同时核对A CREDITO/A DEBITO')}`;
  }

  return {
    a,sys,systemDebit,systemCredit,
    sysAmount:Math.abs(num(sys)),
    comparedSystemAmount,
    diff:amountGap,absDiff,amountGap,amountDue,oursHigher,
    kind,label,direction,sameSign,pendingType
  };
};

accountantCompareHTML=function(s,key=s.adjustmentKey||accountantKeyForPeriod(),editable=false){
  const c=compareAccountant(s,key),a=c.a;
  const statusClass=c.kind==='ok'?'match':c.kind==='none'?'system':c.kind==='debt'?'debt':'warn';
  const updated=a.date?toSlashDate(a.date):(a.raw.updatedAt?new Date(a.raw.updatedAt).toLocaleDateString('it-IT'):'');
  const dueText=c.amountDue===null?'—':money(c.amountDue);
  const gapText=c.absDiff===null?'—':money(c.absDiff);

  let ruleLine='';
  let statusNote=tx('本项仅用于对比，不会覆盖系统IVA计算');

  if(a.has && a.status==='debit'){
    ruleLine=currentLang==='it'
      ? `Debito = A debito del commercialista = ${money(a.amount)}`
      : `欠款 = 会计师应缴IVA = ${money(a.amount)}`;
    statusNote=currentLang==='it'
      ? 'Quando il commercialista indica A debito, viene usato direttamente il suo importo.'
      : '会计师显示应缴IVA时，欠款直接采用会计师金额。';

  }else if(a.has && a.status==='credit'){
    const acc=Math.max(0,num(a.amount));

    if(c.systemDebit>0 || (c.systemDebit===0 && c.systemCredit===0)){
      ruleLine=currentLang==='it'
        ? `Sistema A debito / zero → IVA da compensare = A credito commercialista = ${money(acc)}`
        : `系统为应缴IVA/€0 → 待抵税 = 会计师可抵扣IVA = ${money(acc)}`;
      statusNote=tx('系统为应缴IVA时直接采用会计师可抵扣IVA');

    }else if(c.systemCredit>0 && acc>c.systemCredit){
      ruleLine=currentLang==='it'
        ? `Entrambi A credito e commercialista più alto → ${money(acc)} − ${money(c.systemCredit)} = ${money(c.amountDue)}`
        : `双方都是可抵扣IVA且会计师更高 → ${money(acc)} − ${money(c.systemCredit)} = ${money(c.amountDue)}`;
      statusNote=tx('双方均为可抵扣IVA且会计师更高时才计算差额');

    }else if(c.systemCredit>0 && acc<c.systemCredit){
      ruleLine=currentLang==='it'
        ? `A credito commercialista più basso → IVA da compensare = ${money(acc)}`
        : `会计师可抵扣IVA低于系统 → 待抵税直接 = ${money(acc)}`;
      statusNote=tx('会计师可抵扣IVA低于系统时直接采用会计师金额');

    }else{
      ruleLine=currentLang==='it'
        ? `A credito uguale → IVA da compensare = ${money(0)}`
        : `双方可抵扣IVA相同 → 待抵税 = ${money(0)}`;
      statusNote=tx('一致');
    }
  }

  const pendingLabel=a.has
    ? (a.status==='debit'?tx('欠款'):a.status==='credit'?tx('待抵税'):tx('待抵税/欠款'))
    : tx('待抵税/欠款');

  const systemMini = a.has && a.status==='credit'
    ? `${tx('我们的可抵扣IVA')}: ${money(c.systemCredit)}`
    : a.has && a.status==='debit'
      ? `${tx('我们的应缴IVA')}: ${money(c.systemDebit)}`
      : `${tx('我们的预估金额')}: ${money(c.sysAmount)}`;

  return `<div class="card accountant-panel">

<script>
Object.assign(it,{
  '当前生效版本':'Versione attiva',
  '仅最新会计师预估参与计算':'Solo l’ultima stima del commercialista entra nel calcolo',
  '旧版本仅保留历史，不再参与计算':'Le versioni precedenti restano solo nello storico e non entrano più nel calcolo',
  '会计师历史版本':'Storico stime commercialista',
  '已结清':'Chiuso',

  '保存新的会计师预估后，旧预估会自动退出计算':'Salvando una nuova stima, quella precedente viene esclusa automaticamente dal calcolo',
  '与当前系统最新预估实时比较':'Confronto in tempo reale con l’ultima stima disponibile del sistema',
  '旧版本待抵税/欠款':'Saldo precedente da compensare/debito',
  '历史版本':'Versione storica'
});

function v22RawAccountantRecord(key){
  if(v19IsLinkedAccount()){
    return ((v20SharedState.accountantEstimates||{})[key])||{};
  }
  return ((state.data.accountantEstimates||{})[key])||{};
}

function v22CurrentVersion(raw){
  const v=parseInt(raw&&raw.version,10);
  if(Number.isFinite(v)&&v>0)return v;
  const history=raw&&raw.history&&typeof raw.history==='object'?raw.history:{};
  return Math.max(1,Object.keys(history).length+1);
}

function v22OldPendingAmount(key){
  try{
    const current=getAccountantEstimate(key);
    if(!current.has)return 0;
    const summary=calcSummary();
    const cmp=compareAccountant(summary,key);
    return Math.max(0,num(cmp.amountDue));
  }catch(e){
    return 0;
  }
}

function v22ArchiveCurrent(raw,key,lifecycleStatus,pending,nextVersion){
  const meaningful=raw && !raw.cleared && (
    String(raw.status||'').trim()!=='' ||
    String(raw.amount||'').trim()!==''
  );
  const history=(raw&&raw.history&&typeof raw.history==='object')
    ? {...raw.history}
    : {};

  if(!meaningful)return history;

  const {
    history:_ignoreHistory,
    ...snapshot
  }=raw;

  const id=String(Date.now())+'_'+String(state.account||'ACCOUNT');
  history[id]={
    ...snapshot,
    archived:true,
    active:false,
    lifecycleStatus:lifecycleStatus||'superseded',
    pendingAtClose:String(Math.max(0,num(pending))),
    closedAt:new Date().toISOString(),
    closedBy:state.account||'',
    replacedByVersion:nextVersion||null
  };
  return history;
}

function getAccountantHistory(key=accountantKeyForPeriod()){
  const raw=v22RawAccountantRecord(key);
  const history=(raw.history&&typeof raw.history==='object')?raw.history:{};
  return Object.entries(history)
    .map(([id,r])=>({id,...(r||{})}))
    .sort((a,b)=>String(b.closedAt||b.updatedAt||'').localeCompare(String(a.closedAt||a.updatedAt||'')));
}

/* New save rule:
   - The new record becomes the ONLY active accountant estimate.
   - The previous active record is archived and never used again.
   - If the old pending amount was already 0, it is archived as "settled".
   - Otherwise it is archived as "superseded".
   - The new active estimate immediately compares with the CURRENT latest system estimate.
*/
saveAccountantEstimate=function(key,status,amount,date,note){
  const oldRaw=v22RawAccountantRecord(key);
  const oldPending=v22OldPendingAmount(key);
  const oldVersion=v22CurrentVersion(oldRaw);
  const hadOld=!!oldRaw && !oldRaw.cleared && (
    String(oldRaw.status||'').trim()!=='' ||
    String(oldRaw.amount||'').trim()!==''
  );
  const nextVersion=hadOld?oldVersion+1:Math.max(1,oldVersion);
  const oldState=oldPending<=0.005?'settled':'superseded';
  const history=v22ArchiveCurrent(oldRaw,key,oldState,oldPending,nextVersion);

  const record={
    status:String(status||''),
    amount:String(amount??''),
    date:String(date||''),
    note:String(note||''),
    cleared:false,
    active:true,
    version:nextVersion,
    history,
    sharedPair:v19IsLinkedAccount()?'EMP_SUNSHOP':'',
    updatedBy:state.account||'',
    updatedAt:new Date().toISOString()
  };

  if(v19IsLinkedAccount()){
    return db.ref(`${V20_SHARED_ROOT}/accountantEstimates/${key}`)
      .set(record)
      .then(()=>{
        v20SharedState.accountantEstimates=v20SharedState.accountantEstimates||{};
        v20SharedState.accountantEstimates[key]=record;
        renderNav();
        render();
      })
      .catch(err=>{
        console.error('Shared accountant save failed:',err);
        alert(currentLang==='it'
          ? 'Impossibile salvare la stima condivisa. Verificare le Firebase Rules.'
          : '共享会计师预估保存失败，请检查 Firebase Rules。');
      });
  }

  state.data.accountantEstimates=state.data.accountantEstimates||{};
  state.data.accountantEstimates[key]=record;
  return save('accountantEstimates/'+key,record).then(()=>{
    renderNav();
    render();
  });
};

/* Clearing also preserves history. The cleared record does not participate in calculation. */
clearAccountantEstimate=function(key){
  if(!confirm(currentLang==='it'
    ? 'Azzerare la stima attiva del commercialista per questo periodo? La cronologia verrà conservata.'
    : '确定清空当前生效的会计师预估吗？历史记录会保留。'))return;

  const oldRaw=v22RawAccountantRecord(key);
  const oldPending=v22OldPendingAmount(key);
  const oldVersion=v22CurrentVersion(oldRaw);
  const hadOld=!!oldRaw && !oldRaw.cleared && (
    String(oldRaw.status||'').trim()!=='' ||
    String(oldRaw.amount||'').trim()!==''
  );
  const history=v22ArchiveCurrent(
    oldRaw,
    key,
    oldPending<=0.005?'settled':'cleared',
    oldPending,
    null
  );

  const record={
    status:'',
    amount:'',
    date:todayISO(),
    note:'',
    cleared:true,
    active:false,
    version:hadOld?oldVersion:Math.max(1,oldVersion),
    history,
    sharedPair:v19IsLinkedAccount()?'EMP_SUNSHOP':'',
    updatedBy:state.account||'',
    updatedAt:new Date().toISOString()
  };

  if(v19IsLinkedAccount()){
    return db.ref(`${V20_SHARED_ROOT}/accountantEstimates/${key}`)
      .set(record)
      .then(()=>{
        v20SharedState.accountantEstimates=v20SharedState.accountantEstimates||{};
        v20SharedState.accountantEstimates[key]=record;
        renderNav();
        render();
      })
      .catch(err=>{
        console.error('Shared accountant clear failed:',err);
        alert(currentLang==='it'
          ? 'Impossibile aggiornare il dato condiviso. Verificare le Firebase Rules.'
          : '共享数据更新失败，请检查 Firebase Rules。');
      });
  }

  state.data.accountantEstimates=state.data.accountantEstimates||{};
  state.data.accountantEstimates[key]=record;
  return save('accountantEstimates/'+key,record).then(()=>{
    renderNav();
    render();
  });
};

function v22HistoryStatusLabel(r){
  if(r.lifecycleStatus==='settled')return tx('已结清');
  if(r.lifecycleStatus==='cleared')return tx('已清空');
  return tx('已替代');
}

function v22HistoryHTML(key){
  const a=getAccountantEstimate(key);
  const raw=v22RawAccountantRecord(key);
  const version=v22CurrentVersion(raw);
  const history=getAccountantHistory(key);

  const currentInfo=a.has

  const rows=history.map(r=>{
    const status=r.status?accountantStatusLabel(r.status):tx('未填写');
    const amount=money(Math.max(0,num(r.amount)));
    const date=r.date?toSlashDate(r.date):(r.updatedAt?new Date(r.updatedAt).toLocaleDateString('it-IT'):'—');
    const pending=money(Math.max(0,num(r.pendingAtClose)));
    const css=(r.lifecycleStatus==='settled'?'settled':r.lifecycleStatus==='cleared'?'cleared':'superseded');
    const oldV=parseInt(r.version,10)||'—';
    return `<div class="acc-history-item">
      <div>
        <small>${tx('历史版本')} V${oldV} · ${date}</small>
        <b>${status} · ${amount}</b>
      </div>
      <div>
        <small>${tx('旧版本待抵税/欠款')}</small>
        <b>${pending}</b>
      </div>
      <span class="acc-history-state ${css}">${v22HistoryStatusLabel(r)}</span>
    </div>`;
  }).join('');

  return `<div class="acc-version-strip">
      <b>${currentInfo}</b>
      <span>${tx('仅最新会计师预估参与计算')} · ${tx('与当前系统最新预估实时比较')}</span>
    </div>
    ${history.length?`<details class="acc-history">
      <summary>${tx('会计师历史版本')} (${history.length})</summary>
      <div class="acc-history-list">${rows}</div>
    </details>`:''}`;
}

/* Keep the existing form, but clearly show the active version/history and the new lifecycle rule. */
const _v22BaseAccountantFormHTML=accountantFormHTML;
accountantFormHTML=function(s,key=s.adjustmentKey||accountantKeyForPeriod()){

/* Add version context to the comparison panel without changing the established credit/debit formula. */
const _v22BaseAccountantCompareHTML=accountantCompareHTML;

<script>
/*
  V23 FINAL MANAGEMENT LOGIC

  1) A commercialista estimate has a DATA CUTOFF DATE.
  2) Only the newest active estimate participates in the comparison.
  3) Replacing an estimate archives it as "superseded"; replacement NEVER means settled.
  4) "Settled" is explicit. It creates a settlement lock at that estimate's cutoff date.
  5) Once locked:
       invoice/closure date <= settlement cutoff => historical record only;
       date > settlement cutoff => current IVA calculation.
  6) A late-entered old invoice therefore cannot create a second tax credit/debit after settlement.
  7) Before settlement, a late invoice inside the active estimate cutoff DOES update the system
     estimate and therefore updates the pending tax credit.
  8) For comparison, the system is calculated only through the commercialista cutoff date.
  9) EMP + SUNSHOP share the same accountant record and the same settlement locks.
*/

Object.assign(it,{
  '会计师数据截止日期':'Data limite dati commercialista',
  '标记已结清':'Segna come chiuso',
  '确认已结清':'Conferma chiusura',
  '已结清截止日期':'Data limite chiusa',
  '结清锁定':'Blocco di chiusura',
  '结清后旧发票仅记录，不再参与当前IVA':'Dopo la chiusura, le vecchie fatture restano nello storico e non partecipano più all’IVA corrente',
  '当前未结清阶段':'Periodo corrente non chiuso',
  '当前计算起点':'Inizio calcolo corrente',
  '系统比较截止日期':'Data limite confronto sistema',
  '截止日期必须晚于已结清日期':'La data limite deve essere successiva all’ultima data già chiusa',
  '请先填写有效的会计师截止日期':'Inserire prima una data limite valida del commercialista',
  '此操作会锁定该截止日期及以前的数据，之后补录的旧发票只作为历史记录，不再参与当前IVA计算。':'Questa operazione blocca i dati fino alla data limite inclusa. Le vecchie fatture inserite successivamente resteranno solo nello storico e non parteciperanno più al calcolo IVA corrente.',
  '已结清记录':'Record chiusi',
  '明确结清后才会锁定':'Il blocco avviene solo dopo una chiusura esplicita',
  '被新预估替代不等于已结清':'Essere sostituito da una nuova stima non significa essere chiuso',
  '当前阶段从结清日期次日开始计算':'Il periodo corrente viene calcolato dal giorno successivo alla data chiusa',
  '按会计师应缴IVA':'Usa l’A debito del commercialista',
  '应缴IVA':'A debito',
  '待抵税/应缴IVA':'IVA da compensare / A debito'
});

/* Keep terminology clean in Chinese: use 应缴IVA, not 欠款. */
const _v23TxBase = tx;
tx = function(s){
  if(currentLang==='zh'){
    if(s==='欠款') return '应缴IVA';
    if(s==='按会计师欠款') return '按会计师应缴IVA';
    if(s==='待抵税/欠款') return '待抵税/应缴IVA';
    if(s==='会计师更新日期') return '会计师数据截止日期';
  }
  if(currentLang==='it' && s==='会计师更新日期') return 'Data limite dati commercialista';
  return _v23TxBase(s);
};

function v23ISODate(v){
  const d=normalizeDateValue(String(v||'').trim());
  return /^\d{4}-\d{2}-\d{2}$/.test(d||'') ? d : '';
}

function v23AccountantRaw(key){
  return v22RawAccountantRecord(key)||{};
}

function v23SettlementMap(key){
  const raw=v23AccountantRaw(key);
  return (raw.settlements && typeof raw.settlements==='object') ? raw.settlements : {};
}

function v23Settlements(key){
  return Object.entries(v23SettlementMap(key))
    .map(([id,r])=>({id,...(r||{})}))
    .filter(r=>v23ISODate(r.cutoffDate||r.date))
    .sort((a,b)=>String(b.cutoffDate||b.date||'').localeCompare(String(a.cutoffDate||a.date||'')));
}

function v23LatestSettlementCutoff(key){
  const rows=v23Settlements(key);
  return rows.length ? v23ISODate(rows[0].cutoffDate||rows[0].date) : '';
}

function v23RecordIsActive(raw){
  return !!raw && !raw.cleared && (
    String(raw.status||'').trim()!=='' ||
    String(raw.amount||'').trim()!==''
  );
}

function v23ArchiveActive(raw,lifecycleStatus,pending,nextVersion){
  const history=(raw&&raw.history&&typeof raw.history==='object') ? {...raw.history} : {};
  if(!v23RecordIsActive(raw)) return history;

  const snapshot={...raw};
  delete snapshot.history;
  delete snapshot.settlements;

  const id=String(Date.now())+'_'+String(state.account||'ACCOUNT');
  history[id]={
    ...snapshot,
    archived:true,
    active:false,
    lifecycleStatus:lifecycleStatus||'superseded',
    pendingAtClose:String(Math.max(0,num(pending))),
    closedAt:new Date().toISOString(),
    closedBy:state.account||'',
    replacedByVersion:nextVersion||null
  };
  return history;
}

function v23HasPriorVersion(raw){
  if(!raw || typeof raw!=='object') return false;
  if(Number(raw.version)>0) return true;
  if(v23RecordIsActive(raw)) return true;
  return !!(raw.history && Object.keys(raw.history).length);
}

function v23NextVersion(raw){
  const current=Math.max(0,parseInt(raw&&raw.version,10)||0);
  if(!v23HasPriorVersion(raw)) return 1;
  return Math.max(1,current+1);
}

function v23PersistAccountantRecord(key,record){
  if(v19IsLinkedAccount()){
    return db.ref(`${V20_SHARED_ROOT}/accountantEstimates/${key}`)
      .set(record)
      .then(()=>{
        v20SharedState.accountantEstimates=v20SharedState.accountantEstimates||{};
        v20SharedState.accountantEstimates[key]=record;
        renderNav();
        render();
      })
      .catch(err=>{
        console.error('Shared accountant write failed:',err);
        alert(currentLang==='it'
          ? 'Impossibile salvare il dato condiviso. Verificare le Firebase Rules.'
          : '共享会计师数据保存失败，请检查 Firebase Rules。');
      });
  }

  state.data.accountantEstimates=state.data.accountantEstimates||{};
  state.data.accountantEstimates[key]=record;
  return save('accountantEstimates/'+key,record).then(()=>{
    renderNav();
    render();
  });
}

/* Save = NEW active version. The old active version is only "superseded",
   never automatically "settled". */
saveAccountantEstimate=function(key,status,amount,date,note){
  const oldRaw=v23AccountantRaw(key);
  const cutoff=v23ISODate(date)||todayISO();
  const latestLock=v23LatestSettlementCutoff(key);

  if(latestLock && cutoff<=latestLock){
    alert(`${tx('截止日期必须晚于已结清日期')}: ${toSlashDate(latestLock)}`);
    return Promise.resolve(false);
  }

  let oldPending=0;
  try{
    if(v23RecordIsActive(oldRaw)){
      oldPending=Math.max(0,num(compareAccountant(calcSummary(),key).amountDue));
    }
  }catch(e){ oldPending=0; }

  const nextVersion=v23NextVersion(oldRaw);
  const history=v23ArchiveActive(oldRaw,'superseded',oldPending,nextVersion);
  const settlements=(oldRaw.settlements&&typeof oldRaw.settlements==='object')
    ? {...oldRaw.settlements}
    : {};

  const record={
    status:String(status||''),
    amount:String(amount??''),
    date:cutoff,
    cutoffDate:cutoff,
    note:String(note||''),
    cleared:false,
    active:true,
    version:nextVersion,
    history,
    settlements,
    sharedPair:v19IsLinkedAccount()?'EMP_SUNSHOP':'',
    updatedBy:state.account||'',
    updatedAt:new Date().toISOString()
  };

  return v23PersistAccountantRecord(key,record);
};

/* Clear removes the active estimate from calculation but DOES NOT create a settlement lock. */
clearAccountantEstimate=function(key){
  if(!confirm(currentLang==='it'
    ? 'Azzerare la stima attiva? La cronologia e le chiusure già confermate resteranno salvate.'
    : '确定清空当前会计师预估吗？历史记录和已经确认的结清记录会保留。'))return;

  const oldRaw=v23AccountantRaw(key);
  let oldPending=0;
  try{
    if(v23RecordIsActive(oldRaw)){
      oldPending=Math.max(0,num(compareAccountant(calcSummary(),key).amountDue));
    }
  }catch(e){ oldPending=0; }

  const history=v23ArchiveActive(oldRaw,'cleared',oldPending,null);
  const settlements=(oldRaw.settlements&&typeof oldRaw.settlements==='object')
    ? {...oldRaw.settlements}
    : {};

  const record={
    status:'',
    amount:'',
    date:'',
    cutoffDate:'',
    note:'',
    cleared:true,
    active:false,
    version:Math.max(1,parseInt(oldRaw.version,10)||1),
    history,
    settlements,
    sharedPair:v19IsLinkedAccount()?'EMP_SUNSHOP':'',
    updatedBy:state.account||'',

  };

};

/* EXPLICIT settlement:
   This is the only action that creates a tax-stage lock. */
function markAccountantSettled(key){
  const a=getAccountantEstimate(key);
  if(!a.has) return;

  const cutoff=v23ISODate(a.date||a.raw.cutoffDate);
  if(!cutoff){
    alert(tx('请先填写有效的会计师截止日期'));
    return;
  }

  const previousLock=v23LatestSettlementCutoff(key);
  if(previousLock && cutoff<=previousLock){
    alert(`${tx('截止日期必须晚于已结清日期')}: ${toSlashDate(previousLock)}`);
    return;
  }

  const msg=currentLang==='it'
    ? `Confermare la chiusura fino al ${toSlashDate(cutoff)}?\n\n${tx('此操作会锁定该截止日期及以前的数据，之后补录的旧发票只作为历史记录，不再参与当前IVA计算。')}`
    : `确认截至 ${toSlashDate(cutoff)} 已结清吗？\n\n${tx('此操作会锁定该截止日期及以前的数据，之后补录的旧发票只作为历史记录，不再参与当前IVA计算。')}`;

  if(!confirm(msg)) return;

  const raw=v23AccountantRaw(key);
  const c=compareAccountant(calcSummary(),key);
  const settlements=(raw.settlements&&typeof raw.settlements==='object')
    ? {...raw.settlements}
    : {};
  const sid=String(Date.now())+'_'+String(state.account||'ACCOUNT');

  settlements[sid]={
    cutoffDate:cutoff,
    status:a.status,
    amount:String(a.amount),
    version:Math.max(1,parseInt(raw.version,10)||1),
    systemNetAtSettlement:String(num(c.sys)),
    pendingAtSettlement:String(Math.max(0,num(c.amountDue))),
    settledAt:new Date().toISOString(),
    settledBy:state.account||'',
    explicit:true
  };

  const history=v23ArchiveActive(raw,'settled',Math.max(0,num(c.amountDue)),null);

  const record={
    status:'',
    amount:'',
    date:'',
    cutoffDate:'',
    note:'',
    cleared:true,
    active:false,
    version:Math.max(1,parseInt(raw.version,10)||1),
    history,
    settlements,
    sharedPair:v19IsLinkedAccount()?'EMP_SUNSHOP':'',
    updatedBy:state.account||'',
    updatedAt:new Date().toISOString()
  };

  return v23PersistAccountantRecord(key,record);
}

/* Track adjustment-field update time so an old quarter adjustment is not accidentally reused
   after a settlement lock. */
saveIvaAdjustmentField=function(field,value,key=adjustmentKeyForPeriod()){
  state.data.ivaAdjustments=state.data.ivaAdjustments||{};
  const r={...(state.data.ivaAdjustments[key]||{})};
  r[field]=String(value??'');
  r[field+'UpdatedAt']=new Date().toISOString();
  r.updatedAt=new Date().toISOString();
  state.data.ivaAdjustments[key]=r;
  return save('ivaAdjustments/'+key,r).then(()=>setTimeout(render,80));
};

/* Include adjustment timestamps in the sanitized EMP/SUNSHOP bridge. */
const _v23SanitizeForSharedBase=v20SanitizeForShared;
v20SanitizeForShared=function(data){
  const payload=_v23SanitizeForSharedBase(data);
  Object.entries((data||{}).ivaAdjustments||{}).forEach(([k,x])=>{
    if(!payload.ivaAdjustments[k])payload.ivaAdjustments[k]={};
    payload.ivaAdjustments[k].creditoPrecedenteUpdatedAt=x&&x.creditoPrecedenteUpdatedAt||'';
    payload.ivaAdjustments[k].rettificheUpdatedAt=x&&x.rettificheUpdatedAt||'';
    payload.ivaAdjustments[k].updatedAt=x&&x.updatedAt||'';
  });
  return payload;
};

function v23TimestampDate(ts){
  if(!ts)return '';
  const d=new Date(ts);
  if(Number.isNaN(d.getTime()))return '';
  return localDateISO(d);
}

function v23FieldWasUpdatedAfter(raw,field,lock,endDate){
  if(!raw)return false;
  const ts=raw[field+'UpdatedAt']||'';
  if(!ts)return false;
  const d=v23TimestampDate(ts);
  return !!d && (!lock || d>lock) && (!endDate || d<=endDate);
}

function v23PostLockAdjustment(data,key,lock,endDate){
  const raw=((data||{}).ivaAdjustments||{})[key]||{};
  const carry=v23FieldWasUpdatedAfter(raw,'creditoPrecedente',lock,endDate)
    ? num(raw.creditoPrecedente)
    : 0;
  const rett=v23FieldWasUpdatedAfter(raw,'rettifiche',lock,endDate)
    ? num(raw.rettifiche)
    : 0;
  return {carry,rett};
}

function v23DateInside(date,startExclusive,endInclusive){
  const d=v23ISODate(date);
  if(!d)return false;
  if(startExclusive && d<=startExclusive)return false;
  if(endInclusive && d>endInclusive)return false;
  return true;
}

function v23RangeParts(data,startExclusive,endInclusive){
  data=data||{};
  const rows=Object.entries(data.fatture||{}).map(([id,x])=>{
    x=x||{};
    const imponibile=num(x.imponibile),imposta=num(x.imposta);
    return {id,...x,imponibile,imposta,totale:imponibile+imposta};
  }).filter(r=>v23DateInside(v9RawInvoiceDate(r),startExclusive,endInclusive));

  const f=rows.reduce((a,x)=>{
    a.count++;
    a.imponibile+=num(x.imponibile);
    a.imposta+=num(x.imposta);
    a.totale+=num(x.totale);
    return a;
  },{count:0,imponibile:0,imposta:0,totale:0});

  const ch=Object.values(data.chiusure||{}).filter(x=>
    x&&v23DateInside(x.data,startExclusive,endInclusive)
  );
  const salesIva=ch.reduce((s,x)=>s+num(x.ivaVendite),0);
  const chiusura=ch.reduce((s,x)=>s+num(x.totale),0);

  return {
    rows,...f,
    salesIva,
    fattureIva:f.imposta,
    chiusura,
    rangeChiusura:chiusura,
    baseNet:salesIva-f.imposta
  };
}

function v23KeyQuarter(key,endDate){
  const m=String(key||'').match(/^quarter_(\d{4}-Q[1-4])$/);
  return m ? m[1] : quarterKey(endDate||todayISO());
}

/* Fixed terms that existed at the start of a quarter.
   If there is a settlement lock inside the quarter, old carry/rettifiche are considered consumed.
   Only fields explicitly edited after the lock are allowed into the current stage. */
function v23StandaloneFixedTerms(data,key,lock,endDate){
  if(lock){
    const a=v23PostLockAdjustment(data,key,lock,endDate);
    return {carry:a.carry,rett:a.rett};
  }

  if(String(key||'').startsWith('quarter_')){
    const q=v23KeyQuarter(key,endDate);
    const full=v9StandaloneQuarterSummary(data||{},q);
    return {
      carry:num(full&&full.creditoPrecedente),
      rett:num(full&&full.rettifiche)
    };
  }

  const raw=((data||{}).ivaAdjustments||{})[key]||{};
  return {carry:num(raw.creditoPrecedente),rett:num(raw.rettifiche)};
}

function v23ComparisonRange(key,a){
  const lock=v23LatestSettlementCutoff(key);
  const end=(a&&a.has&&v23ISODate(a.date||a.raw.cutoffDate))
    ? v23ISODate(a.date||a.raw.cutoffDate)
    : todayISO();
  return {lock,end};
}

function v23StandaloneNetToCutoff(data,key,a){
  const {lock,end}=v23ComparisonRange(key,a);
  const p=v23RangeParts(data||{},lock,end);
  const fixed=v23StandaloneFixedTerms(data||{},key,lock,end);
  const net=p.baseNet-fixed.carry+fixed.rett;
  return {net,...p,...fixed,startExclusive:lock,endInclusive:end};
}

function v23GroupNetToCutoff(s,key,a){
  const {lock,end}=v23ComparisonRange(key,a);

  if(v19IsLinkedAccount()){
    const pairData=v9LinkedDatas();
    if(pairData){
      const ep=v23RangeParts(pairData.emp,lock,end);
      const sp=v23RangeParts(pairData.sun,lock,end);

      let eCarry=0,sCarry=0,eRett=0,sRett=0;

      if(lock){
        const ea=v23PostLockAdjustment(pairData.emp,key,lock,end);
        const sa=v23PostLockAdjustment(pairData.sun,key,lock,end);
        eCarry=ea.carry;eRett=ea.rett;
        sCarry=sa.carry;sRett=sa.rett;
      }else if(String(key||'').startsWith('quarter_')){
        const q=v23KeyQuarter(key,end);
        const pair=v9LinkedQuarterPair(pairData.emp,pairData.sun,q);
        if(pair){
          eCarry=num(pair.emp&&pair.emp.creditoPrecedente);
          sCarry=num(pair.sun&&pair.sun.creditoPrecedente);
          eRett=num(pair.emp&&pair.emp.rettifiche);
          sRett=num(pair.sun&&pair.sun.rettifiche);
        }
      }else{
        const ea=((pairData.emp||{}).ivaAdjustments||{})[key]||{};
        const sa=((pairData.sun||{}).ivaAdjustments||{})[key]||{};
        eCarry=num(ea.creditoPrecedente);eRett=num(ea.rettifiche);
        sCarry=num(sa.creditoPrecedente);sRett=num(sa.rettifiche);
      }

      const empNet=ep.baseNet-eCarry+eRett;
      const sunNet=sp.baseNet-sCarry+sRett;

      return {
        net:empNet+sunNet,
        empNet,sunNet,
        startExclusive:lock,
        endInclusive:end
      };
    }
  }

  return v23StandaloneNetToCutoff(state.data||{},key,a);
}

/* If a quarter contains an explicit settlement lock, its CURRENT unresolved core starts
   the day after the latest lock. This also prevents already-settled amounts from being
   carried into the next quarter a second time. */
const _v23QuarterCoreBase=v9QuarterCore;
v9QuarterCore=function(data,q){
  const key=adjustmentKeyForQuarter(q);
  const lock=v23LatestSettlementCutoff(key);
  if(!lock)return _v23QuarterCoreBase(data,q);

  const end=`${q.slice(0,4)}-${String((Number(q.slice(-1))-1)*3+3).padStart(2,'0')}-31`;
  const p=v23RangeParts(data||{},lock,end);
  const post=v23PostLockAdjustment(data||{},key,lock,end);
  const rawAdj=((data||{}).ivaAdjustments||{})[key]||{};
  const baseNet=p.salesIva-p.imposta+post.rett;

  return {
    rows:p.rows,
    count:p.count,
    imponibile:p.imponibile,
    imposta:p.imposta,
    totale:p.totale,
    rangeChiusura:p.chiusura,
    chiusura:p.chiusura,
    salesIva:p.salesIva,
    fattureIva:p.imposta,
    rettifiche:post.rett,
    baseNet,
    manualOverride:post.carry!==0,
    manualCarry:post.carry,
    adjustmentKey:key,
    invoiceCount:p.rows.length,
    settlementCutoff:lock,
    activeStage:true,
    rawAdjustment:rawAdj
  };
};

/* Current summary after a settlement lock:
   old invoices remain stored, but they do not change the CURRENT unresolved IVA. */
const _v23CalcSummaryBase=calcSummary;
calcSummary=function(p=state.period){
  const key=adjustmentKeyForPeriod(p);
  const lock=v23LatestSettlementCutoff(key);
  if(!lock)return _v23CalcSummaryBase(p);

  if(p==='quarter'){
    const q=quarterKey(todayISO());
    const pairData=v9LinkedDatas();
    if(pairData){
      const pair=v9LinkedQuarterPair(pairData.emp,pairData.sun,q);
      const own=state.account==='EMP'?pair.emp:pair.sun;
      own.totalAll=totalChiusure('all');
      own.settlementCutoff=lock;
      own.activeStage=true;
      return own;
    }
    const own=v9StandaloneQuarterSummary(state.data||{},q);
    own.totalAll=totalChiusure('all');
    own.settlementCutoff=lock;
    own.activeStage=true;
    return own;
  }

  const pRange=v23RangeParts(state.data||{},lock,todayISO());
  const post=v23PostLockAdjustment(state.data||{},key,lock,todayISO());
  const net=pRange.baseNet-post.carry+post.rett;
  const rate=num(state.data.ivaConfig?.aliquota)||22;

  return {
    ...pRange,
    creditoPrecedente:post.carry,
    rettifiche:post.rett,
    baseNet:pRange.baseNet,
    net,
    ivaDebito:Math.max(0,net),
    ivaCredito:Math.max(0,-net),
    gap:Math.max(0,net),
    needImp:0,
    needTot:0,
    rate,
    adjustmentKey:key,
    invoiceCount:pRange.rows.length,
    totalAll:totalChiusure('all'),
    settlementCutoff:lock,
    activeStage:true
  };
};

/* Linked panel also starts after the shared settlement cutoff. */
const _v23LinkedPairSummariesBase=linkedPairSummaries;
linkedPairSummaries=function(){
  const key=adjustmentKeyForPeriod(state.period);
  const lock=v23LatestSettlementCutoff(key);
  if(!lock || state.period!=='quarter')return _v23LinkedPairSummariesBase();

  const pairData=v9LinkedDatas();
  if(!pairData)return null;
  const pair=v9LinkedQuarterPair(pairData.emp,pairData.sun,quarterKey(todayISO()));
  return {emp:pair.emp,sun:pair.sun};
};

/* Comparison always uses:
     latest active commercialista estimate
     vs system data through THAT estimate's cutoff date.
*/
compareAccountant=function(s,key=s.adjustmentKey||accountantKeyForPeriod()){
  const a=getAccountantEstimate(key);
  const ranged=v23GroupNetToCutoff(s,key,a);
  const sys=num(ranged.net);

  const systemDebit=Math.max(0,sys);
  const systemCredit=Math.max(0,-sys);

  if(!a.has){
    return {
      a,sys,systemDebit,systemCredit,
      sysAmount:Math.abs(sys),
      comparedSystemAmount:0,
      diff:null,absDiff:null,amountGap:null,amountDue:null,oursHigher:null,
      kind:'none',label:tx('尚未输入会计师预估'),direction:'',
      sameSign:true,pendingType:'none',
      comparisonStart:ranged.startExclusive||'',
      comparisonEnd:ranged.endInclusive||todayISO()
    };
  }

  const accountantAmount=Math.max(0,num(a.amount));
  const comparedSystemAmount=
    a.status==='credit' ? systemCredit :
    a.status==='debit' ? systemDebit :
    Math.abs(sys);

  const amountGap=accountantAmount-comparedSystemAmount;
  const absDiff=Math.abs(amountGap);
  const oursHigher=Math.max(0,comparedSystemAmount-accountantAmount);
  const sameSign=(Math.sign(sys)===Math.sign(a.signed)) ||
                 (Math.abs(sys)<0.005&&Math.abs(a.signed)<0.005);

  let amountDue=0;
  let kind='diff';
  let label=tx('有差额');
  let direction='';
  let pendingType='none';

  if(a.status==='debit'){
    amountDue=accountantAmount;
    pendingType='debt';
    kind=amountDue>0?'debt':'ok';
    label=amountDue>0?tx('按会计师应缴IVA'):tx('一致');
    direction=amountDue>0
      ? `${tx('应缴IVA')}: ${money(amountDue)}`
      : tx('无需补差');

  }else if(a.status==='credit'){
    pendingType='credit';

    if(systemDebit>0 || (systemDebit===0 && systemCredit===0)){
      amountDue=accountantAmount;
      kind='system';
      label=tx('系统为应缴IVA时直接采用会计师可抵扣IVA');
      direction=`${tx('待抵税')}: ${money(amountDue)}`;

    }else if(systemCredit>0 && accountantAmount>systemCredit){
      amountDue=accountantAmount-systemCredit;
      kind='debt';
      label=tx('双方均为可抵扣IVA且会计师更高时才计算差额');
      direction=`${tx('待抵税')}: ${money(accountantAmount)} − ${money(systemCredit)} = ${money(amountDue)}`;

    }else if(systemCredit>0 && accountantAmount<systemCredit){
      amountDue=accountantAmount;
      kind='system';
      label=tx('会计师可抵扣IVA低于系统时直接采用会计师金额');
      direction=`${tx('待抵税')}: ${money(amountDue)}`;

    }else{
      amountDue=0;
      kind='ok';
      label=tx('一致');
      direction=tx('无需补差');
    }

  }else{
    amountDue=0;
    pendingType='zero';
    kind=absDiff<0.01?'ok':'diff';
    label=absDiff<0.01?tx('一致'):tx('有差额');
    direction=tx('无需补差');
  }

  if(!sameSign && Math.abs(sys)>=0.01 && Math.abs(a.signed)>=0.01){
    direction += `${direction?' · ':''}${tx('状态方向不同，请同时核对A CREDITO/A DEBITO')}`;
  }

  return {
    a,sys,systemDebit,systemCredit,
    sysAmount:Math.abs(sys),
    comparedSystemAmount,
    diff:amountGap,absDiff,amountGap,amountDue,oursHigher,
    kind,label,direction,sameSign,pendingType,
    comparisonStart:ranged.startExclusive||'',
    comparisonEnd:ranged.endInclusive||todayISO()
  };
};

/* Management fallback after settlement = current unresolved system stage, not the locked history. */
v19ManagementResult=function(s,key=s.adjustmentKey||accountantKeyForPeriod()){
  const a=getAccountantEstimate(key);
  const ranged=v23GroupNetToCutoff(s,key,a);
  const system=num(ranged.net);
  return {
    key,
    hasAccountant:a.has,
    accountant:a,
    system,
    signed:a.has?a.signed:system,
    source:a.has?'accountant':'system'
  };
};

      </div>

      <div class="input-card"><label>${tx('会计师数据截止日期')}</label>
        <input id="accDate" type="text" value="${dateValue}" placeholder="DD/MM/YY" oninput="autoSlashDateInput(this)">
      </div>

      <div class="input-card"><label>${tx('来源')}</label><input value="${tx('会计师')}" readonly></div>

      <div class="input-card wide"><label>${tx('会计师备注')}</label>
        <textarea id="accNote" placeholder="${notePlaceholder}">${a.note||''}</textarea>
      </div>

      <div class="input-card wide accountant-form-actions">
        <button class="small-btn" onclick="saveAccountantForm('${key}')">
          <span class="material-symbols-rounded">save</span>${tx('保存会计师预估')}
        </button>

        ${a.has?`
          <button class="ghost-btn v23-settle-btn" onclick="markAccountantSettled('${key}')">
            <span class="material-symbols-rounded">task_alt</span>${tx('标记已结清')}
          </button>
          <button class="ghost-btn" onclick="clearAccountantEstimate('${key}')">
            <span class="material-symbols-rounded">delete_sweep</span>${tx('清空会计师预估')}
          </button>
        `:''}
      </div>
    </div>

    <div class="iva-config-note">
      ${tx('明确结清后才会锁定')}。${tx('被新预估替代不等于已结清')}。<br>
      ${a.has
        ? `${tx('系统比较截止日期')}: ${toSlashDate(v23ISODate(a.date)||todayISO())}`
        : tx('仅最新会计师预估参与计算')}
    </div>

    ${v23ActiveStageHTML(key)}
    ${v22HistoryHTML(key)}
    ${v23SettlementsHTML(key)}
  </div>`;
};

/* Add the exact comparison window to the comparison card and clean old "欠款" wording. */
const _v23CompareHTMLBase=accountantCompareHTML;
accountantCompareHTML=function(s,key=s.adjustmentKey||accountantKeyForPeriod(),editable=false){
  let out=_v23CompareHTMLBase(s,key,editable);
  const c=compareAccountant(s,key);

  if(currentLang==='zh') out=out.replaceAll('欠款','应缴IVA');

  const scope=`<div class="v23-active-stage">
    <b>${tx('系统比较截止日期')}</b>: ${toSlashDate(c.comparisonEnd||todayISO())}
    ${c.comparisonStart?` · ${tx('当前计算起点')}: ${toSlashDate(c.comparisonStart)} + 1`:''}
  </div>`;

  return out+scope+v23SettlementsHTML(key);
};

/* Make current cards visibly represent the unresolved stage after a settlement lock. */
const _v23SummaryCardsBase=summaryCards;
summaryCards=function(s,sub=periodName()){
  const out=_v23SummaryCardsBase(s,sub);
  const key=s.adjustmentKey||adjustmentKeyForPeriod(state.period);
  return out+v23ActiveStageHTML(key);
};

/* Force a fresh EMP/SUNSHOP bridge publish after loading this version. */
v20LastPublishedJSON='';
if(typeof appUnlocked!=='undefined'&&appUnlocked&&state.account){
  setTimeout(()=>{
    try{v20PublishOwnSharedSnapshot()}catch(e){}
    render();
  },0);
}
</script>

</body></html>
