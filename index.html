<script>
Object.assign(it,{
  '会计师核对快照':'Snapshot di verifica commercialista',
  '仅用于核对':'Solo per verifica',
  '会计师确认金额':'Importo confermato dal commercialista',
  '系统截止日金额':'Saldo sistema alla data limite',
  '核对差额':'Differenza di verifica',
  '实时系统余额':'Saldo sistema in tempo reale',
  '会计师数据不参与系统计算':'I dati del commercialista non partecipano al calcolo del sistema',
  '新增会计师金额只会建立新的核对快照':'Un nuovo importo del commercialista crea solo un nuovo snapshot di verifica',
  '同截止日比较':'Confronto alla stessa data',
  '当前联动金额':'Compensazione corrente'
});

function v52Class(kind){return kind==='debit'?'debit':kind==='credit'?'credit':'flat';}

/* Keep all historical data up to cutoff; remove only transactions after cutoff. */
function v52DataThrough(data,cutoff){
  data=data||{};
  const ch={};
  Object.entries(data.chiusure||{}).forEach(([k,x])=>{
    const d=v23ISODate((x&&x.data)||k);
    if(d&&d<=cutoff)ch[k]=x;
  });
  const ff={};
  Object.entries(data.fatture||{}).forEach(([k,x])=>{
    const d=v23ISODate(v9RawInvoiceDate(x));
    if(d&&d<=cutoff)ff[k]=x;
  });
  return {...data,chiusure:ch,fatture:ff};
}

/* System balance at the exact accountant cutoff.
   Accountant snapshot is compared to system at the SAME cutoff, never to today's system. */
function v52SystemAtCutoff(cutoff){
  cutoff=v23ISODate(cutoff);
  if(!cutoff)return {net:0,status:v28SignedStatus(0),linked:false};

  const q=quarterKey(cutoff);
  const pairData=v9LinkedDatas();

  if(pairData){
    const emp=v52DataThrough(pairData.emp,cutoff);
    const sun=v52DataThrough(pairData.sun,cutoff);
    const pair=v9LinkedQuarterPair(emp,sun,q);
    const net=pair&&pair.comp?num(pair.comp.groupNet):0;
    return {net,status:v28SignedStatus(net),linked:true,pair};
  }

  const data=v52DataThrough(state.data||{},cutoff);
  const s=v9StandaloneQuarterSummary(data,q);
  const net=num(s&&s.net);
  return {net,status:v28SignedStatus(net),linked:false,summary:s};
}

/* Accountant is now a STATIC reference snapshot.
   No sales/invoices after cutoff are added to this amount. */
v28AuthoritativePosition=function(s=calcSummary(),key=(s&&s.adjustmentKey)||accountantKeyForPeriod(state.period,todayISO())){
  const a=v30GetAuthority();
  let rawSystemNet=systemSignedNet(s);
  if(v19IsLinkedAccount()){
    const pair=linkedPairSummaries();
    if(pair)rawSystemNet=linkedCompensationFromSigned(pair.emp.net,pair.sun.net).groupNet;
  }

  if(!a.has){
    const st=v28SignedStatus(rawSystemNet);
    return {a,key,requestedKey:key,linked:v19IsLinkedAccount(),active:false,cutoff:'',start:'',baseline:rawSystemNet,delta:0,effectiveNet:rawSystemNet,rawSystemNet,details:null,...st};
  }

  const baseline=num(a.signed);
  const cutoff=v23ISODate(a.cutoff||a.date)||todayISO();
  const start=v23ISODate(a.startDate)||v29DefaultPeriodStart(a.sourceKey||key);
  const st=v28SignedStatus(baseline);

  return {
    a,key,requestedKey:key,linked:v19IsLinkedAccount(),active:true,
    cutoff,start,baseline,delta:0,effectiveNet:baseline,rawSystemNet,details:null,
    salesIva:0,purchaseIva:0,revenue:0,invoiceTotal:0,
    ...st
  };
};

v38AccountantSnapshot=function(){
  const s=calcSummary();
  const key=s.adjustmentKey||accountantKeyForPeriod(state.period,todayISO());
  const a=v30GetAuthority();
  if(!a.has)return {s,key,a,has:false,auth:null,post:{salesIva:0,purchaseIva:0,invoiceTotal:0,revenue:0}};
  const auth=v28AuthoritativePosition(s,key);
  return {s,key,a,has:true,auth,post:{salesIva:0,purchaseIva:0,invoiceTotal:0,revenue:0}};
};

function v52DiffText(accountantNet,systemNet){
  const d=num(accountantNet)-num(systemNet);
  const abs=Math.abs(d);
  if(abs<0.005)return {amount:money(0),text:tx('已平'),ok:true};

  const a=v28SignedStatus(accountantNet);
  const s=v28SignedStatus(systemNet);
  let text='';

  if(a.kind==='credit'&&s.kind==='credit'){
    text=num(accountantNet)<num(systemNet)
      ? `${currentLang==='it'?'Commercialista con più credito':'会计师比系统多 Credito'} ${money(abs)}`
      : `${currentLang==='it'?'Sistema con più credito':'系统比会计师多 Credito'} ${money(abs)}`;
  }else if(a.kind==='debit'&&s.kind==='debit'){
    text=num(accountantNet)>num(systemNet)
      ? `${currentLang==='it'?'Commercialista con più debito':'会计师比系统多应缴'} ${money(abs)}`
      : `${currentLang==='it'?'Sistema con più debito':'系统比会计师多应缴'} ${money(abs)}`;
  }else{
    text=`${signedIvaLabel(accountantNet)} ↔ ${signedIvaLabel(systemNet)}`;
  }
  return {amount:money(abs),text,ok:false};
}

function v52BasicCard(color,icon,label,value){
  return `<div class="v52-basic-card">
    <div class="v52-basic-icon ${color}"><span class="material-symbols-rounded">${icon}</span></div>
    <div style="min-width:0;flex:1"><div class="v52-basic-label">${label}</div><div class="v52-basic-value">${value}</div></div>
  </div>`;
}

function v52SystemOverviewHTML(sys){
  const s=sys.s;
  const link=v40StoreLinkSnapshot(sys);
  const net=sys.linked?num(link.ownAfter):num(sys.ownNet);
  const status=v28SignedStatus(net);
  const cls=v52Class(status.kind);

  let linkLabel=tx('当前联动金额'),linkValue=money(link.used||0),linkSub=tx('无实际联动抵扣');
  if(link.outgoing>0){
    linkLabel=tx('被另一家店拿去抵扣金额');
    linkValue=money(link.outgoing);
    linkSub=`${state.account} → ${link.otherAccount}`;
  }else if(link.incoming>0){
    linkLabel=tx('另一家店帮本店抵扣金额');
    linkValue=money(link.incoming);
    linkSub=`${link.otherAccount} → ${state.account}`;
  }

  return `<div class="v52-system-overview">
    <div class="v52-system-hero">
      <div class="v52-real-card">
        <div class="v52-real-head">
          <div class="v52-title">
            <div class="v52-icon ${cls}"><span class="material-symbols-rounded">${status.kind==='credit'?'savings':status.kind==='debit'?'payments':'task_alt'}</span></div>
            <div><div class="v52-kicker">${tx('系统完全独立')}</div><div class="v52-real-title">${tx('实时系统余额')}</div></div>
          </div>
          <span class="v52-status ${cls}">${status.label}</span>
        </div>
        <div class="v52-real-value ${cls}">${signedIvaLabel(net)}</div>
        <div class="v52-real-bottom">
          <div class="v52-mini-result"><small>${tx('本店抵扣前IVA')}</small><b>${signedIvaLabel(link.ownBefore)}</b></div>
          <div class="v52-mini-result"><small>${tx('实际联动金额')}</small><b>${money(link.used||0)}</b></div>
          <div class="v52-mini-result"><small>${tx('本店剩余金额')}</small><b>${signedIvaLabel(link.ownAfter)}</b></div>
        </div>
      </div>

      <div class="v52-link-card">
        <div class="v52-icon blue"><span class="material-symbols-rounded">sync_alt</span></div>
        <div class="v52-link-content">
          <div class="v52-link-label">${linkLabel}</div>
          <div class="v52-link-value">${linkValue}</div>
          <div class="v52-link-sub">${linkSub}</div>
        </div>
      </div>
    </div>

    <div class="v52-basic-grid">
      ${v52BasicCard('blue','point_of_sale',tx('营业额'),money(s.rangeChiusura))}
      ${v52BasicCard('purple','percent',tx('销项IVA'),money(s.salesIva))}
      ${v52BasicCard('green','receipt_long',tx('可抵扣进项IVA'),money(s.fattureIva))}
      ${v52BasicCard('teal','folder_open',tx('发票金额'),money(s.totale))}
    </div>
  </div>`;
}

function v52AccountantReconcileHTML(){
  const acc=v38AccountantSnapshot();
  if(!acc.has){
    return `<div class="v52-reconcile">
      <div class="v52-reconcile-head">
        <div class="v52-reconcile-title">
          <div class="v52-icon purple"><span class="material-symbols-rounded">verified_user</span></div>
          <div><h3>${tx('会计师核对快照')}</h3><small>${tx('仅用于核对')}</small></div>
        </div>
        <span class="v52-snapshot-chip">${tx('会计师数据不参与系统计算')}</span>
      </div>
      <div class="v52-reconcile-note"><span class="material-symbols-rounded">info</span><span>${tx('会计师未录入')}。${tx('新增会计师金额只会建立新的核对快照')}。</span></div>
    </div>`;
  }

  const a=acc.auth;
  const sysCut=v52SystemAtCutoff(a.cutoff);
  const diff=v52DiffText(a.baseline,sysCut.net);
  const start=a.start||acc.a.startDate||v29DefaultPeriodStart(acc.a.sourceKey||acc.key);
  const cutoff=a.cutoff||acc.a.cutoff||'';

  return `<div class="v52-reconcile">
    <div class="v52-reconcile-head">
      <div class="v52-reconcile-title">
        <div class="v52-icon purple"><span class="material-symbols-rounded">verified_user</span></div>
        <div>
          <h3>${tx('会计师核对快照')}</h3>
          <small>${toSlashDate(start)||'—'} → ${toSlashDate(cutoff)||'—'} · ${tx('同截止日比较')}</small>
        </div>
      </div>
      <span class="v52-snapshot-chip">${tx('仅用于核对')}</span>
    </div>

    <div class="v52-reconcile-grid">
      <div class="v52-reconcile-box">
        <div class="v52-box-head"><span class="material-symbols-rounded" style="color:#7c3aed">verified_user</span>${tx('会计师确认金额')}</div>
        <b>${signedIvaLabel(a.baseline)}</b>
        <small>${toSlashDate(cutoff)||'—'}</small>
      </div>
      <div class="v52-reconcile-box">
        <div class="v52-box-head"><span class="material-symbols-rounded" style="color:#2563eb">calculate</span>${tx('系统截止日金额')}</div>
        <b>${signedIvaLabel(sysCut.net)}</b>
        <small>${toSlashDate(cutoff)||'—'}</small>
      </div>
      <div class="v52-reconcile-box">
        <div class="v52-box-head"><span class="material-symbols-rounded" style="color:#d97706">difference</span>${tx('核对差额')}</div>
        <b class="${diff.ok?'v52-diff-ok':'v52-diff-warn'}">${diff.amount}</b>
        <small>${diff.text}</small>
      </div>
    </div>

    <div class="v52-reconcile-note">
      <span class="material-symbols-rounded">shield</span>
      <span>${tx('会计师数据不参与系统计算')}。${tx('新增会计师金额只会建立新的核对快照')}。</span>
    </div>
  </div>`;
}

/* Accountant detail = static snapshot comparison only. */
const _v52DetailBase=v34OverviewDetailData;
v34OverviewDetailData=function(type){
  if(type==='accountant_iva'){
    const acc=v38AccountantSnapshot();
    if(!acc.has)return {title:tx('会计师核对快照'),sub:state.account,body:`<div class="v34-modal-note">${tx('会计师未录入')}</div>`};

    const a=acc.auth;
    const sysCut=v52SystemAtCutoff(a.cutoff);
    const diff=v52DiffText(a.baseline,sysCut.net);
    const start=a.start||acc.a.startDate||v29DefaultPeriodStart(acc.a.sourceKey||acc.key);

    return {
      title:tx('会计师核对快照'),
      sub:`${state.account} · ${toSlashDate(a.cutoff)||'—'}`,
      body:v34DetailModalGrid([
        {label:tx('开始日期'),value:toSlashDate(start)||'—'},
        {label:tx('截止日期'),value:toSlashDate(a.cutoff)||'—'},
        {label:tx('会计师确认金额'),value:signedIvaLabel(a.baseline)},
        {label:tx('系统截止日金额'),value:signedIvaLabel(sysCut.net)},
        {label:tx('核对差额'),value:diff.amount},
        {label:tx('说明'),value:diff.text}
      ])+`<div class="v34-modal-note">${tx('会计师数据不参与系统计算')}。${tx('新增会计师金额只会建立新的核对快照')}。</div>`
    };
  }
  return _v52DetailBase(type);
};

  return `<div class="v24-dashboard v32-dashboard-wrap">
    ${tabs()}

    </section>

ivaSummaryFromParts = function(rows,f,chiusura,salesIva,key){
  const adj=getIvaAdjustment(key);
  const fattureIva=num(f.imposta);
  const baseNet=num(salesIva)-fattureIva;
  const net=baseNet-adj.creditoPrecedente+adj.rettifiche;
  const ivaDebito=Math.max(0,net);
  const ivaCredito=Math.max(0,-net);
  const rate=num(state.data.ivaConfig?.aliquota)||22;
  const needImp=ivaDebito>0 && rate ? ivaDebito/(rate/100) : 0;
  const needTot=needImp>0 ? needImp*(1+rate/100) : 0;
  return {rows,...f,rangeChiusura:num(chiusura),chiusura:num(chiusura),salesIva:num(salesIva),fattureIva,
    creditoPrecedente:adj.creditoPrecedente,rettifiche:adj.rettifiche,baseNet,net,ivaDebito,ivaCredito,
    gap:ivaDebito,needImp,needTot,rate,adjustmentKey:key,invoiceCount:(rows||[]).length};
};

<!-- V61: remove invoice modal accountant note; make dashboard info icons clickable -->
<style>
.v58-kpi-info{cursor:pointer;border:none}
.v58-kpi-info:active{transform:scale(.97)}
</style>
<script>
Object.assign(it,{
  '已抵扣IVA':'IVA già compensata',
  '状态说明':'Spiegazione stato',
  '联动后本店剩余结果':'Risultato residuo del negozio dopo compensazione',
  '本店原始IVA':'IVA originaria del negozio',
  '关联抵扣金额':'Importo compensato dal negozio collegato',
  '联动后余额':'Saldo dopo compensazione',
  '当前状态由联动后余额决定':'Lo stato attuale dipende dal saldo dopo compensazione'
});

/* 1) Remove the green accountant-related guard note from invoice modal */
const _v61OpenFatturaBase = _v30OpenFatturaBase || openFatturaModal;
openFatturaModal = function(){
  _v61OpenFatturaBase();
  const old=document.getElementById('v30InvoiceGuard');
  if(old) old.remove();
};

/* 2) Extend info modal data to support smart dashboard cards */
const _v61ShowCalcInfoBase = showCalcInfo;
showCalcInfo = function(kind){
  const sys = (typeof v38SystemSnapshot==='function') ? v38SystemSnapshot() : null;
  const s = sys && sys.s ? sys.s : calcSummary();
  const rate = num(state.data.ivaConfig?.aliquota)||22;
  const link = sys ? v40StoreLinkSnapshot(sys) : {incoming:0,ownBefore:0,ownAfter:0,used:0};
  const linkedNet = sys && sys.linked ? num(link.ownAfter) : (sys ? num(sys.ownNet) : Math.max(0,num(s.gap)));
  const remain = typeof v28SignedStatus==='function' ? v28SignedStatus(linkedNet) : {label:'',amount:0,kind:'flat'};
  const remainingDebito = remain.kind==='debit' ? num(remain.amount) : 0;
  const remainingNeedImp = remainingDebito>0 && rate ? remainingDebito/(rate/100) : 0;
  const remainingNeedTot = remainingNeedImp>0 ? remainingNeedImp*(1+rate/100) : 0;

  if(kind==='已抵扣IVA'){
    closeCalcInfo();
    const wrap=document.createElement('div');
    wrap.id='calcInfo';
    wrap.className='formula-backdrop';
    wrap.onclick=e=>{if(e.target.id==='calcInfo')closeCalcInfo()};
    wrap.innerHTML=`<div class="formula-card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <h3>${tx('已抵扣IVA')}</h3>
        <button class="icon-btn" onclick="closeCalcInfo()"><span class="material-symbols-rounded">close</span></button>
      </div>
      <div class="formula-note">${tx('联动后本店剩余结果')}</div>
      <div class="formula-table">
        <div><span>${tx('本店原始IVA')}</span><b>${signedIvaLabel(link.ownBefore)}</b></div>
        <div><span>${tx('关联抵扣金额')}</span><b>${money(link.incoming||link.used||0)}</b></div>
        <div><span>${tx('联动后余额')}</span><b>${signedIvaLabel(link.ownAfter)}</b></div>
      </div>
      <div class="formula-note">${currentLang==='it'?'Questa voce mostra quanto IVA è già stato compensato dal negozio collegato per ridurre o azzerare il debito del negozio corrente.':'这里显示关联店已经帮本店抵扣掉的 IVA 金额，以及联动后的剩余余额。'}</div>
    </div>`;
    document.body.appendChild(wrap);
    return;
  }

  if(kind==='状态'){
    closeCalcInfo();
    const wrap=document.createElement('div');
    wrap.id='calcInfo';
    wrap.className='formula-backdrop';
    wrap.onclick=e=>{if(e.target.id==='calcInfo')closeCalcInfo()};
    wrap.innerHTML=`<div class="formula-card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <h3>${tx('状态说明')}</h3>
        <button class="icon-btn" onclick="closeCalcInfo()"><span class="material-symbols-rounded">close</span></button>
      </div>
      <div class="formula-table">
        <div><span>${tx('本店原始IVA')}</span><b>${signedIvaLabel(link.ownBefore)}</b></div>
        <div><span>${tx('关联抵扣金额')}</span><b>${money(link.used||0)}</b></div>
        <div><span>${tx('联动后余额')}</span><b>${signedIvaLabel(link.ownAfter)}</b></div>
        <div><span>${tx('状态')}</span><b>${remain.label} ${remain.amount?('· '+money(remain.amount)):''}</b></div>
      </div>
      <div class="formula-note">${tx('当前状态由联动后余额决定')}。${currentLang==='it'?'Se dopo la compensazione resta un credito, lo stato è “IVA detraibile”; se resta un debito, lo stato è “IVA da pagare”; se è zero, lo stato è “pareggiato”.':'联动后如果还剩 credito，就显示可抵扣 IVA；如果还剩 debito，就显示还要付 IVA；如果为 0，则显示已平。'}</div>
    </div>`;
    document.body.appendChild(wrap);
    return;
  }

  if(kind==='要付多少IVA'){
    closeCalcInfo();
    const wrap=document.createElement('div');
    wrap.id='calcInfo';
    wrap.className='formula-backdrop';
    wrap.onclick=e=>{if(e.target.id==='calcInfo')closeCalcInfo()};
    wrap.innerHTML=`<div class="formula-card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <h3>${tx('要付多少IVA')}</h3>
        <button class="icon-btn" onclick="closeCalcInfo()"><span class="material-symbols-rounded">close</span></button>
      </div>
      <div class="formula-table">
        <div><span>${tx('营业额IVA')}</span><b>${money(s.salesIva)}</b></div>
        <div><span>－ ${tx('发票IVA')}</span><b>${money(s.fattureIva)}</b></div>
        <div><span>${tx('联动后余额')}</span><b>${signedIvaLabel(linkedNet)}</b></div>
        <div><span>= ${tx('要付多少IVA')}</span><b>${money(remainingDebito)}</b></div>
      </div>
      <div class="formula-note">${currentLang==='it'?'Questa cifra guarda prima il risultato dopo la compensazione tra negozi collegati. Solo se dopo la compensazione rimane ancora un debito, qui viene mostrato l’importo da pagare.':'这个数字优先看关联店抵扣后的结果。只有联动后仍然是应缴，才会在这里显示要付多少 IVA。'}</div>
    </div>`;
    document.body.appendChild(wrap);
    return;
  }

  if(kind==='缺多少发票'){
    closeCalcInfo();
    const wrap=document.createElement('div');
    wrap.id='calcInfo';
    wrap.className='formula-backdrop';
    wrap.onclick=e=>{if(e.target.id==='calcInfo')closeCalcInfo()};
    wrap.innerHTML=`<div class="formula-card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <h3>${tx('缺多少发票')}</h3>
        <button class="icon-btn" onclick="closeCalcInfo()"><span class="material-symbols-rounded">close</span></button>
      </div>
      <div class="formula-table">
        <div><span>${tx('联动后仍需缴纳的IVA')}</span><b>${money(remainingDebito)}</b></div>
        <div><span>÷ IVA ${rate}%</span><b>${money(remainingNeedImp)}</b></div>
        <div><span>× (1 + IVA%)</span><b>${money(remainingNeedTot)}</b></div>
        <div><span>${tx('缺多少发票')}</span><b>${money(remainingNeedTot)}</b></div>
      </div>
      <div class="formula-note">${currentLang==='it'?'Se il negozio collegato ha già compensato abbastanza IVA, questo valore diventa 0. In caso contrario mostra il totale fattura IVA inclusa ancora necessario per azzerare il debito residuo.':'如果关联店已经抵扣够了，这里就是 0；如果还不够，这里显示还需要补多少“含税发票总金额”才能把剩余应缴 IVA 抵掉。'}</div>
    </div>`;
    document.body.appendChild(wrap);
    return;
  }

  if(kind==='缺多少未税金额'){
    closeCalcInfo();
    const wrap=document.createElement('div');
    wrap.id='calcInfo';
    wrap.className='formula-backdrop';
    wrap.onclick=e=>{if(e.target.id==='calcInfo')closeCalcInfo()};
    wrap.innerHTML=`<div class="formula-card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <h3>${tx('缺多少未税金额')}</h3>
        <button class="icon-btn" onclick="closeCalcInfo()"><span class="material-symbols-rounded">close</span></button>
      </div>
      <div class="formula-table">
        <div><span>${tx('联动后仍需缴纳的IVA')}</span><b>${money(remainingDebito)}</b></div>
        <div><span>÷ IVA ${rate}%</span><b>${money(remainingNeedImp)}</b></div>
        <div><span>${tx('缺多少未税金额')}</span><b>${money(remainingNeedImp)}</b></div>
      </div>
      <div class="formula-note">${currentLang==='it'?'Questo valore mostra l’imponibile ancora necessario per generare abbastanza IVA detraibile da coprire il debito residuo dopo la compensazione.':'这个值显示联动抵扣后，如果还剩应缴 IVA，大约还需要多少未税金额的进项发票才能继续抵掉。'}</div>
    </div>`;
    document.body.appendChild(wrap);
    return;
  }

  _v61ShowCalcInfoBase(kind);
};

/* 3) Make every top-right info icon on overview cards open a detail modal */
v58OverviewCardsHTML = function(s, sys=v38SystemSnapshot()){
  const link=v40StoreLinkSnapshot(sys);
  const linkedNet = sys.linked ? num(link.ownAfter) : num(sys.ownNet);
  const remain = v28SignedStatus(linkedNet);
  const rate = num(s.rate)||22;
  const remainingDebito = remain.kind==='debit' ? num(remain.amount) : 0;
  const remainingNeedImp = remainingDebito>0 && rate ? remainingDebito/(rate/100) : 0;
  const remainingNeedTot = remainingNeedImp>0 ? remainingNeedImp*(1+rate/100) : 0;

  const status = remain.kind==='debit'
    ? {kind:'debit',label:tx('还要付IVA'),amount:money(remainingDebito)}
    : remain.kind==='credit'
      ? {kind:'credit',label:tx('可抵扣IVA'),amount:money(remain.amount)}
      : {kind:'flat',label:tx('已平'),amount:money(0)};

  const infoBtn=(kind)=>`<button class="v58-kpi-info" type="button" onclick="showCalcInfo('${kind}')"><span class="material-symbols-rounded">info</span></button>`;
  const card=(iconColor,icon,title,value,sub,infoKind)=>`<div class="v58-kpi-card">
    <div class="v58-kpi-icon ${iconColor}"><span class="material-symbols-rounded">${icon}</span></div>
    <div class="v58-kpi-body">
      <div class="v58-kpi-head"><div class="v58-kpi-title">${title}</div>${infoBtn(infoKind||title)}</div>
      <div class="v58-kpi-value">${value}</div>
      <div class="v58-kpi-sub">${sub||''}</div>
    </div>
  </div>`;

  const offsetOrPayCard = link.incoming>0
    ? card('green','sync_alt',tx('已抵扣IVA'),money(link.incoming),tx('关联店已帮本店抵扣的IVA'),'已抵扣IVA')
    : card('orange','payments',tx('要付多少IVA'),money(remainingDebito),tx('联动后仍需缴纳的IVA'),'要付多少IVA');

  const missingInvoiceSub = remainingDebito>0 ? tx('按联动后剩余应缴估算') : tx('联动后已无需补票');
  const missingUntaxedSub = remainingDebito>0 ? tx('按联动后剩余应缴估算') : tx('联动后已无需补票');

  const statusCard=`<div class="v58-kpi-card">
    <div class="v58-kpi-icon orange"><span class="material-symbols-rounded">task_alt</span></div>
    <div class="v58-kpi-body v58-kpi-status">
      <div class="v58-kpi-head"><div class="v58-kpi-title">${tx('状态')}</div>${infoBtn('状态')}</div>
      <div class="v58-status-big ${status.kind}">${status.label}</div>
      <div class="v58-status-small">${status.amount}</div>
    </div>
  </div>`;

  return `<div class="v58-kpi-wrap">
    ${card('blue','point_of_sale',tx('营业额'),money(s.rangeChiusura),tx('本季度'),'营业额')}
    ${card('purple','percent',tx('营业额IVA'),money(s.salesIva),tx('营业额产生的IVA'),'营业额IVA')}
    ${card('green','receipt_long',tx('发票IVA'),money(s.fattureIva),tx('已录入发票的IVA'),'发票IVA')}
    ${offsetOrPayCard}
    ${card('orange','request_quote',tx('缺多少发票'),money(remainingNeedTot),missingInvoiceSub,'缺多少发票')}
    ${card('blue','calculate',tx('缺多少未税金额'),money(remainingNeedImp),missingUntaxedSub,'缺多少未税金额')}
    ${card('teal','folder_open',tx('发票金额'),money(s.totale),tx('当前已录入发票总金额'),'发票金额')}
    ${statusCard}
  </div>`;
};

if(typeof appUnlocked!=='undefined'&&appUnlocked&&state.account){ setTimeout(render,0); }
</script>
