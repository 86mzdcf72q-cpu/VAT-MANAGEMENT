/* Extra compact invoice modal */
.modal-advanced{display:none;grid-column:1/-1;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.modal-advanced.open{display:grid}
.modal-toggle{grid-column:1/-1;border:1px solid var(--line);background:transparent;color:var(--muted);height:30px;border-radius:10px;font-weight:900;font-size:12px;cursor:pointer}
@media(max-width:900px){
  .modal-backdrop{align-items:center;padding:6px}
  .modal-card{max-height:94dvh;overflow:hidden;padding:10px;border-radius:18px}

  .modal-head h3{font-size:16px}
  .modal-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .modal-field label{font-size:9px;margin-bottom:2px}

.trend-chart{
  position:relative;
  height:180px;
  border-radius:18px;
  overflow:hidden;
  background:
    linear-gradient(180deg,rgba(37,99,235,.12),rgba(37,99,235,.02)),
    repeating-linear-gradient(0deg,transparent 0 42px,var(--line) 43px);
}
.trend-chart svg{position:absolute;inset:0;width:100%;height:100%}
.trend-empty{
  height:180px;
  display:grid;
  place-items:center;
  color:var(--muted);
  font-weight:900;
  border-radius:18px;
  background:var(--bg);
}
.trend-label{
  position:absolute;
  right:10px;
  top:8px;
  z-index:2;
  font-size:11px;
  color:var(--muted);
  font-weight:900;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:999px;
  padding:4px 8px;
}
@media(max-width:900px){
  .trend-chart,.trend-empty{height:150px!important}
}
@media(max-width:430px){
  .trend-chart,.trend-empty{height:140px!important}
}


.iva-donut-wrap{display:grid;place-items:center;gap:10px}
.iva-legend{width:100%;display:grid;gap:7px;font-size:12px;font-weight:800;color:var(--muted)}
.iva-legend div{display:flex;justify-content:space-between;gap:10px}
.iva-dot{width:10px;height:10px;border-radius:999px;display:inline-block;margin-right:6px}


/* Formula info tips */
.info-btn{
  border:0;
  background:rgba(37,99,235,.10);
  color:#2563eb;
  width:22px;
  height:22px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
  cursor:pointer;
  display:inline-grid;
  place-items:center;
  margin-left:6px;
  vertical-align:middle;
}
[data-theme="dark"] .info-btn{background:rgba(96,165,250,.18);color:#93c5fd}
.formula-backdrop{
  position:fixed;
  inset:0;
  z-index:120;
  background:rgba(15,23,42,.48);
  backdrop-filter:blur(8px);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding:16px;
}
.formula-card{
  width:min(520px,100%);
  background:var(--card);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:0 28px 70px rgba(15,23,42,.35);
  padding:18px;
}
.formula-card h3{margin:0 0 12px;font-size:18px}
.formula-line{
  display:flex;
  justify-content:space-between;
  gap:14px;
  padding:9px 0;
  border-bottom:1px solid var(--line);
  font-weight:800;
}
.formula-line span{color:var(--muted)}
.formula-result{
  margin-top:12px;
  padding:12px;
  border-radius:16px;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:#fff;
  display:flex;
  justify-content:space-between;
  font-weight:900;
}
.formula-note{
  margin-top:10px;
  font-size:12px;
  color:var(--muted);
  line-height:1.45;
  font-weight:700;
}
@media(max-width:700px){
  .formula-backdrop{padding:0;align-items:flex-end}
  .formula-card{border-radius:24px 24px 0 0;padding:16px}
  .formula-line{font-size:13px;padding:8px 0}
  .info-btn{width:20px;height:20px;font-size:11px}
}

async function login(){
  const acc=$('loginAccount').value;
  const password=$('loginPassword').value;
  const email=ACCOUNT_EMAILS[acc];
  const errorBox=$('loginError');
  errorBox.textContent='';
  if(!password){
    errorBox.textContent=currentLang==='it'?'Inserisci la password':'请输入密码';
    return;
  }
  try{
    const credential=await auth.signInWithEmailAndPassword(email,password);
    const signedEmail=(credential.user&&credential.user.email||'').toLowerCase();
    if(signedEmail!==email.toLowerCase()){
      await auth.signOut();
      throw new Error('ACCOUNT_MISMATCH');
    }
    state.account=acc;
    appUnlocked=true;
    rememberSession(acc);
    $('loginPassword').value='';
    $('loginPage').classList.add('hidden');
    $('appPage').classList.remove('hidden');
    initApp();
  }catch(error){
    console.error('Firebase login failed:',error);
    errorBox.textContent=authErrorMessage(error);
  }

function invoiceDate(r){return normalizeDateValue((r&&r.emissione)||((r&&r.data)||''))}

function normalizeFatturaAmounts(r){

function fattureList(){return Object.entries(state.data.fatture||{}).map(([id,x])=>normalizeFatturaAmounts({id,...x})).sort((a,b)=>(invoiceDate(b)||b.data||'').localeCompare(invoiceDate(a)||a.data||''))}function inPeriod(date,p=state.period){if(!date)return false;if(p==='day')return date===todayISO();if(p==='month')return monthKey(date)===monthKey();if(p==='quarter'){const a=new Date(date),b=new Date();return a.getFullYear()===b.getFullYear()&&Math.floor(a.getMonth()/3)===Math.floor(b.getMonth()/3)}if(p==='year')return new Date(date).getFullYear()===new Date().getFullYear();return true}function periodName(p=state.period){return tx(p==='quarter'?'本季度':p==='month'?'本月':p==='day'?'本日':p==='year'?'本年':'全部')}function filteredFatture(p='month'){return fattureList().filter(x=>p==='all'||inPeriod(invoiceDate(x),p))}function totalChiusure(p='month'){return Object.values(state.data.chiusure||{}).filter(x=>p==='all'||inPeriod(x.data,p)).reduce((s,x)=>s+num(x.totale),0)}function totalSalesIva(p='month'){return Object.values(state.data.chiusure||{}).filter(x=>p==='all'||inPeriod(x.data,p)).reduce((s,x)=>s+num(x.ivaVendite),0)}function fattureSummary(rows){return rows.reduce((a,x)=>{a.count++;a.imponibile+=num(x.imponibile);a.imposta+=num(x.imposta);a.totale+=num(x.totale);return a},{count:0,imponibile:0,imposta:0,totale:0})}function calcSummary(p=state.period){const rows=filteredFatture(p),f=fattureSummary(rows),salesIva=totalSalesIva(p),due=Math.max(0,salesIva-f.imposta),rate=num(state.data.ivaConfig?.aliquota)||22,needImp=rate?due/(rate/100):0;return{rows,...f,rangeChiusura:totalChiusure(p),salesIva,fattureIva:f.imposta,gap:due,needImp,needTot:needImp*(1+rate/100),rate,totalAll:totalChiusure('all')}}function chiusuraByDate(d=state.fatturaDate||todayISO()){return(state.data.chiusure||{})[d]||{data:d,values:[],ivaValues:[],totale:0,ivaVendite:0}}function fattureByDate(d=state.fatturaDate||todayISO()){return fattureList().filter(x=>invoiceDate(x)===d)}function dateInput(id,val,on function trendData(period=state.period){
  const ch=Object.values(state.data.chiusure||{})
    .filter(x=>x&&x.data&&inPeriod(x.data,period))
    .sort((a,b)=>(a.data||'').localeCompare(b.data||''));
  return ch.map(x=>({date:x.data,total:num(x.totale)}));
}
function trendChartHTML(period=state.period){
  const data=trendData(period);
  if(!data.length)return `<div class="trend-empty">${tx('暂无数据')}</div>`;
  const w=700,h=180,pad=26;
  const max=Math.max(...data.map(x=>x.total),1);
  const min=Math.min(...data.map(x=>x.total),0);
  const range=Math.max(max-min,1);
  const pts=data.map((d,i)=>{
    const x=data.length===1?w/2:pad+i*(w-2*pad)/(data.length-1);
    const y=h-pad-((d.total-min)/range)*(h-2*pad);
    return {x,y,...d};
  });
  const line=pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const area=`${line} ${pts[pts.length-1].x.toFixed(1)},${h-pad} ${pts[0].x.toFixed(1)},${h-pad}`;
  const dots=pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.2" fill="#2563eb" stroke="#fff" stroke-width="2"><title>${p.date} · ${money(p.total)}</title></circle>`).join('');
  const first=data[0].date.slice(5),last=data[data.length-1].date.slice(5);
  return `<div class="trend-chart"><span class="trend-label">${first}${first!==last?' → '+last:''}</span><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2563eb" stop-opacity=".26"/><stop offset="100%" stop-color="#2563eb" stop-opacity="0"/></linearGradient></defs>
    <polygon points="${area}" fill="url(#trendFill)"></polygon>
    <polyline points="${line}" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></polyline>
    ${dots}
  </svg></div>`;
}


function ivaPieHTML(s){
  const sales=num(s.salesIva),fatt=num(s.fattureIva),due=num(s.gap);
  const total=Math.max(sales, fatt+due, 1);
  const fattPct=Math.min(100, Math.max(0, fatt/total*100));
  const duePct=Math.min(100, Math.max(0, due/total*100));
  const bg=sales<=0&&fatt<=0&&due<=0
    ? 'conic-gradient(#e5e7eb 0 100%)'
    : `conic-gradient(#16a34a 0 ${fattPct}%, #f97316 ${fattPct}% ${Math.min(100,fattPct+duePct)}%, #e5e7eb ${Math.min(100,fattPct+duePct)}% 100%)`;
  return `<div class="iva-donut-wrap">
    <div class="donut" style="background:${bg}" data-label="${money(due)}"></div>
    <div class="iva-legend">

<script>
/* ---- Upgraded IVA calculation model ----
   Final net IVA = IVA vendite - IVA acquisti detraibile - credito precedente + rettifiche.
   rettifiche > 0 increases IVA a debito; rettifiche < 0 increases IVA a credito.
   Credits/adjustments are stored per selected period, so switching month/quarter does not reuse the same carry-forward value. */
Object.assign(it,{
  '销项IVA':'IVA a debito sulle vendite',
  '可抵扣进项IVA':'IVA acquisti detraibile',
  '上期结转Credito':'Credito IVA precedente',
  '调整项':'Rettifiche IVA',
  'IVA a debito':'IVA a debito',
  'IVA a credito':'IVA a credito',
  '最终IVA状态':'Posizione IVA finale',
  '无需缴纳IVA':'Nessuna IVA da versare',
  '需要缴纳IVA':'IVA da versare',
  '有可抵扣余额':'Credito IVA disponibile',
  '系统计算':'Calcolo sistema',
  '正数增加应付，负数增加抵扣':'Positivo aumenta il debito; negativo aumenta il credito',
  '仅填写已确认的上期或其他可结转Credito':'Inserire solo crediti precedenti/riportabili già verificati',
  '发票金额':'Totale fatture',
  '计算':'Calcolo',
  '说明':'Nota',
  '净额':'Saldo netto',
  '当前期间键':'Chiave periodo',
  '发票数量':'N. fatture',
  '采购/费用含税金额':'Totale fatture acquisti/costi',
  'IVA计算设置':'Impostazioni calcolo IVA',
  '最终公式':'Formula finale',
  '调整项说明':'Nota rettifiche',
  '状态':'Stato',
  '本期基础净额':'Saldo base del periodo'
});

function adjustmentKeyForPeriod(p=state.period,ref=todayISO()){
  if(p==='day')return 'day_'+ref;
  if(p==='month')return 'month_'+monthKey(ref);
  if(p==='quarter')return 'quarter_'+quarterKey(ref);
  if(p==='year')return 'year_'+String(ref).slice(0,4);
  return 'all';
}
function adjustmentKeyForMonth(m){return 'month_'+m}
function adjustmentKeyForQuarter(q){return 'quarter_'+q}
function getIvaAdjustment(key=adjustmentKeyForPeriod()){
  const r=(state.data.ivaAdjustments||{})[key]||{};
  return {creditoPrecedente:num(r.creditoPrecedente),rettifiche:num(r.rettifiche),raw:r};
}
function saveIvaAdjustmentField(field,value,key=adjustmentKeyForPeriod()){
  state.data.ivaAdjustments=state.data.ivaAdjustments||{};
  const r={...(state.data.ivaAdjustments[key]||{})};
  r[field]=String(value??'');
  state.data.ivaAdjustments[key]=r;
  return save('ivaAdjustments/'+key,r).then(()=>setTimeout(render,80));
}
function saveIvaRate(value){
  state.data.ivaConfig={...(state.data.ivaConfig||{}),aliquota:String(value??'')};
  return save('ivaConfig',state.data.ivaConfig);
}
function ivaSummaryFromParts(rows,f,chiusura,salesIva,key){
  const adj=getIvaAdjustment(key);
  const fattureIva=num(f.imposta);
  const baseNet=num(salesIva)-fattureIva;
  const net=baseNet-adj.creditoPrecedente+adj.rettifiche;
  const ivaDebito=Math.max(0,net);
  const ivaCredito=Math.max(0,-net);
  const rate=num(state.data.ivaConfig?.aliquota)||22;
  return {rows,...f,rangeChiusura:num(chiusura),chiusura:num(chiusura),salesIva:num(salesIva),fattureIva,
    creditoPrecedente:adj.creditoPrecedente,rettifiche:adj.rettifiche,baseNet,net,ivaDebito,ivaCredito,
    gap:ivaDebito,needImp:0,needTot:0,rate,adjustmentKey:key,invoiceCount:(rows||[]).length};
}
function calcSummary(p=state.period){
  const rows=filteredFatture(p),f=fattureSummary(rows),salesIva=totalSalesIva(p),key=adjustmentKeyForPeriod(p);
  const s=ivaSummaryFromParts(rows,f,totalChiusure(p),salesIva,key);
  s.totalAll=totalChiusure('all');
  return s;
}
function rangeSummary(pred,key='all'){
  const ch=Object.values(state.data.chiusure||{}).filter(x=>pred(x.data));
  const rows=fattureList().filter(x=>pred(invoiceDate(x)));
  const f=fattureSummary(rows),salesIva=ch.reduce((a,x)=>a+num(x.ivaVendite),0),chiusura=ch.reduce((a,x)=>a+num(x.totale),0);
  return ivaSummaryFromParts(rows,f,chiusura,salesIva,key);
}
function monthSummary(m){return rangeSummary(monthPred(m),adjustmentKeyForMonth(m))}
function quarterSummary(q){return rangeSummary(quarterPred(q),adjustmentKeyForQuarter(q))}
function ivaPositionLabel(s){
  if(num(s.ivaDebito)>0)return currentLang==='it'?'A DEBITO':'A DEBITO · 需缴纳';
  if(num(s.ivaCredito)>0)return currentLang==='it'?'A CREDITO':'A CREDITO · 可抵扣';
  return currentLang==='it'?'IN PAREGGIO':'IVA 已平';
}
function ivaPositionClass(s){return num(s.ivaDebito)>0?'debit':num(s.ivaCredito)>0?'credit':'zero'}
function ivaStatusBanner(s){
  const cls=ivaPositionClass(s),amt=num(s.ivaDebito)>0?s.ivaDebito:s.ivaCredito;
  const icon=cls==='debit'?'payments':cls==='credit'?'savings':'task_alt';
  const formula=`${money(s.salesIva)} − ${money(s.fattureIva)} − ${money(s.creditoPrecedente)} + ${money(s.rettifiche)} = ${money(s.net)}`;
  return `<div class="iva-status-banner ${cls}"><div class="iva-status-main"><span class="material-symbols-rounded">${icon}</span><span>${tx('最终IVA状态')}: ${ivaPositionLabel(s)} · ${money(amt)}</span></div><div class="iva-status-formula">${tx('最终公式')}<br>${formula}</div></div>`;
}

function metric(c,ic,a,b,d=''){
  const canInfo=['营业额','销项IVA','可抵扣进项IVA','上期结转Credito','调整项','IVA a debito','IVA a credito','发票金额'].includes(a);
  return`<div class="card metric"><div class="metric-icon ${c}"><span class="material-symbols-rounded">${ic}</span></div><div><small>${tx(a)}${canInfo?`<button class="info-btn" onclick="showCalcInfo('${a}')" type="button">i</button>`:''}</small><b>${b}</b><small>${d}</small></div></div>`;
}
function summaryCards(s,sub=periodName()){

function ivaPieHTML(s){

  const total=sales+fatt+prev+adj;

.compare-pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 8px;font-size:9px;font-weight:900;margin-top:6px}.compare-pill.ok{background:rgba(22,163,74,.12);color:#15803d}.compare-pill.diff{background:rgba(245,158,11,.14);color:#b45309}.compare-pill.opposite{background:rgba(220,38,38,.12);color:#b91c1c}.compare-pill.none{background:rgba(107,114,128,.12);color:var(--muted)}

<script>
/* Accountant / commercialista estimate is intentionally kept separate from system IVA.
   It is a manual external estimate used only for reconciliation and does NOT overwrite the app's calculation. */
Object.assign(it,{
  '会计师预估':'Stima commercialista',
  '会计师部分':'Commercialista',
  '系统预估':'Stima sistema',
  '会计师状态':'Posizione commercialista',
  '会计师金额':'Importo commercialista',
  '会计师更新日期':'Data aggiornamento',
  '会计师备注':'Nota commercialista',
  '系统与会计师对比':'Confronto sistema / commercialista',
  '差额':'Scostamento',
  '待核对差额':'Scostamento da verificare',
  '自动对比':'Confronto automatico',
  '编辑会计师预估':'Modifica stima',
  '保存会计师预估':'Salva stima',
  '清空会计师预估':'Azzera stima',
  '尚未输入会计师预估':'Stima del commercialista non ancora inserita',
  '一致':'Allineato',
  '有差额':'Da verificare',
  '方向不同':'Segno opposto',
  '系统较高':'Sistema più alto',
  '会计师较高':'Commercialista più alto',
  '本项仅用于对比，不会覆盖系统IVA计算':'Questa stima serve solo al confronto e non modifica il calcolo IVA del sistema',
  '输入会计师给出的最终IVA状态和金额':'Inserire la posizione IVA finale e l’importo comunicati dal commercialista',
  '最后更新':'Ultimo aggiornamento',
  '来源':'Fonte',
  '会计师':'Commercialista',
  '未填写':'Non inserito',
  '系统净额':'Saldo netto sistema',
  '会计师净额':'Saldo netto commercialista',
  '差额说明':'Nota scostamento'
});

function accountantKeyForPeriod(p=state.period,ref=todayISO()){
  return adjustmentKeyForPeriod(p,ref);
}
function accountantKeyForMonth(m){return adjustmentKeyForMonth(m)}
function accountantKeyForQuarter(q){return adjustmentKeyForQuarter(q)}
function getAccountantEstimate(key=accountantKeyForPeriod()){
  const r=(state.data.accountantEstimates||{})[key]||{};
  const has=String(r.status||'').trim()!=='' || String(r.amount||'').trim()!=='';
  const amount=Math.max(0,num(r.amount));
  let signed=0;
  if(r.status==='debit')signed=amount;
  else if(r.status==='credit')signed=-amount;
  return {key,has,status:r.status||'',amount,signed,date:r.date||'',note:r.note||'',raw:r};
}
function saveAccountantEstimate(key,status,amount,date,note){
  const record={status:String(status||''),amount:String(amount??''),date:String(date||''),note:String(note||''),updatedAt:new Date().toISOString()};
  state.data.accountantEstimates=state.data.accountantEstimates||{};
  state.data.accountantEstimates[key]=record;
  return save('accountantEstimates/'+key,record).then(()=>setTimeout(render,80));
}
function clearAccountantEstimate(key){
  if(!confirm(currentLang==='it'?'Azzerare la stima del commercialista per questo periodo?':'确定清空当前期间的会计师预估吗？'))return;
  if(state.data.accountantEstimates)delete state.data.accountantEstimates[key];
  return db.ref('vatManagement/'+state.account+'/accountantEstimates/'+key).remove().then(()=>setTimeout(render,80));
}
function accountantStatusLabel(status){
  if(status==='debit')return 'A DEBITO';
  if(status==='credit')return 'A CREDITO';
  if(status==='zero')return currentLang==='it'?'IN PAREGGIO':'IVA 已平';
  return tx('未填写');
}
function systemSignedNet(s){return num(s.net)}
function compareAccountant(s,key=s.adjustmentKey||accountantKeyForPeriod()){
  const a=getAccountantEstimate(key),sys=systemSignedNet(s);
  if(!a.has)return {a,sys,diff:null,absDiff:null,kind:'none',label:tx('尚未输入会计师预估'),direction:''};
  const diff=sys-a.signed; // positive = system is more debit / less credit; negative = accountant is more debit / less credit
  const absDiff=Math.abs(diff);
  const sameSign=(Math.sign(sys)===Math.sign(a.signed)) || (Math.abs(sys)<0.005&&Math.abs(a.signed)<0.005);
  let kind='diff',label=tx('有差额');
  if(absDiff<0.01){kind='ok';label=tx('一致')}
  else if(!sameSign && Math.abs(sys)>=0.01 && Math.abs(a.signed)>=0.01){kind='opposite';label=tx('方向不同')}
  let direction='';
  if(absDiff>=0.01){
    if(diff>0)direction=currentLang==='it'?'Il sistema risulta più a debito / meno a credito rispetto al commercialista':'系统结果比会计师更偏向应付（或抵扣更少）';
    else direction=currentLang==='it'?'Il commercialista risulta più a debito / meno a credito rispetto al sistema':'会计师结果比系统更偏向应付（或抵扣更少）';
  }
  return {a,sys,diff,absDiff,kind,label,direction};
}
function signedIvaLabel(v){
  v=num(v);
  if(v>0)return `A DEBITO · ${money(v)}`;
  if(v<0)return `A CREDITO · ${money(Math.abs(v))}`;
  return `${currentLang==='it'?'IN PAREGGIO':'IVA 已平'} · ${money(0)}`;
}
function accountantCompareHTML(s,key=s.adjustmentKey||accountantKeyForPeriod(),editable=false){
  const c=compareAccountant(s,key),a=c.a;
  const statusClass=c.kind==='ok'?'match':c.kind==='none'?'system':'warn';
  const updated=a.date?toSlashDate(a.date):(a.raw.updatedAt?new Date(a.raw.updatedAt).toLocaleDateString('it-IT'):'');
  return `<div class="card accountant-panel">
    <div class="accountant-head">
      <div class="accountant-title"><div class="badge-icon"><span class="material-symbols-rounded">account_balance</span></div><div><h3>${tx('系统与会计师对比')}</h3><small>${periodName()} · ${key}</small></div></div>
      ${!editable?`<button class="ghost-btn" onclick="state.page='IVA';renderNav();render()"><span class="material-symbols-rounded">edit</span>${tx('编辑会计师预估')}</button>`:''}
    </div>
    <div class="accountant-grid">
      <div class="accountant-box system"><small>${tx('系统预估')}</small><b>${signedIvaLabel(c.sys)}</b><span class="mini">${tx('系统净额')}: ${money(c.sys)}</span></div>
      <div class="accountant-box external"><small>${tx('会计师预估')}</small><b>${a.has?`${accountantStatusLabel(a.status)} · ${money(a.amount)}`:tx('未填写')}</b><span class="mini">${a.has?(updated?`${tx('最后更新')}: ${updated}`:tx('会计师')):tx('输入会计师给出的最终IVA状态和金额')}</span></div>
      <div class="accountant-box ${statusClass}"><small>${tx('差额')}</small><b>${c.absDiff===null?'—':money(c.absDiff)}</b><span class="compare-pill ${c.kind}">${c.label}</span></div>
      <div class="accountant-box ${statusClass}"><small>${tx('待核对差额')}</small><b>${c.diff===null?'—':money(Math.abs(c.diff))}</b><span class="mini">${c.direction||tx('本项仅用于对比，不会覆盖系统IVA计算')}</span></div>
    </div>
    ${a.has&&a.note?`<div class="accountant-reconcile"><strong>${tx('会计师备注')}</strong><span>${String(a.note).replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span></div>`:''}
    ${!a.has?`<div class="accountant-empty" style="margin-top:10px">${tx('尚未输入会计师预估')}。${tx('本项仅用于对比，不会覆盖系统IVA计算')}。</div>`:''}
  </div>`;
}
function accountantFormHTML(s,key=s.adjustmentKey||accountantKeyForPeriod()){
  const a=getAccountantEstimate(key),dateValue=a.date?toSlashDate(a.date):toSlashDate(todayISO());
  return `<div class="card" style="margin-top:16px"><div class="toolbar"><div><h3>${tx('会计师部分')}</h3><small style="color:var(--muted);font-weight:800">${tx('输入会计师给出的最终IVA状态和金额')} · ${key}</small></div></div>
    <div class="accountant-form">
      <div class="input-card"><label>${tx('会计师状态')}</label><select id="accStatus"><option value="credit" ${a.status==='credit'?'selected':''}>A CREDITO</option><option value="debit" ${a.status==='debit'?'selected':''}>A DEBITO</option><option value="zero" ${a.status==='zero'?'selected':''}>${currentLang==='it'?'IN PAREGGIO':'IVA 已平'}</option></select></div>
      <div class="input-card"><label>${tx('会计师金额')}</label><input id="accAmount" type="text" inputmode="decimal" pattern="[0-9.,，]*" value="${a.raw.amount??''}" placeholder="0,00"></div>
      <div class="input-card"><label>${tx('会计师更新日期')}</label><input id="accDate" type="text" value="${dateValue}" placeholder="DD/MM/YY" oninput="autoSlashDateInput(this)"></div>
      <div class="input-card"><label>${tx('来源')}</label><input value="${tx('会计师')}" readonly></div>
      <div class="input-card wide"><label>${tx('会计师备注')}</label><textarea id="accNote" placeholder="${currentLang==='it'?'Es. a credito sui 6.400 €; dati aggiornati al 14/09':'例如：a credito 约 €6,400；数据截至 14/09'}">${a.note||''}</textarea></div>
      <div class="input-card wide accountant-form-actions"><button class="small-btn" onclick="saveAccountantForm('${key}')"><span class="material-symbols-rounded">save</span>${tx('保存会计师预估')}</button>${a.has?`<button class="ghost-btn" onclick="clearAccountantEstimate('${key}')"><span class="material-symbols-rounded">delete_sweep</span>${tx('清空会计师预估')}</button>`:''}</div>
    </div>
    <div class="iva-config-note">${tx('本项仅用于对比，不会覆盖系统IVA计算')}。${currentLang==='it'?'Lo scostamento viene ricalcolato automaticamente ogni volta che cambiano chiusure, fatture, crediti o rettifiche.':'营业额、发票、Credito 或调整项发生变化时，系统会自动重新计算与会计师预估之间的差额。'}</div>
  </div>`;
}
function saveAccountantForm(key){
  const status=$('accStatus')?.value||'credit';
  const amount=$('accAmount')?.value||'0';
  const date=normalizeDateValue($('accDate')?.value||todayISO());
  const note=$('accNote')?.value||'';
  return saveAccountantEstimate(key,status,amount,date,note);
}

/* Override dashboard and IVA page so the reconciliation is visible in the main view and editable in IVA. */
function dashboardHTML(){
  const s=calcSummary();
  return `<div class="dash-mobile">${tabs()}${summaryCards(s)}${accountantCompareHTML(s,s.adjustmentKey,false)}<div class="grid content-grid" style="margin-top:16px"><div class="card"><h3>${tx('营业额走势')}</h3>${trendChartHTML(state.period)}</div><div class="card"><h3>IVA</h3>${ivaPieHTML(s)}</div></div><div class="card dashboard-details" style="margin-top:16px"><div class="toolbar"><h3>${tx('发票明细')}</h3><button class="ghost-btn" onclick="state.page='Fatture';renderNav();render()">${tx('查看全部')}</button></div><div style="color:var(--muted);font-size:12px;font-weight:800;margin-bottom:8px">${tx('未税金额')} / ${tx('税额')} / ${tx('总金额')} ${currentLang==='it'?'aggiornati automaticamente':'会自动联动'}</div>${miniTable(s.rows.slice(0,8))}</div></div>`;
}
function ivaHTML(){
  const s=calcSummary(),adj=getIvaAdjustment(s.adjustmentKey);
  return `${tabs()}<div class="card"><h3>${tx('IVA计算设置')}</h3><div class="form-grid">
    <div class="input-card"><label>${tx('税率')}</label><input type="text" inputmode="decimal" pattern="[0-9.,，]*" value="${state.data.ivaConfig?.aliquota||22}" onchange="saveIvaRate(this.value)"></div>
    <div class="input-card"><label>${tx('上期结转Credito')}</label><input type="text" inputmode="decimal" pattern="[0-9.,，-]*" value="${adj.raw.creditoPrecedente??''}" onchange="saveIvaAdjustmentField('creditoPrecedente',this.value,'${s.adjustmentKey}')"><span class="iva-mini-label">${tx('仅填写已确认的上期或其他可结转Credito')}</span></div>
    <div class="input-card"><label>${tx('调整项')}</label><input type="text" inputmode="decimal" pattern="[0-9.,，-]*" value="${adj.raw.rettifiche??''}" onchange="saveIvaAdjustmentField('rettifiche',this.value,'${s.adjustmentKey}')"><span class="iva-mini-label">${tx('正数增加应付，负数增加抵扣')}</span></div>
    <div class="input-card"><label>${tx('当前范围')}</label><input value="${periodName()}" readonly></div>
    <div class="input-card"><label>${tx('当前期间键')}</label><input value="${s.adjustmentKey}" readonly></div>
    <div class="input-card"><label>${tx('最终公式')}</label><input value="Vendite − Acquisti − Credito + Rettifiche" readonly></div>
  </div><div class="iva-config-note">${currentLang==='it'?'Il “Credito IVA precedente” non è il saldo finale comunicato dal commercialista: inseriscilo solo se rappresenta davvero un credito riportato/ulteriore già verificato.':'“上期结转Credito”不是会计告诉你的最终余额；只有确认它确实是以前结转/其他可抵扣的 IVA 时才填写。'}</div></div>${summaryCards(s)}${accountantCompareHTML(s,s.adjustmentKey,true)}${accountantFormHTML(s,s.adjustmentKey)}<div class="card" style="margin-top:16px"><h3>${tx('当前范围发票')}</h3>${miniTable(s.rows)}</div>`;
}

/* Include accountant comparison in reports without changing the tax calculation itself. */
function reportHTML(){
  const months=uniqueMonths(),quarters=uniqueQuarters();
  return `<div class="card"><h3>${tx('报表')}</h3><div class="iva-config-note">${currentLang==='it'?'Lo scostamento confronta il saldo netto calcolato dal sistema con l’ultima stima manuale del commercialista per lo stesso periodo.':'差额会把系统净额与同一期间最后一次手动录入的会计师预估进行比较。'}</div></div><div class="card" style="margin-top:16px"><h3>${tx('月记录')}</h3><div class="table-wrap"><table class="table"><thead><tr>${['月份','营业额','IVA a debito','IVA a credito','系统预估','会计师预估','差额','状态',''].map(x=>`<th>${tx(x)}</th>`).join('')}</tr></thead><tbody>${months.map(m=>{const x=monthSummary(m),c=compareAccountant(x,accountantKeyForMonth(m));return`<tr><td>${monthTitle(m)}</td><td>${money(x.chiusura)}</td><td>${money(x.ivaDebito)}</td><td>${money(x.ivaCredito)}</td><td>${signedIvaLabel(c.sys)}</td><td>${c.a.has?`${accountantStatusLabel(c.a.status)} · ${money(c.a.amount)}`:'—'}</td><td>${c.absDiff===null?'—':money(c.absDiff)}</td><td>${ivaPositionLabel(x)}</td><td><button class="ghost-btn" onclick="openMonth('${m}')">${tx('查看')}</button></td></tr>`}).join('')}</tbody></table></div></div><div class="card" style="margin-top:16px"><h3>${tx('季度记录')}</h3><div class="table-wrap"><table class="table"><thead><tr>${['季度','营业额','IVA a debito','IVA a credito','系统预估','会计师预估','差额','状态',''].map(x=>`<th>${tx(x)}</th>`).join('')}</tr></thead><tbody>${quarters.map(q=>{const x=quarterSummary(q),c=compareAccountant(x,accountantKeyForQuarter(q));return`<tr><td>${quarterTitle(q)}</td><td>${money(x.chiusura)}</td><td>${money(x.ivaDebito)}</td><td>${money(x.ivaCredito)}</td><td>${signedIvaLabel(c.sys)}</td><td>${c.a.has?`${accountantStatusLabel(c.a.status)} · ${money(c.a.amount)}`:'—'}</td><td>${c.absDiff===null?'—':money(c.absDiff)}</td><td>${ivaPositionLabel(x)}</td><td><button class="ghost-btn" onclick="openQuarter('${q}')">${tx('查看')}</button></td></tr>`}).join('')}</tbody></table></div></div>`;
}

if(typeof appUnlocked!=='undefined'&&appUnlocked&&state.account){setTimeout(render,0)}
</script>

<script>
Object.assign(it,{
  'EMP与SUNSHOP IVA联动':'Collegamento IVA EMP ↔ SUNSHOP',
  '自动用一方Credito抵另一方Debito':'Compensazione automatica del credito di una società con il debito dell’altra',
  '抵消前EMP':'EMP prima della compensazione',
  '抵消前SUNSHOP':'SUNSHOP prima della compensazione',
  '自动抵消':'Compensazione automatica',
  '联动后合计':'Saldo combinato dopo compensazione',
  'EMP抵消后':'EMP dopo compensazione',
  'SUNSHOP抵消后':'SUNSHOP dopo compensazione',
  '无需抵消':'Nessuna compensazione necessaria',
  '读取关联账户中':'Lettura account collegato…',
  '关联账户读取失败':'Impossibile leggere l’account collegato',
  '会计师联动预估':'Stima collegata del commercialista',
  '两边都录入会计师预估后自动显示':'Disponibile quando entrambe le stime del commercialista sono inserite',
  '联动后本账户':'Questo account dopo compensazione',
  '联动后另一账户':'Altro account dopo compensazione',
  '集团最终状态':'Posizione combinata finale',
  '本联动不会修改原始发票或营业额':'Questa compensazione non modifica fatture o chiusure originali',
  '按系统预估自动联动':'Compensazione automatica basata sulla stima del sistema',
  '会计师口径':'Proiezione commercialista',
  '系统口径':'Calcolo sistema',
  '使用Credito':'Credito utilizzato',
  '剩余Credito':'Credito residuo',
  '剩余Debito':'Debito residuo',
  '关联账户':'Account collegato',
  '当前账户':'Account corrente',
  '未能读取另一账户数据，请检查Firebase读取权限':'Impossibile leggere i dati dell’altro account. Verificare i permessi di lettura Firebase.'
});

/* Live data for the paired company. No original EMP/SUNSHOP records are moved or rewritten. */
let linkedIvaDbRef=null;
let linkedIvaState={account:null,data:null,loading:false,error:''};
function linkedOtherAccount(){
  if(state.account==='EMP')return 'SUNSHOP';
  if(state.account==='SUNSHOP')return 'EMP';
  return null;
}
function stopLinkedIvaListener(){
  if(linkedIvaDbRef){linkedIvaDbRef.off();linkedIvaDbRef=null}
  linkedIvaState={account:null,data:null,loading:false,error:''};
}
function startLinkedIvaListener(){
  if(linkedIvaDbRef){linkedIvaDbRef.off();linkedIvaDbRef=null}
  const other=linkedOtherAccount();
  linkedIvaState={account:other,data:null,loading:!!other,error:''};
  if(!other)return;
  linkedIvaDbRef=db.ref('vatManagement/'+other);
  linkedIvaDbRef.on('value',snap=>{
    if(linkedOtherAccount()!==other)return;
    linkedIvaState={account:other,data:snap.val()||{chiusure:{},fatture:{},iva:{}},loading:false,error:''};
    if(appUnlocked)render();
  },err=>{
    console.error('Linked IVA account read failed:',err);
    linkedIvaState={account:other,data:null,loading:false,error:(err&&err.message)||'permission_denied'};
    if(appUnlocked)render();
  });
}

/* Ensure the linked listener follows login/logout while preserving all existing listeners. */
const _linkedBaseListenData=listenData;
listenData=function(){_linkedBaseListenData();startLinkedIvaListener()};
const _linkedBaseShowLoginPage=showLoginPage;
showLoginPage=function(){stopLinkedIvaListener();_linkedBaseShowLoginPage()};

function linkedSafeInvoiceDate(r){
  const raw=String((r&&r.emissione)||(r&&r.data)||'').trim();
  return raw?normalizeDateValue(raw):'';
}
function linkedInPeriod(date,p=state.period,ref=todayISO()){
  if(!date)return false;
  if(p==='day')return date===ref;
  if(p==='month')return monthKey(date)===monthKey(ref);
  if(p==='quarter')return quarterKey(date)===quarterKey(ref);
  if(p==='year')return String(date).slice(0,4)===String(ref).slice(0,4);
  return true;
}
function linkedSummaryForData(data,p=state.period,ref=todayISO()){
  data=data||{};
  const rows=Object.entries(data.fatture||{}).map(([id,x])=>{
    x=x||{};
    const imponibile=num(x.imponibile),imposta=num(x.imposta);
    return {id,...x,imponibile,imposta,totale:imponibile+imposta};
  }).filter(r=>linkedInPeriod(linkedSafeInvoiceDate(r),p,ref));
  const f=rows.reduce((a,x)=>{a.count++;a.imponibile+=num(x.imponibile);a.imposta+=num(x.imposta);a.totale+=num(x.totale);return a},{count:0,imponibile:0,imposta:0,totale:0});
  const ch=Object.values(data.chiusure||{}).filter(x=>x&&linkedInPeriod(x.data,p,ref));
  const salesIva=ch.reduce((s,x)=>s+num(x.ivaVendite),0),chiusura=ch.reduce((s,x)=>s+num(x.totale),0);
  const key=adjustmentKeyForPeriod(p,ref),rawAdj=(data.ivaAdjustments||{})[key]||{};
  const creditoPrecedente=num(rawAdj.creditoPrecedente),rettifiche=num(rawAdj.rettifiche);
  const net=salesIva-f.imposta-creditoPrecedente+rettifiche;
  return {rows,...f,rangeChiusura:chiusura,chiusura,salesIva,fattureIva:f.imposta,creditoPrecedente,rettifiche,net,ivaDebito:Math.max(0,net),ivaCredito:Math.max(0,-net),adjustmentKey:key,invoiceCount:rows.length};
}
function linkedPairSummaries(){
  if(state.account!=='EMP'&&state.account!=='SUNSHOP')return null;
  if(!linkedIvaState.data)return null;
  const own=calcSummary(state.period),other=linkedSummaryForData(linkedIvaState.data,state.period,todayISO());
  return state.account==='EMP'?{emp:own,sun:other}:{emp:other,sun:own};
}
function linkedCompensationFromSigned(empNet,sunNet){
  empNet=num(empNet);sunNet=num(sunNet);
  const empCredit=Math.max(0,-empNet),empDebit=Math.max(0,empNet);
  const sunCredit=Math.max(0,-sunNet),sunDebit=Math.max(0,sunNet);
  const empToSun=Math.min(empCredit,sunDebit);
  const sunToEmp=Math.min(sunCredit,empDebit);
  let amount=0,from='',to='';
  if(empToSun>0){amount=empToSun;from='EMP';to='SUNSHOP'}
  else if(sunToEmp>0){amount=sunToEmp;from='SUNSHOP';to='EMP'}
  const empAfter=empNet+empToSun-sunToEmp;
  const sunAfter=sunNet-empToSun+sunToEmp;
  const groupNet=empAfter+sunAfter;
  return {empNet,sunNet,empAfter,sunAfter,groupNet,amount,from,to,empToSun,sunToEmp};
}
function linkedAccountantFromData(data,key){
  const r=((data||{}).accountantEstimates||{})[key]||{};
  const has=String(r.status||'').trim()!==''||String(r.amount||'').trim()!=='';
  const amount=Math.max(0,num(r.amount));
  let signed=0;
  if(r.status==='debit')signed=amount;
  else if(r.status==='credit')signed=-amount;
  return {has,signed,status:r.status||'',amount};
}
function linkedAccountantPair(){
  if(!linkedIvaState.data||(state.account!=='EMP'&&state.account!=='SUNSHOP'))return null;
  const key=accountantKeyForPeriod(state.period,todayISO());
  const ownData=state.data||{},otherData=linkedIvaState.data||{};
  const empData=state.account==='EMP'?ownData:otherData;
  const sunData=state.account==='SUNSHOP'?ownData:otherData;
  const emp=linkedAccountantFromData(empData,key),sun=linkedAccountantFromData(sunData,key);
  return {key,emp,sun,both:emp.has&&sun.has,comp:emp.has&&sun.has?linkedCompensationFromSigned(emp.signed,sun.signed):null};
}
function linkedFlowText(c){
  if(!c||c.amount<=0)return tx('无需抵消');
  return `${c.from} → ${c.to} · ${tx('使用Credito')} ${money(c.amount)}`;
}
function linkedOffsetPanelHTML(){
  if(state.account!=='EMP'&&state.account!=='SUNSHOP')return '';
  const other=linkedOtherAccount();
  if(linkedIvaState.loading||linkedIvaState.account!==other){
    return `<div class="card linked-iva-panel"><div class="linked-iva-head"><div class="linked-iva-title"><div class="badge-icon"><span class="material-symbols-rounded">sync_alt</span></div><div><h3>${tx('EMP与SUNSHOP IVA联动')}</h3><small>${periodName()} · EMP ↔ SUNSHOP</small></div></div></div><div class="linked-loading">${tx('读取关联账户中')}</div></div>`;
  }
  if(linkedIvaState.error||!linkedIvaState.data){
    return `<div class="card linked-iva-panel"><div class="linked-iva-head"><div class="linked-iva-title"><div class="badge-icon"><span class="material-symbols-rounded">sync_problem</span></div><div><h3>${tx('EMP与SUNSHOP IVA联动')}</h3><small>${periodName()} · EMP ↔ SUNSHOP</small></div></div></div><div class="linked-loading">${tx('关联账户读取失败')}。${tx('未能读取另一账户数据，请检查Firebase读取权限')}</div></div>`;
  }
  const pair=linkedPairSummaries();
  if(!pair)return '';
  const c=linkedCompensationFromSigned(pair.emp.net,pair.sun.net);
  const ownAfter=state.account==='EMP'?c.empAfter:c.sunAfter;
  const otherAfter=state.account==='EMP'?c.sunAfter:c.empAfter;
  const aPair=linkedAccountantPair();
  const accountantLine=aPair&&aPair.both
    ? `${linkedFlowText(aPair.comp)} · ${tx('集团最终状态')}: ${signedIvaLabel(aPair.comp.groupNet)}`
    : tx('两边都录入会计师预估后自动显示');
  return `<div class="card linked-iva-panel">
    <div class="linked-iva-head"><div class="linked-iva-title"><div class="badge-icon"><span class="material-symbols-rounded">sync_alt</span></div><div><h3>${tx('EMP与SUNSHOP IVA联动')}</h3><small>${periodName()} · ${tx('自动用一方Credito抵另一方Debito')}</small></div></div><span class="compare-pill ${c.amount>0?'diff':'ok'}">${tx('按系统预估自动联动')}</span></div>
    <div class="linked-iva-grid">
      <div class="linked-iva-box emp"><small>${tx('抵消前EMP')}</small><b>${signedIvaLabel(c.empNet)}</b><span class="mini">Vendite IVA ${money(pair.emp.salesIva)} · Acquisti IVA ${money(pair.emp.fattureIva)}</span></div>
      <div class="linked-iva-box sun"><small>${tx('抵消前SUNSHOP')}</small><b>${signedIvaLabel(c.sunNet)}</b><span class="mini">Vendite IVA ${money(pair.sun.salesIva)} · Acquisti IVA ${money(pair.sun.fattureIva)}</span></div>
      <div class="linked-iva-box offset"><small>${tx('自动抵消')}</small><b>${c.amount>0?money(c.amount):money(0)}</b><span class="mini">${linkedFlowText(c)}</span></div>
      <div class="linked-iva-box final"><small>${tx('联动后合计')}</small><b>${signedIvaLabel(c.groupNet)}</b><span class="mini">EMP + SUNSHOP</span></div>
    </div>
    <div class="linked-after-grid">
      <div class="linked-after-card"><span>${tx('EMP抵消后')}</span><b>${signedIvaLabel(c.empAfter)}</b></div>
      <div class="linked-after-card"><span>${tx('SUNSHOP抵消后')}</span><b>${signedIvaLabel(c.sunAfter)}</b></div>
    </div>
    <div class="linked-iva-flow"><strong>${tx('联动后本账户')}: ${signedIvaLabel(ownAfter)}</strong><span>${tx('联动后另一账户')}: ${signedIvaLabel(otherAfter)}<br>${c.amount>0?linkedFlowText(c):tx('无需抵消')}</span></div>
    <div class="linked-accountant-row"><strong>${tx('会计师联动预估')}</strong><span>${accountantLine}</span></div>
    <div class="linked-iva-note">${tx('本联动不会修改原始发票或营业额')}。${currentLang==='it'?'La schermata applica la logica gestionale di compensazione richiesta; il trattamento fiscale effettivo va confermato con il commercialista.':'这里按你要求做的是管理上的自动联动显示；实际报税时是否可以跨主体直接抵扣，仍以会计师确认的处理方式为准。'}</div>
  </div>`;
}

/* Put the linked compensation panel prominently on Dashboard and IVA pages. */
const _linkedBaseDashboardHTML=dashboardHTML;
dashboardHTML=function(){
  const base=_linkedBaseDashboardHTML();
  const panel=linkedOffsetPanelHTML();
  if(!panel)return base;
  return base.replace('<div class="dash-mobile">','<div class="dash-mobile">'+panel);
};
const _linkedBaseIvaHTML=ivaHTML;
ivaHTML=function(){
  const base=_linkedBaseIvaHTML();
  const panel=linkedOffsetPanelHTML();
  if(!panel)return base;
  const t=tabs();
  return base.startsWith(t)?t+panel+base.slice(t.length):panel+base;
};

if(typeof appUnlocked!=='undefined'&&appUnlocked&&state.account){startLinkedIvaListener();setTimeout(render,0)}
</script>



<!-- V7: Commercialista difference rule requested by user -->
<style>
.accountant-box.debt{background:rgba(220,38,38,.07);border-color:rgba(220,38,38,.22)}
.accountant-rule{margin-top:10px;padding:11px 12px;border-radius:14px;background:rgba(37,99,235,.05);border:1px dashed rgba(37,99,235,.28);font-size:10px;color:var(--muted);font-weight:800;line-height:1.5}
.accountant-rule b{color:var(--text)}
</style>
<script>
Object.assign(it,{
  '待抵税/欠款':'IVA da compensare / debito residuo',
  '待抵税':'IVA da compensare',
  '欠款':'Debito residuo',
  '我们的预估金额':'Importo stimato da noi',
  '会计师预估金额':'Importo stimato dal commercialista',
  '我们的预估较高':'La nostra stima è più alta',
  '会计师预估较高':'La stima del commercialista è più alta',
  '按金额计算':'Calcolo per importo',
  '会计师金额减去我们的金额':'Importo commercialista meno nostro importo',
  '无需补差':'Nessuna differenza residua',
  '状态方向不同，请同时核对A CREDITO/A DEBITO':'Segno diverso: verificare anche A CREDITO / A DEBITO',
  '内部差额规则':'Regola interna dello scostamento'
});

/*
  Internal comparison rule requested:
  pending tax credit / debt = max(commercialista amount - our system amount, 0)
  where "our system amount" is the absolute value of the system IVA position.
  A CREDITO / A DEBITO is still shown separately so the tax direction is not hidden.
*/
compareAccountant=function(s,key=s.adjustmentKey||accountantKeyForPeriod()){
  const a=getAccountantEstimate(key),sys=systemSignedNet(s);
  const sysAmount=Math.abs(num(sys));
  if(!a.has)return {
    a,sys,sysAmount,diff:null,absDiff:null,amountGap:null,amountDue:null,oursHigher:null,
    kind:'none',label:tx('尚未输入会计师预估'),direction:'',sameSign:true
  };
  const amountGap=num(a.amount)-sysAmount; // >0 = commercialista estimate is higher
  const amountDue=Math.max(0,amountGap);
  const oursHigher=Math.max(0,-amountGap);
  const absDiff=Math.abs(amountGap);
  const sameSign=(Math.sign(sys)===Math.sign(a.signed)) || (Math.abs(sys)<0.005&&Math.abs(a.signed)<0.005);
  let kind='diff',label=tx('有差额'),direction='';
  if(absDiff<0.01){kind='ok';label=tx('一致');direction=tx('无需补差')}
  else if(amountGap>0){
    kind='debt';label=tx('会计师预估较高');
    const pendingLabel=a.status==='credit'?tx('待抵税'):a.status==='debit'?tx('欠款'):tx('待抵税/欠款');
    direction=`${pendingLabel}: ${money(amountDue)}`
  }
  else {kind='system';label=tx('我们的预估较高');direction=`${tx('我们的预估较高')}: ${money(oursHigher)}`}
  if(!sameSign && Math.abs(sys)>=0.01 && Math.abs(a.signed)>=0.01){
    direction += `${direction?' · ':''}${tx('状态方向不同，请同时核对A CREDITO/A DEBITO')}`;
  }
  return {a,sys,sysAmount,diff:amountGap,absDiff,amountGap,amountDue,oursHigher,kind,label,direction,sameSign};
};

accountantCompareHTML=function(s,key=s.adjustmentKey||accountantKeyForPeriod(),editable=false){
  const c=compareAccountant(s,key),a=c.a;
  const statusClass=c.kind==='ok'?'match':c.kind==='none'?'system':c.kind==='debt'?'debt':'warn';
  const updated=a.date?toSlashDate(a.date):(a.raw.updatedAt?new Date(a.raw.updatedAt).toLocaleDateString('it-IT'):'');
  const dueText=c.amountDue===null?'—':money(c.amountDue);
  const gapText=c.absDiff===null?'—':money(c.absDiff);
  const statusNote=!a.has
    ? tx('本项仅用于对比，不会覆盖系统IVA计算')
    : c.amountGap>0
      ? `${tx('会计师金额减去我们的金额')} = ${money(a.amount)} − ${money(c.sysAmount)} = ${money(c.amountDue)}`
      : c.amountGap<0
        ? `${tx('我们的预估较高')} ${money(c.oursHigher)}`
        : tx('一致');
  return `<div class="card accountant-panel">
    <div class="accountant-head">
      <div class="accountant-title"><div class="badge-icon"><span class="material-symbols-rounded">account_balance</span></div><div><h3>${tx('系统与会计师对比')}</h3><small>${periodName()} · ${key}</small></div></div>
      ${!editable?`<button class="ghost-btn" onclick="state.page='IVA';renderNav();render()"><span class="material-symbols-rounded">edit</span>${tx('编辑会计师预估')}</button>`:''}
    </div>
    <div class="accountant-grid">
      <div class="accountant-box system"><small>${tx('系统预估')}</small><b>${signedIvaLabel(c.sys)}</b><span class="mini">${tx('我们的预估金额')}: ${money(c.sysAmount)}</span></div>
      <div class="accountant-box external"><small>${tx('会计师预估')}</small><b>${a.has?`${accountantStatusLabel(a.status)} · ${money(a.amount)}`:tx('未填写')}</b><span class="mini">${a.has?(updated?`${tx('最后更新')}: ${updated}`:tx('会计师')):tx('输入会计师给出的最终IVA状态和金额')}</span></div>
      <div class="accountant-box ${statusClass}"><small>${tx('待抵税/欠款')}</small><b>${dueText}</b><span class="compare-pill ${c.kind==='debt'?'diff':c.kind}">${c.label}</span></div>
      <div class="accountant-box ${statusClass}"><small>${tx('差额')}</small><b>${gapText}</b><span class="mini">${c.direction||tx('本项仅用于对比，不会覆盖系统IVA计算')}</span></div>
    </div>
    ${a.has?`<div class="accountant-rule"><b>${tx('内部差额规则')}：</b> ${tx('待抵税/欠款')} = max(0, ${tx('会计师预估金额')} − ${tx('我们的预估金额')})<br>${statusNote}</div>`:''}
    ${a.has&&a.note?`<div class="accountant-reconcile"><strong>${tx('会计师备注')}</strong><span>${String(a.note).replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span></div>`:''}
    ${!a.has?`<div class="accountant-empty" style="margin-top:10px">${tx('尚未输入会计师预估')}。${tx('本项仅用于对比，不会覆盖系统IVA计算')}。</div>`:''}
  </div>`;
};
</script>


<!-- V8: Final accountant rule
     A CREDITO -> pending tax credit = max(commercialista - system amount, 0)
     A DEBITO  -> debt = commercialista amount directly
-->
<script>
Object.assign(it,{
  '欠款按会计师预估':'Debito = importo del commercialista',
  '待抵税按差额计算':'IVA da compensare = differenza positiva',
  '会计师A DEBITO直接作为欠款':'Se il commercialista indica A DEBITO, l’intero importo viene mostrato come debito',
  '会计师A CREDITO减去我们的预估':'Se il commercialista indica A CREDITO, si sottrae la nostra stima',
  '按会计师欠款':'Debito da commercialista'
});

compareAccountant=function(s,key=s.adjustmentKey||accountantKeyForPeriod()){
  const a=getAccountantEstimate(key),sys=systemSignedNet(s);
  const sysAmount=Math.abs(num(sys));

  if(!a.has)return {
    a,sys,sysAmount,diff:null,absDiff:null,amountGap:null,amountDue:null,oursHigher:null,
    kind:'none',label:tx('尚未输入会计师预估'),direction:'',sameSign:true,pendingType:'none'
  };

  const amountGap=num(a.amount)-sysAmount;
  const oursHigher=Math.max(0,-amountGap);
  const absDiff=Math.abs(amountGap);
  const sameSign=(Math.sign(sys)===Math.sign(a.signed)) || (Math.abs(sys)<0.005&&Math.abs(a.signed)<0.005);

  let amountDue=0;
  let kind='diff';
  let label=tx('有差额');
  let direction='';
  let pendingType='none';

  if(a.status==='debit'){
    // User rule: when commercialista says A DEBITO, the debt is the accountant amount itself.
    amountDue=Math.max(0,num(a.amount));
    pendingType='debt';
    kind=amountDue>0?'debt':'ok';
    label=amountDue>0?tx('按会计师欠款'):tx('一致');
    direction=amountDue>0
      ? `${tx('欠款')}: ${money(amountDue)}`
      : tx('无需补差');
  }else if(a.status==='credit'){
    // User rule: when commercialista says A CREDITO, only the excess over our estimate is pending tax credit.
    amountDue=Math.max(0,amountGap);
    pendingType='credit';
    if(absDiff<0.01){
      kind='ok'; label=tx('一致'); direction=tx('无需补差');
    }else if(amountGap>0){
      kind='debt'; label=tx('会计师预估较高');
      direction=`${tx('待抵税')}: ${money(amountDue)}`;
    }else{
      kind='system'; label=tx('我们的预估较高');
      direction=`${tx('我们的预估较高')}: ${money(oursHigher)}`;
    }
  }else{
    amountDue=0;
    pendingType='zero';
    kind=absDiff<0.01?'ok':'diff';
    label=absDiff<0.01?tx('一致'):tx('有差额');

  }

  return {
    a,sys,sysAmount,diff:amountGap,absDiff,amountGap,amountDue,oursHigher,

  };
};

accountantCompareHTML=function(s,key=s.adjustmentKey||accountantKeyForPeriod(),editable=false){

      <div class="accountant-box external"><small>${tx('会计师预估')}</small><b>${a.has?`${accountantStatusLabel(a.status)} · ${money(a.amount)}`:tx('未填写')}</b><span class="mini">${a.has?(updated?`${tx('最后更新')}: ${updated}`:tx('会计师')):tx('输入会计师给出的最终IVA状态和金额')}</span></div>

    </div>
    ${a.has?`<div class="accountant-rule"><b>${tx('内部差额规则')}：</b><br>
      ${a.status==='debit'

    ${a.has&&a.note?`<div class="accountant-reconcile"><strong>${tx('会计师备注')}</strong><span>${String(a.note).replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span></div>`:''}

  </div>`;
};

<script>
/* -------------------- bilingual IVA terminology -------------------- */
const _v9BaseTx=tx;
tx=function(s){

Object.assign(it,{
  '上季度自动结转':'Credito automatico dal trimestre precedente',

  '自动结转已启用':'Riporto automatico attivo',
  '供应商发票查询':'Ricerca fatture per fornitore',

  '匹配发票':'Fatture trovate',
  '收到发票数':'Fatture ricevute',
  '最后收到日期':'Ultima data ricezione',
  '第一张开票日期':'Prima data emissione',
  '请输入供应商名称开始查询':'Inserisci il nome del fornitore per iniziare la ricerca',
  '没有找到该供应商的发票':'Nessuna fattura trovata per questo fornitore',
  '点击查看发票':'Vedi fatture',
  '全部细节':'Dettagli completi',
  '自动结转':'Riporto automatico',
  '手动覆盖':'Sostituzione manuale',
  '本季度使用的结转Credito':'Credito riportato utilizzato nel trimestre',
  '季度结转说明':'Nota riporto trimestrale'
});
function ivaBilingualTerm(kind){
  if(kind==='debit')return currentLang==='it'?'A DEBITO · IVA da versare':'A DEBITO / 应缴 IVA';
  if(kind==='credit')return currentLang==='it'?'A CREDITO · Credito IVA':'A CREDITO / 可抵扣 IVA';
  return currentLang==='it'?'IN PAREGGIO':'IVA 已平 / IN PAREGGIO';
}
accountantStatusLabel=function(status){
  if(status==='debit')return ivaBilingualTerm('debit');
  if(status==='credit')return ivaBilingualTerm('credit');
  if(status==='zero')return ivaBilingualTerm('zero');
  return tx('未填写');
};
signedIvaLabel=function(v){
  v=num(v);
  if(v>0)return `${ivaBilingualTerm('debit')} · ${money(v)}`;
  if(v<0)return `${ivaBilingualTerm('credit')} · ${money(Math.abs(v))}`;
  return `${ivaBilingualTerm('zero')} · ${money(0)}`;
};
ivaPositionLabel=function(s){
  if(num(s.ivaDebito)>0)return ivaBilingualTerm('debit');
  if(num(s.ivaCredito)>0)return ivaBilingualTerm('credit');
  return ivaBilingualTerm('zero');
};

/* -------------------- automatic quarterly carry-forward --------------------
   For EMP/SUNSHOP, the carry to the next quarter is the RESIDUAL credit after the
   requested EMP <-> SUNSHOP compensation. This prevents reusing credit already
   consumed by the other linked account.
   Existing creditoPrecedente values are preserved: when a value is present for a
   quarter it works as a manual override; when blank, automatic carry is used. */
function v9QuarterIndex(q){
  const m=String(q||'').match(/^(\d{4})-Q([1-4])$/);if(!m)return null;
  return Number(m[1])*4+(Number(m[2])-1);
}
function v9QuarterFromIndex(i){const y=Math.floor(i/4),qq=(i%4)+1;return `${y}-Q${qq}`}
function v9PrevQuarter(q){const i=v9QuarterIndex(q);return i===null?'':v9QuarterFromIndex(i-1)}
function v9RawInvoiceDate(r){const raw=String((r&&r.emissione)||(r&&r.data)||'').trim();return raw?normalizeDateValue(raw):''}
function v9QuarterRows(data,q){
  return Object.entries((data||{}).fatture||{}).map(([id,x])=>{
    x=x||{};const imponibile=num(x.imponibile),imposta=num(x.imposta);
    return {id,...x,imponibile,imposta,totale:imponibile+imposta};
  }).filter(r=>{const d=v9RawInvoiceDate(r);return d&&quarterKey(d)===q});
}
function v9QuarterCore(data,q){
  data=data||{};
  const rows=v9QuarterRows(data,q);
  const f=rows.reduce((a,x)=>{a.count++;a.imponibile+=num(x.imponibile);a.imposta+=num(x.imposta);a.totale+=num(x.totale);return a},{count:0,imponibile:0,imposta:0,totale:0});
  const ch=Object.values(data.chiusure||{}).filter(x=>x&&x.data&&quarterKey(x.data)===q);
  const salesIva=ch.reduce((s,x)=>s+num(x.ivaVendite),0),chiusura=ch.reduce((s,x)=>s+num(x.totale),0);
  const key=adjustmentKeyForQuarter(q),rawAdj=(data.ivaAdjustments||{})[key]||{};
  const manualRaw=String(rawAdj.creditoPrecedente??'').trim();
  const manualOverride=manualRaw!=='';
  const manualCarry=num(rawAdj.creditoPrecedente),rettifiche=num(rawAdj.rettifiche);
  const baseNet=salesIva-f.imposta+rettifiche;
  return {rows,...f,rangeChiusura:chiusura,chiusura,salesIva,fattureIva:f.imposta,rettifiche,baseNet,manualOverride,manualCarry,adjustmentKey:key,invoiceCount:rows.length};
}
function v9DataQuarterIndexes(data,targetIdx){
  const out=[];data=data||{};
  Object.values(data.chiusure||{}).forEach(x=>{if(x&&x.data){const i=v9QuarterIndex(quarterKey(x.data));if(i!==null&&i<=targetIdx)out.push(i)}});
  Object.values(data.fatture||{}).forEach(x=>{const d=v9RawInvoiceDate(x);if(d){const i=v9QuarterIndex(quarterKey(d));if(i!==null&&i<=targetIdx)out.push(i)}});
  Object.keys(data.ivaAdjustments||{}).forEach(k=>{const m=k.match(/^quarter_(\d{4}-Q[1-4])$/);if(m){const i=v9QuarterIndex(m[1]);if(i!==null&&i<=targetIdx)out.push(i)}});
  return out;
}
function v9EarliestQuarterIndex(datas,targetIdx){
  const arr=[];(datas||[]).forEach(d=>arr.push(...v9DataQuarterIndexes(d,targetIdx)));
  return arr.length?Math.min(...arr):targetIdx;
}
function v9FinalizeQuarter(core,autoCarry,effectiveCarry,linkedAfter=null){
  const net=core.baseNet-effectiveCarry;
  const ivaDebito=Math.max(0,net),ivaCredito=Math.max(0,-net);
  return {...core,creditoAutomatico:autoCarry,creditoPrecedente:effectiveCarry,creditoManuale:core.manualCarry,
    net,ivaDebito,ivaCredito,gap:ivaDebito,needImp:0,needTot:0,rate:22,
    linkedNet:linkedAfter===null?net:linkedAfter,
    linkedIvaDebito:linkedAfter===null?ivaDebito:Math.max(0,linkedAfter),
    linkedIvaCredito:linkedAfter===null?ivaCredito:Math.max(0,-linkedAfter)};
}
function v9StandaloneQuarterSummary(data,q){
  const target=v9QuarterIndex(q);if(target===null)return v9FinalizeQuarter(v9QuarterCore(data,q),0,0);
  const start=v9EarliestQuarterIndex([data],target);let carry=0,result=null;
  for(let i=start;i<=target;i++){
    const qq=v9QuarterFromIndex(i),core=v9QuarterCore(data,qq);
    const effective=core.manualOverride?core.manualCarry:carry;
    result=v9FinalizeQuarter(core,carry,effective);
    carry=result.ivaCredito;
  }
  return result;
}
function v9LinkedQuarterPair(empData,sunData,q){
  const target=v9QuarterIndex(q);if(target===null)return null;
  const start=v9EarliestQuarterIndex([empData,sunData],target);
  let carryEmp=0,carrySun=0,last=null;
  for(let i=start;i<=target;i++){
    const qq=v9QuarterFromIndex(i),e=v9QuarterCore(empData,qq),s=v9QuarterCore(sunData,qq);
    const eCarry=e.manualOverride?e.manualCarry:carryEmp;
    const sCarry=s.manualOverride?s.manualCarry:carrySun;
    const eNet=e.baseNet-eCarry,sNet=s.baseNet-sCarry;
    const comp=linkedCompensationFromSigned(eNet,sNet);
    const emp=v9FinalizeQuarter(e,carryEmp,eCarry,comp.empAfter);
    const sun=v9FinalizeQuarter(s,carrySun,sCarry,comp.sunAfter);
    emp.net=eNet;emp.ivaDebito=Math.max(0,eNet);emp.ivaCredito=Math.max(0,-eNet);
    sun.net=sNet;sun.ivaDebito=Math.max(0,sNet);sun.ivaCredito=Math.max(0,-sNet);
    carryEmp=Math.max(0,-comp.empAfter);carrySun=Math.max(0,-comp.sunAfter);
    last={emp,sun,comp,quarter:qq,carryOutEmp:carryEmp,carryOutSun:carrySun};
  }
  return last;
}
function v9LinkedDatas(){
  if((state.account!=='EMP'&&state.account!=='SUNSHOP')||!linkedIvaState||!linkedIvaState.data)return null;
  return state.account==='EMP'?{emp:state.data||{},sun:linkedIvaState.data||{}}:{emp:linkedIvaState.data||{},sun:state.data||{}};
}
const _v9BaseCalcSummary=calcSummary;
calcSummary=function(p=state.period){

quarterSummary=function(q){

linkedSummaryForData=function(data,p=state.period,ref=todayISO()){

};
linkedPairSummaries=function(){

};

summaryCards=function(s,sub=periodName()){
  const carryDetail=state.period==='quarter'

    ${metric(s.rettifiche>0?'orange':'blue','tune','调整项',money(s.rettifiche),'')}

/* Rebuild IVA settings so quarterly automatic carry and manual override are explicit. */
ivaHTML=function(){

  const carryCards=isQ?`

    <div class="input-card"><label>${tx('当前范围')}</label><input value="${periodName()}" readonly></div>
    <div class="input-card"><label>${tx('当前期间键')}</label><input value="${s.adjustmentKey}" readonly></div>

/* -------------------- supplier invoice search -------------------- */
function v9Esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function v9SupplierNames(){return [...new Set(fattureList().map(r=>String(r.fornitore||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it'))}
function v9SupplierRows(q){
  q=String(q||'').trim().toLocaleLowerCase('it');if(!q)return [];
  return fattureList().filter(r=>String(r.fornitore||'').trim().toLocaleLowerCase('it').includes(q));
}
function v9SupplierResultsHTML(q){
  q=String(q||'').trim();
  if(!q)return `<div class="supplier-search-empty">${tx('请输入供应商名称开始查询')}。</div>`;
  const rows=v9SupplierRows(q);
  if(!rows.length)return `<div class="supplier-search-empty">${tx('没有找到该供应商的发票')}：<span class="supplier-hit">${v9Esc(q)}</span></div>`;
  const s=fattureSummary(rows);
  const receiptDates=rows.map(r=>String(r.ricezione||'').trim()).filter(Boolean).map(normalizeDateValue).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)).sort();
  const emissionDates=rows.map(r=>String(r.emissione||'').trim()).filter(Boolean).map(normalizeDateValue).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)).sort();
  const lastReceipt=receiptDates.length?toSlashDate(receiptDates[receiptDates.length-1]):'—';
  const firstEmission=emissionDates.length?toSlashDate(emissionDates[0]):'—';
  return `<div class="supplier-search-summary">
    <div class="supplier-mini-stat"><small>${tx('收到发票数')}</small><b>${rows.length}</b></div>
    <div class="supplier-mini-stat"><small>${tx('未税金额')}</small><b>${money(s.imponibile)}</b></div>
    <div class="supplier-mini-stat"><small>${tx('可抵扣进项IVA')}</small><b>${money(s.imposta)}</b></div>
    <div class="supplier-mini-stat"><small>${tx('总金额')}</small><b>${money(s.totale)}</b></div>
  </div><div style="display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:10px;font-weight:800;margin:0 0 9px"><span>${tx('第一张开票日期')}: <b style="color:var(--text)">${firstEmission}</b></span><span>${tx('最后收到日期')}: <b style="color:var(--text)">${lastReceipt}</b></span><span>${tx('匹配发票')}: <b style="color:var(--text)">${v9Esc(q)}</b></span></div>
  <div class="table-wrap"><table class="table"><thead><tr>${['供应商','发票号','开票日期','收到日期','类别','付款方式','未税金额','税额','总金额','状态','备注'].map(x=>`<th>${tx(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><td><b>${v9Esc(r.fornitore||'')}</b></td><td>${v9Esc(r.numero||'')}</td><td>${toSlashDate(r.emissione||'')}</td><td>${toSlashDate(r.ricezione||'')}</td><td>${v9Esc(r.categoria||'')}</td><td>${v9Esc(r.pagamento||'')}</td><td>${money(r.imponibile)}</td><td>${money(r.imposta)}</td><td><b>${money(r.totale)}</b></td><td>${tx(r.stato||'')}</td><td>${v9Esc(r.note||'')}</td></tr>`).join('')}</tbody></table></div>`;
}
function updateSupplierInvoiceSearch(v){
  state.invoiceSupplierQuery=String(v||'');
  const box=$('supplierInvoiceResults');if(box)box.innerHTML=v9SupplierResultsHTML(state.invoiceSupplierQuery);
}
function clearSupplierInvoiceSearch(){
  state.invoiceSupplierQuery='';const inp=$('supplierInvoiceSearch');if(inp)inp.value='';updateSupplierInvoiceSearch('');if(inp)inp.focus();
}
function openSupplierInvoices(name){state.invoiceSupplierQuery=String(name||'');state.page='Fatture';renderNav();render();setTimeout(()=>{$('supplierInvoiceSearch')?.focus()},50)}
function supplierInvoiceSearchPanelHTML(){
  const q=state.invoiceSupplierQuery||'',names=v9SupplierNames();
  return `<div class="card supplier-search-panel"><div class="supplier-search-head"><div class="supplier-search-title"><div class="badge-icon"><span class="material-symbols-rounded">manage_search</span></div><div><h3>${tx('供应商发票查询')}</h3><small>${tx('输入供应商名称查看收到的全部发票和细节')}</small></div></div></div>
    <div class="supplier-search-controls"><div class="input-wrap"><span class="material-symbols-rounded">search</span><input id="supplierInvoiceSearch" list="supplierInvoiceNames" placeholder="${tx('供应商名称')}" value="${v9Esc(q)}" oninput="updateSupplierInvoiceSearch(this.value)"><datalist id="supplierInvoiceNames">${names.map(n=>`<option value="${v9Esc(n)}"></option>`).join('')}</datalist></div><button class="ghost-btn" onclick="clearSupplierInvoiceSearch()"><span class="material-symbols-rounded">backspace</span>${tx('清除搜索')}</button></div>
    <div id="supplierInvoiceResults" style="margin-top:12px">${v9SupplierResultsHTML(q)}</div></div>`;
}
const _v9BaseFattureHTML=fattureHTML;
fattureHTML=function(){return supplierInvoiceSearchPanelHTML()+_v9BaseFattureHTML()};
fornitoriHTML=function(){
  const map={};fattureList().forEach(x=>{const n=(x.fornitore||'').trim();if(n){if(!map[n])map[n]={count:0,total:0,iva:0};map[n].count++;map[n].total+=num(x.totale);map[n].iva+=num(x.imposta)}});
  return `<div class="card"><h3>${tx('供应商')}</h3><div class="table-wrap"><table class="table" style="min-width:650px"><thead><tr><th>${tx('供应商')}</th><th>${tx('发票数量')}</th><th>${tx('可抵扣进项IVA')}</th><th>${tx('总金额')}</th><th></th></tr></thead><tbody>${Object.entries(map).sort((a,b)=>a[0].localeCompare(b[0],'it')).map(([k,v])=>`<tr><td><b>${v9Esc(k)}</b></td><td>${v.count}</td><td>${money(v.iva)}</td><td>${money(v.total)}</td><td><button class="ghost-btn" onclick='openSupplierInvoices(${JSON.stringify(k)})'><span class="material-symbols-rounded">receipt_long</span>${tx('点击查看发票')}</button></td></tr>`).join('')||`<tr><td colspan="5">${tx('暂无数据')}</td></tr>`}</tbody></table></div></div>`;
};

if(typeof appUnlocked!=='undefined'&&appUnlocked&&state.account){setTimeout(render,0)}

async function saveEditedInvoice(id){
  const old=v11RawInvoice(id);
  if(!old)return;
  const next={
    ...old,
    data:normalizeDateValue($('eData')?.value||old.data||todayISO()),
    fornitore:$('eFornitore')?.value||'',
    numero:$('eNumero')?.value||'',
    emissione:normalizeDateValue($('eEmissione')?.value||''),
    ricezione:normalizeDateValue($('eRicezione')?.value||''),
    categoria:$('eCategoria')?.value||'',
    pagamento:$('ePagamento')?.value||'',
    ivaPercent:$('eIvaPercent')?.value||'',
    imponibile:$('eImponibile')?.value||'',
    imposta:$('eImposta')?.value||'',
    totale:num($('eImponibile')?.value)+num($('eImposta')?.value),
    stato:$('eStato')?.value||'已登记',
    note:$('eNote')?.value||'',
    updatedAt:Date.now()
  };

  state.data.fatture=state.data.fatture||{};
  state.data.fatture[id]=next;

  try{
    await save('fatture/'+id,next);
    closeEditInvoiceModal();
    v11RefreshAllDerived();
  }catch(err){
    console.error('Invoice update failed:',err);
    alert(currentLang==='it'?'Impossibile salvare le modifiche alla fattura.':'发票修改保存失败，请重试');
  }
}

<script>
function v12IsExportControl(el){
  if(!el)return false;
  const onclick=String(el.getAttribute?.('onclick')||'').toLowerCase();
  const id=String(el.id||'').toLowerCase();
  const txt=String(el.textContent||'').toLowerCase();
  return onclick.includes('export') || id.includes('export') ||
         txt.includes('导出') || txt.includes('esporta');
}

function v12DecorateToolbars(){
  const root=document.getElementById('view');
  if(!root)return;

  root.querySelectorAll('.toolbar').forEach(tb=>{
    const direct=[...tb.children];
    let actionHost=null;

    // Prefer an existing direct-child container that already contains export controls.
    for(const child of direct){
      if(child.querySelector && [...child.querySelectorAll('button,select')].some(v12IsExportControl)){
        actionHost=child;
        break;
      }
    }

    // If export buttons are direct children, group only the action controls at the right.
    if(!actionHost){
      const directActions=direct.filter(el=>v12IsExportControl(el));
      if(directActions.length){
        actionHost=document.createElement('div');
        actionHost.className='v12-toolbar-actions v12-export-cluster';
        directActions[0].before(actionHost);
        directActions.forEach(el=>actionHost.appendChild(el));
      }
    }

    if(actionHost){
      actionHost.classList.add('v12-toolbar-actions');
      tb.classList.add('v12-has-actions');

      // If the host mixes filters/date/search with export actions, push exports to the far right.
      const controls=[...actionHost.children];
      const firstExport=controls.find(v12IsExportControl);
      if(firstExport) firstExport.style.marginLeft='auto';
    }
  });

  // Standalone export buttons outside .toolbar also align right where possible.
  root.querySelectorAll('button[onclick*="export"]').forEach(btn=>{
    const p=btn.parentElement;
    if(p && !p.classList.contains('toolbar') && !p.classList.contains('v12-export-cluster')){
      p.classList.add('v12-export-cluster');
    }
  });
}

/* Wrap the current renderer so every page gets the same layout after every update. */
const v12PreviousRender = render;
render = function(){
  v12PreviousRender();
  requestAnimationFrame(v12DecorateToolbars);
};

/* Also apply after invoice edits/saves/deletes and Firebase refreshes because they call render(). */
if(typeof appUnlocked!=='undefined' && appUnlocked && state.account){
  setTimeout(()=>{
    try{ render(); }catch(e){ console.error(e); }
  },0);
}
</script>

  if(box)box.innerHTML=supplierPageSearchResults();

function clearSupplierPageSearch(){

function chooseSupplierOnSupplierPage(name){
  state.supplierPageQuery=String(name||'');

  if(input)input.value=state.supplierPageQuery;
  const box=$('supplierPageInvoiceResults');
  if(box)box.innerHTML=supplierPageSearchResults();
  setTimeout(()=>box?.scrollIntoView({behavior:'smooth',block:'start'}),30);
}

fornitoriHTML=function(){
  const rows=fattureList();
  const map={};
  rows.forEach(x=>{
    const n=String(x.fornitore||'').trim();
    if(!n)return;
    if(!map[n])map[n]={count:0,total:0,iva:0,imponibile:0,lastReceipt:''};
    map[n].count++;
    map[n].total+=num(x.totale);
    map[n].iva+=num(x.imposta);
    map[n].imponibile+=num(x.imponibile);
    const rd=receiptDate(x);
    if(rd && (!map[n].lastReceipt || rd>map[n].lastReceipt))map[n].lastReceipt=rd;

        <button class="ghost-btn" onclick="runSupplierPageSearch()">
          <span class="material-symbols-rounded">receipt_long</span>${tx('搜索发票')}
        </button>

        <button class="ghost-btn" onclick="clearSupplierPageSearch()">
          <span class="material-symbols-rounded">backspace</span>${tx('清除搜索')}
        </button>
      </div>

      <div id="supplierPageInvoiceResults" style="margin-top:12px">
        ${supplierPageSearchResults()}
      </div>
    </div>

    <div class="card supplier-list-card">
      <div class="supplier-list-toolbar">
        <h3>${tx('全部供应商')}</h3>

              <th>${tx('操作')}</th>

                <td>${v.count}</td>
                <td>${money(v.imponibile)}</td>

<script>
Object.assign(it,{
  '供应商或发票号':'Fornitore o numero fattura',
  '搜索供应商或发票号':'Cerca fornitore o numero fattura',
  '输入供应商名称或发票号开始查询':'Inserisci il nome del fornitore o il numero fattura per iniziare la ricerca',
  '没有找到匹配的发票':'Nessuna fattura corrispondente trovata',

});

function v15SearchNorm(v){
  return String(v||'').trim().toLocaleLowerCase('it');
}
function v15InvoiceNorm(v){
  return v15SearchNorm(v).replace(/[\s./\\\-_]+/g,'');
}

/* Shared search used by both Fatture and Fornitori pages.
   A single query matches either supplier name OR invoice number. */
v9SupplierRows=function(q){
  const raw=v15SearchNorm(q);
  if(!raw)return [];
  const compact=v15InvoiceNorm(q);

  return fattureList().filter(r=>{
    const supplier=v15SearchNorm(r.fornitore);
    const invoice=v15SearchNorm(r.numero);
    const invoiceCompact=v15InvoiceNorm(r.numero);

    return supplier.includes(raw) ||
           invoice.includes(raw) ||
           (compact && invoiceCompact.includes(compact));
  });
};

function v15SearchOptions(){
  const suppliers=v9SupplierNames();
  const invoices=[...new Set(
    fattureList()
      .map(r=>String(r.numero||'').trim())
      .filter(Boolean)
  )].sort((a,b)=>a.localeCompare(b,'it',{numeric:true}));

  return [
    ...suppliers.map(v=>({value:v,label:`${tx('供应商')}: ${v}`})),
    ...invoices.map(v=>({value:v,label:`${tx('发票号')}: ${v}`}))
  ];
}

/* Fornitori page: same single search box for supplier OR invoice number. */
fornitoriHTML=function(){
  const rows=fattureList();
  const map={};

  rows.forEach(x=>{
    const n=String(x.fornitore||'').trim();
    if(!n)return;
    if(!map[n])map[n]={count:0,total:0,iva:0,imponibile:0,lastReceipt:''};
    map[n].count++;
    map[n].total+=num(x.totale);
    map[n].iva+=num(x.imposta);
    map[n].imponibile+=num(x.imponibile);

    const rd=receiptDate(x);
    if(rd && (!map[n].lastReceipt || rd>map[n].lastReceipt))map[n].lastReceipt=rd;
  });

  const names=Object.keys(map).sort((a,b)=>a.localeCompare(b,'it'));
  const options=v15SearchOptions();
  const q=String(state.supplierPageQuery||'');

          </datalist>
        </div>

        </button>

        <button class="ghost-btn" onclick="clearSupplierPageSearch()">
          <span class="material-symbols-rounded">backspace</span>${tx('清除搜索')}
        </button>
      </div>

      <div id="supplierPageInvoiceResults" style="margin-top:12px">
        ${v9SupplierResultsHTML(q)}
      </div>
    </div>

    <div class="card supplier-list-card">
      <div class="supplier-list-toolbar">
        <h3>${tx('全部供应商')}</h3>
        <span class="supplier-list-count">${tx('当前供应商数量')}: ${names.length}</span>
      </div>

      <div class="table-wrap" style="margin-top:12px">
        <table class="table" style="min-width:780px">

              <th>${tx('可抵扣进项IVA')}</th>
              <th>${tx('总金额')}</th>
              <th>${tx('最后收到日期')}</th>
              <th>${tx('操作')}</th>
            </tr>
          </thead>
          <tbody>
            ${names.map(k=>{
              const v=map[k];
              return `<tr>
                <td><b>${v9Esc(k)}</b></td>
                <td>${v.count}</td>
                <td>${money(v.imponibile)}</td>

          </tbody>
        </table>

    </div>`;
};

if(typeof appUnlocked!=='undefined' && appUnlocked && state.account){

<script>
Object.assign(it,{
  '搜索结果':'Risultati ricerca',
  '点击发票查看详情':'Clicca una fattura per vedere i dettagli',
  '发票详情':'Dettaglio fattura',
  '录入日期':'Data registrazione',
  '供应商发票':'Fatture fornitore',
  '匹配发票号':'Numero fattura trovato',
  '未找到结果':'Nessun risultato trovato',

  '查看详情':'Vedi dettagli',
  '到货日期':'Data ricezione',

});

function v16Esc(v){
  return String(v??'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function v16SearchMode(q){
  const raw=v15SearchNorm(q);
  if(!raw)return {mode:'none',rows:[]};

  const supplierMatches=fattureList().filter(r=>
    v15SearchNorm(r.fornitore).includes(raw)
  );

  if(supplierMatches.length){
    return {mode:'supplier',rows:supplierMatches};
  }

  const compact=v15InvoiceNorm(q);
  const invoiceMatches=fattureList().filter(r=>{
    const inv=v15SearchNorm(r.numero);
    const invCompact=v15InvoiceNorm(r.numero);
    return inv.includes(raw) || (compact && invCompact.includes(compact));
  });

  return {mode:'invoice',rows:invoiceMatches};
}

function closeInvoiceSearchModal(){
  const el=$('invoiceSearchModal');
  if(el)el.remove();
}

function closeInvoiceDetailModal(){
  const el=$('invoiceDetailModal');
  if(el)el.remove();
}

function openInvoiceSearchModal(q){
  closeInvoiceSearchModal();
  closeInvoiceDetailModal();

  q=String(q||'').trim();
  if(!q)return;

  const result=v16SearchMode(q);
  const rows=result.rows||[];
  const wrap=document.createElement('div');
  wrap.id='invoiceSearchModal';
  wrap.className='modal-backdrop search-result-modal';
  wrap.onclick=e=>{
    if(e.target.id==='invoiceSearchModal')closeInvoiceSearchModal();

  let body='';
  if(!rows.length){
    body=`<div class="search-result-empty">${tx('未找到结果')}：<b>${v16Esc(q)}</b></div>`;
  }else{
    const s=fattureSummary(rows);
    const title=result.mode==='supplier'
      ? `${tx('供应商发票')} · ${v16Esc(q)}`
      : `${tx('匹配发票号')} · ${v16Esc(q)}`;

    body=`
      <div class="search-result-summary">
        <div class="search-result-card"><small>${tx('发票数量')}</small><b>${rows.length}</b></div>
        <div class="search-result-card"><small>${tx('未税金额')}</small><b>${money(s.imponibile)}</b></div>

              <th>${tx('收到日期')}</th>
              <th>${tx('未税金额')}</th>
              <th>${tx('税额')}</th>
              <th>${tx('总金额')}</th>
              <th>${tx('状态')}</th>
              <th>${tx('操作')}</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(r=>`
              <tr class="search-result-row" onclick="openInvoiceDetailModal('${r.id}')">
                <td><b>${v16Esc(r.fornitore||'')}</b></td>
                <td>${v16Esc(r.numero||'')}</td>

                <td>${toSlashDate(r.ricezione||'')}</td>
                <td>${money(r.imponibile)}</td>
                <td>${money(r.imposta)}</td>
                <td><b>${money(r.totale)}</b></td>
                <td>${tx(r.stato||'')}</td>
                <td>
                  <button class="ghost-btn" onclick="event.stopPropagation();openInvoiceDetailModal('${r.id}')">
                    <span class="material-symbols-rounded">visibility</span>${tx('查看详情')}
                  </button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>

    wrap.dataset.title=title;
  }

  wrap.innerHTML=`
    <div class="modal-card">
      <div class="modal-head">

          <h3>${rows.length

            : tx('搜索结果')}</h3>

        </div>
        <button class="icon-btn" title="${tx('关闭弹窗')}" onclick="closeInvoiceSearchModal()">
          <span class="material-symbols-rounded">close</span>
        </button>
      </div>
      <div class="search-result-body">${body}</div>
    </div>
  `;
  document.body.appendChild(wrap);
}

<!-- V18: Accountant A credito rule requested by user -->
<script>
Object.assign(it,{
  '会计师可抵扣IVA':'A credito del commercialista',
  '我们的可抵扣IVA':'Nostro A credito',
  '会计师应缴IVA':'A debito del commercialista',
  '我们的应缴IVA':'Nostro A debito',
  '系统可抵扣更高，采用会计师金额':'Il nostro A credito è più alto: usa direttamente l’importo del commercialista',
  '系统可抵扣更低，计算剩余待抵税':'Il nostro A credito è più basso: calcola l’importo residuo da compensare',
  '待抵税计算规则':'Regola IVA da compensare'
});

/*
  Final internal rule:

  Commercialista = A debito:
    debt = accountant amount directly.

  Commercialista = A credito:
    systemCredit = only the system's A credito amount (never absolute A debito).
    - if systemCredit > accountantCredit:
        pending tax credit = accountantCredit
    - otherwise:
        pending tax credit = accountantCredit - systemCredit
*/
compareAccountant = function(s,key=s.adjustmentKey||accountantKeyForPeriod()){
  const a=getAccountantEstimate(key);
  const sys=systemSignedNet(s);

  const systemDebit=Math.max(0,num(sys));
  const systemCredit=Math.max(0,-num(sys));

  if(!a.has){
    return {
      a,sys,
      systemDebit,systemCredit,
      sysAmount:Math.abs(num(sys)),
      comparedSystemAmount:0,
      diff:null,absDiff:null,amountGap:null,amountDue:null,oursHigher:null,
      kind:'none',label:tx('尚未输入会计师预估'),direction:'',
      sameSign:true,pendingType:'none'
    };
  }

  const accountantAmount=Math.max(0,num(a.amount));
  const comparedSystemAmount=
    a.status==='credit' ? systemCredit :
    a.status==='debit' ? systemDebit :
    Math.abs(num(sys));

  const amountGap=accountantAmount-comparedSystemAmount;
  const absDiff=Math.abs(amountGap);
  const oursHigher=Math.max(0,comparedSystemAmount-accountantAmount);
  const sameSign=(Math.sign(sys)===Math.sign(a.signed)) ||
                 (Math.abs(sys)<0.005&&Math.abs(a.signed)<0.005);

  let amountDue=0;
  let kind='diff';
  let label=tx('有差额');
  let direction='';
  let pendingType='none';

  if(a.status==='debit'){
    amountDue=accountantAmount;
    pendingType='debt';
    kind=amountDue>0?'debt':'ok';
    label=amountDue>0?tx('按会计师欠款'):tx('一致');
    direction=amountDue>0
      ? `${tx('欠款')}: ${money(amountDue)}`
      : tx('无需补差');

  }else if(a.status==='credit'){
    pendingType='credit';

    if(systemCredit > accountantAmount){
      // Requested rule: our credit is higher -> pending tax credit becomes the accountant amount.
      amountDue=accountantAmount;
      kind='system';
      label=tx('系统可抵扣更高，采用会计师金额');
      direction=`${tx('待抵税')}: ${money(amountDue)}`;

    }else{
      // Requested rule: our credit is lower/equal -> accountant credit minus our credit.
      amountDue=Math.max(0,accountantAmount-systemCredit);

      if(amountDue<0.01){
        kind='ok';
        label=tx('一致');
        direction=tx('无需补差');
      }else{
        kind='debt';
        label=tx('系统可抵扣更低，计算剩余待抵税');
        direction=`${tx('待抵税')}: ${money(amountDue)}`;
      }
    }

  }else{
    amountDue=0;
    pendingType='zero';
    kind=absDiff<0.01?'ok':'diff';
    label=absDiff<0.01?tx('一致'):tx('有差额');
    direction=tx('无需补差');
  }

  if(!sameSign && Math.abs(sys)>=0.01 && Math.abs(a.signed)>=0.01){
    direction += `${direction?' · ':''}${tx('状态方向不同，请同时核对A CREDITO/A DEBITO')}`;
  }

  return {
    a,sys,
    systemDebit,systemCredit,
    sysAmount:Math.abs(num(sys)),
    comparedSystemAmount,
    diff:amountGap,
    absDiff,
    amountGap,
    amountDue,
    oursHigher,
    kind,label,direction,sameSign,pendingType
  };
};

  const c=compareAccountant(s,key),a=c.a;
  const statusClass=c.kind==='ok'?'match':c.kind==='none'?'system':c.kind==='debt'?'debt':'warn';

if(typeof appUnlocked!=='undefined' && appUnlocked && state.account){
